                {
                    en: "3. Succession & Inheritance", ur: "۳۔ وراثت اور جانشینی",
                    subs: [
                        { en: "Succession Certificate", ur: "سکسیشن سرٹیفکیٹ", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Guide to Succession Certificates — NADRA</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Under the Letters of Administration and Succession Certificates Act 2021, NADRA issues certificates within 15–30 days. Succession Certificate covers movable assets (bank accounts, stocks, prize bonds); Letter of Administration covers immovable property. Steps: (1) Cancel the deceased\'s CNIC at NADRA; (2) One heir applies with an authorisation letter from all heirs; (3) All heirs provide biometrics (abroad: Pakistani Embassy or NADRA Pak-ID App); (4) NADRA publishes a 14-day notice; (5) Certificate issued if no objections. Fee: Rs.20,000 for assets over Rs.100,000. NADRA transfers to court only if heirs dispute, a minor is involved, or biometrics fail.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>NADRA: 1777</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Inheritance Distribution", ur: "وراثت کی تقسیم", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Public Guide to Inheritance Distribution</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Shariah shares are mandatory — you cannot disinherit a legal heir. Wills (Wasiyat) are limited to 1/3 of the estate and cannot favour existing heirs without their consent. Section 498-A PPC criminalises depriving a woman of her inheritance (up to 10 years prison). After getting the NADRA Letter of Administration, take it to the ARC (Patwari) to complete the Wirasat Mutation (Intiqal), which officially transfers the property into heirs\' names. If heirs disagree, file a Partition Suit in Civil Court. Heirs can voluntarily redistribute shares via Relinquishment Deeds after legal shares are recorded.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>NADRA: 1777</strong> | <strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' }
                    ]
                },
                {
                    en: "4. Public Interest Topics", ur: "۴۔ عوامی مفاد کے موضوعات",
                    subs: [
                        { en: "Women's Rights", ur: "خواتین کے حقوق", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: #fff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; font-size: 1.5rem;">Women\'s Rights in Pakistan: Your Guide</h1></header><div style="padding: 35px; line-height: 1.8; color: #333;"><p><strong>Safety:</strong> Domestic Violence Act 2026 criminalises economic and emotional abuse; marital intimidation is now a specific offence; a Residence Order can evict the abuser while you stay. Anti-Rape Act 2020 mandates 4-month trials; the Two-Finger Test is illegal and criminal. <strong>Digital:</strong> Sextortion (Section 21) and cyberstalking (Section 24) carry heavy penalties; report to FIA at 9911. <strong>Workplace:</strong> The 2022 Amendment covers students, domestic workers, and freelancers. <strong>Inheritance:</strong> Section 498-A PPC protects your share; NADRA issues certificates within 30 days. <strong>Marriage:</strong> Ensure Column 18 of your Nikkahnama is not crossed out. <strong>Custody:</strong> Poverty is not a ground to deny a mother custody.</p></div><footer style="background-color: #002147; color: #fff; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid: 1099</strong> | <strong>Cybercrime: 9911</strong> | <strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Domestic Violence", ur: "گھریلو تشدد", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: #fff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; font-size: 1.5rem;">Domestic Violence Protection: Public Legal Guide</h1></header><div style="padding: 30px; line-height: 1.8; color: #333;"><p>Domestic violence now includes physical abuse, emotional/psychological abuse (insults, threats of divorce or second marriage), economic abuse (denying kharcha, hiding property documents), and stalking. Immediate remedies without waiting for divorce or criminal trial: Protection Order (banning contact/proximity); Residence Order (you stay, abuser leaves); Monetary Order (medical bills, maintenance). Document with MLC, digital trails, and witnesses. Call 1099, 1043, 15, or 9911. File at a police station or directly in Family Court with assistance from a Women Protection Officer. Request in-camera proceedings for privacy.</p></div><footer style="background-color: #002147; color: #fff; padding: 15px; text-align: center; font-size: 0.9rem; border-top: 5px solid #D4AF37;"><strong>Legal Aid: 1099</strong> | <strong>Police: 15</strong> | <strong>Cybercrime: 9911</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Tax Law & FBR Compliance", ur: "ٹیکس قوانین اور ایف بی آر", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 12px; overflow: hidden; max-width: 900px; margin: 20px auto;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Tax Law: A Citizen\'s Guide</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Being a filer (on the Active Taxpayers List) dramatically reduces withholding tax on bank withdrawals, property purchases, and vehicle registration. Any citizen earning over Rs.600,000/year must file. Register for an NTN via the FBR IRIS portal using your CNIC. File a Wealth Statement reconciling income with assets — unexplained expenses may trigger an FBR notice. FBR cannot freeze your account without prior notice and a final assessment order (Section 140). Appeal unfair assessments to the Commissioner (Appeals) or approach the Federal Tax Ombudsman (FTO) at 1144. Always collect tax deduction certificates from your bank, telecom company, and employer.</p></div><footer style="background-color: #002147; color: white; padding: 15px; text-align: center; font-size: 0.85rem;"><strong>FBR: 051-111-772-772</strong> | <strong>Tax Ombudsman: 1144</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Consumer Rights & Protection", ur: "صارفین کے حقوق", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 12px; overflow: hidden; max-width: 900px; margin: 20px auto;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Consumer Protection: Your Rights</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Under Provincial Consumer Protection Acts (e.g., PCPA 2005), sellers must provide receipts, repair/replace defective goods or refund money, and display prices and expiry dates. "No Return / No Exchange" signs are legally void for defective items. Filing in Consumer Court is free and a lawyer is not required. Process: Send a written legal notice via registered post within 15 days; if no response, file a claim in District Consumer Court within 30 days, seeking product cost plus damages. Keep the original receipt, defect photos, and courier receipt as evidence. Always record an unboxing video for online purchases.</p></div><footer style="background-color: #002147; color: white; padding: 15px; text-align: center; font-size: 0.85rem;"><strong>Consumer Helpline: 0800-08808</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Traffic Laws", ur: "ٹریفک قوانین", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: #fff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; font-size: 1.5rem;">Pakistan Road & Traffic Laws: Public Guide</h1></header><div style="padding: 30px; line-height: 1.8; color: #333;"><p>E-Licenses via DLIMS or Raasta App are 100% legally valid. Minimum age: 18 for non-commercial, 21 for commercial vehicles. Open Transfer Letters are no longer valid — complete biometric transfer immediately after buying a used vehicle. ANPR cameras automatically issue e-challans for red-light violations, stopping on zebra crossings, no helmet, wrong-way driving, and texting while driving. Check e-challan status monthly using vehicle number and CNIC. Unpaid challans lead to vehicle blacklisting — you cannot pay tokens or transfer ownership. No officer can collect cash on the spot; all fines are paid digitally via PSID. Report corruption to 1915.</p></div><footer style="background-color: #002147; color: #fff; padding: 15px; text-align: center; font-size: 0.9rem; border-top: 5px solid #D4AF37;"><strong>Traffic Helpline: 1915</strong> | <strong>Motorway: 130</strong> | <strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' }
                    ]
                }
            ]
        };

        /* ═══════════════════════════════════════════════════
           TRANSLATION CACHE
        ═══════════════════════════════════════════════════ */
        const translationCache = {};

        /* ═══════════════════════════════════════════════════
           STATE
        ═══════════════════════════════════════════════════ */
        let currentLang = 'en';
        // Track the currently displayed content for re-render on language toggle
        let currentView = { type: 'welcome' }; // type: 'welcome' | 'item' | 'sub'

        /* ═══════════════════════════════════════════════════
           TRANSLATION via Claude API
        ═══════════════════════════════════════════════════ */
        async function translateToUrdu(htmlContent, cacheKey) {
            if (translationCache[cacheKey]) {
                return translationCache[cacheKey];
            }

            const response = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "claude-sonnet-4-20250514",
                    max_tokens: 1000,
                    messages: [{
                        role: "user",
                        content: `You are a professional legal translator specializing in Pakistani law. Translate the TEXT CONTENT of the following HTML into clear, formal Urdu (Nastaliq script). 

CRITICAL RULES:
- Preserve ALL HTML tags, attributes, and structure EXACTLY as-is
- Only translate the visible text content between tags
- Keep all legal terms, section numbers (like "Section 302 PPC"), article numbers, phone numbers, and helpline numbers unchanged
- Keep English acronyms like PPC, CrPC, MFLO, FIA, NAB, NADRA, CNIC, MLC, FIR, RTI etc. unchanged
- Keep proper nouns like Pakistan, Qanoon 24/7, NADRA unchanged
- Return ONLY the translated HTML with no preamble, explanation, or markdown

HTML to translate:
${htmlContent}`
                    }]
                })
            });

            const data = await response.json();
            const translated = data.content[0].text;
            translationCache[cacheKey] = translated;
            return translated;
        }

        /* ═══════════════════════════════════════════════════
           WELCOME SCREEN
        ═══════════════════════════════════════════════════ */
        const defaultWelcome = {
            en: {
                eyebrow: "Pakistan's Public Legal Resource",
                title: "Empowering Pakistani Citizens",
                description: "Qanoon 24/7 translates Pakistan's complex legal framework into clear, actionable guidance for every citizen. Whether you face an unjust arrest, a property dispute, or simply wish to understand your constitutional protections — the law is on your side.",
                steps: [
                    { numeral: "I", label: "Select a Category", body: "Browse the three legal domains in the sidebar — Fundamental Rights, Criminal Law, or Civil Law." },
                    { numeral: "II", label: "Choose Your Topic", body: "Expand the category and select the specific legal issue or right most relevant to your situation." },
                    { numeral: "III", label: "Read and Act", body: "Each guide provides the relevant law, practical steps, helpline numbers, and remedies in plain language." }
                ],
                stats: [
                    { number: "3", label: "Legal Domains" },
                    { number: "40+", label: "Topics Covered" },
                    { number: "24/7", label: "Always Available" }
                ]
            },
            ur: {
                eyebrow: "پاکستان کا عوامی قانونی پورٹل",
                title: "کیا آپ اپنے حقوق جانتے ہیں؟",
                description: "قانون 24/7 پاکستان کے پیچیدہ قانونی نظام کو ہر شہری کے لیے واضح اور قابلِ عمل رہنمائی میں پیش کرتا ہے۔ چاہے غیر قانونی گرفتاری ہو، جائیداد کا تنازعہ ہو، یا بس اپنے آئینی حقوق جاننے ہوں — قانون آپ کے ساتھ ہے۔",
                steps: [
                    { numeral: "I", label: "زمرہ منتخب کریں", body: "سائڈبار میں تین قانونی شعبوں میں سے کوئی ایک چنیں — بنیادی حقوق، فوجداری قانون، یا دیوانی قانون۔" },
                    { numeral: "II", label: "موضوع چنیں", body: "زمرہ کھولیں اور اپنی صورتحال سے متعلق مخصوص قانونی مسئلہ یا حق منتخب کریں۔" },
                    { numeral: "III", label: "پڑھیں اور عمل کریں", body: "ہر رہنمائی میں متعلقہ قانون، عملی اقدامات، ہیلپ لائن نمبر اور چارہ جوئی آسان زبان میں دی گئی ہے۔" }
                ],
                stats: [
                    { number: "۳", label: "قانونی شعبے" },
                    { number: "۴۰+", label: "موضوعات" },
                    { number: "۲۴/۷", label: "ہمیشہ دستیاب" }
                ]
            }
        };

        function renderWelcome() {
            const d = defaultWelcome[currentLang];
            document.getElementById('content-title').style.display = 'none';
            document.getElementById('steps-container').innerHTML = '';
            document.getElementById('content-desc').innerHTML = `
                <span class="welcome-eyebrow anim-1">${d.eyebrow}</span>
                <h1 class="welcome-title anim-2">${d.title}</h1>
                <div class="welcome-divider anim-3"></div>
                <p class="welcome-desc anim-4">${d.description}</p>
                <div class="welcome-steps anim-5">
                    ${d.steps.map(s => `
                        <div class="welcome-step-card">
                            <span class="step-numeral">${s.numeral}</span>
                            <span class="step-label">${s.label}</span>
                            <p class="step-body">${s.body}</p>
                        </div>
                    `).join('')}
                </div>
                <div class="welcome-stats anim-6">
                    ${d.stats.map(s => `
                        <div class="stat-block">
                            <span class="stat-number">${s.number}</span>
                            <span class="stat-label">${s.label}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        /* ═══════════════════════════════════════════════════
           SHOW LOADING OVERLAY
        ═══════════════════════════════════════════════════ */
        function showOverlay(msg) {
            const overlay = document.getElementById('translationOverlay');
            document.getElementById('overlayMsg').textContent = msg || 'ترجمہ ہو رہا ہے...';
            overlay.classList.add('active');
        }

        function hideOverlay() {
            document.getElementById('translationOverlay').classList.remove('active');
        }

        function disableToggle() {
            const btn = document.getElementById('langBtn');
            btn.disabled = true;
        }

        function enableToggle() {
            const btn = document.getElementById('langBtn');
            btn.disabled = false;
        }

        /* ═══════════════════════════════════════════════════
           CONTENT DISPLAY
        ═══════════════════════════════════════════════════ */
        async function showContent(category, index) {
            const item = legalData[category][index];
            currentView = { type: 'item', category, index };

            const titleEl = document.getElementById('content-title');
            titleEl.style.display = 'block';
            document.getElementById('steps-container').innerHTML = '';

            if (currentLang === 'ur') {
                const cacheKey = `item_${category}_${index}`;
                const titleCacheKey = `title_item_${category}_${index}`;

                titleEl.innerText = item.ur || item.en;

                showOverlay();
                disableToggle();
                try {
                    const translatedDesc = await translateToUrdu(item.desc, cacheKey);
                    document.getElementById('content-desc').innerHTML = translatedDesc;
                } catch (e) {
                    document.getElementById('content-desc').innerHTML = item.desc;
                } finally {
                    hideOverlay();
                    enableToggle();
                }
            } else {
                titleEl.innerText = item.en;
                document.getElementById('content-desc').innerHTML = item.desc;
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function showSubContent(category, index, subIndex) {
            const sub = legalData[category][index].subs[subIndex];
            currentView = { type: 'sub', category, index, subIndex };

            const titleEl = document.getElementById('content-title');
            titleEl.style.display = 'block';
            document.getElementById('steps-container').innerHTML = '';

            if (currentLang === 'ur') {
                const cacheKey = `sub_${category}_${index}_${subIndex}`;

                titleEl.innerText = sub.ur || sub.en;

                showOverlay();
                disableToggle();
                try {
                    const translatedDesc = await translateToUrdu(sub.desc, cacheKey);
                    document.getElementById('content-desc').innerHTML = translatedDesc;
                } catch (e) {
                    document.getElementById('content-desc').innerHTML = sub.desc;
                } finally {
                    hideOverlay();
                    enableToggle();
                }
            } else {
                titleEl.innerText = sub.en;
                document.getElementById('content-desc').innerHTML = sub.desc;
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* ═══════════════════════════════════════════════════
           SIDEBAR
        ═══════════════════════════════════════════════════ */
        function initSidebar() {
            const sections = [
                { key: 'Fundemental', navId: 'fundemental-nav' },
                { key: 'criminal', navId: 'criminal-nav' },
                { key: 'civil', navId: 'civil-nav' }
            ];

            sections.forEach(({ key, navId }) => {
                const nav = document.getElementById(navId);
                if (!nav) return;
                nav.innerHTML = '';

                legalData[key].forEach((item, index) => {
                    const group = document.createElement('li');
                    group.className = 'category-group';
                    const label = currentLang === 'en' ? item.en : (item.ur || item.en);
                    let subItems = '';

                    if (item.subs && item.subs.length) {
                        item.subs.forEach((sub, subIndex) => {
                            const subLabel = currentLang === 'en' ? sub.en : (sub.ur || sub.en);
                            subItems += `<li class="sub-item" onclick="showSubContent('${key}',${index},${subIndex})">${subLabel}</li>`;
                        });
                    } else {
                        const viewLabel = currentLang === 'en' ? 'View Details' : 'تفصیلات دیکھیں';
                        subItems = `<li class="sub-item" onclick="showContent('${key}',${index})">${viewLabel}</li>`;
                    }

                    group.innerHTML = `
                        <div class="category-header" onclick="this.parentElement.classList.toggle('open')">
                            <span>${label}</span>
                            <span class="arrow">▶</span>
                        </div>
                        <ul class="sub-menu">${subItems}</ul>`;

                    nav.appendChild(group);
                });
            });

            // Update part headers
            if (currentLang === 'ur') {
                document.getElementById('part1-label').textContent = 'حصہ اول: بنیادی حقوق';
                document.getElementById('part2-label').textContent = 'حصہ دوم: فوجداری قانون';
                document.getElementById('part3-label').textContent = 'حصہ سوم: دیوانی قانون';
                document.getElementById('portal-title').textContent = 'عوامی پورٹل';
            } else {
                document.getElementById('part1-label').textContent = 'Part 1: Fundamental Rights';
                document.getElementById('part2-label').textContent = 'Part 2: Criminal Law';
                document.getElementById('part3-label').textContent = 'Part 3: Civil Law';
                document.getElementById('portal-title').textContent = 'Public Portal';
            }
        }

        /* ═══════════════════════════════════════════════════
           LANGUAGE TOGGLE
        ═══════════════════════════════════════════════════ */
        async function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ur' : 'en';
            document.documentElement.dir = currentLang === 'ur' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText =
                currentLang === 'ur' ? 'View in English' : 'اردو میں دیکھیں';

            initSidebar();

            // Re-render current view in new language
            if (currentView.type === 'welcome') {
                renderWelcome();
            } else if (currentView.type === 'item') {
                await showContent(currentView.category, currentView.index);
            } else if (currentView.type === 'sub') {
                await showSubContent(currentView.category, currentView.index, currentView.subIndex);
            }
        }

        /* ═══════════════════════════════════════════════════
           INIT
        ═══════════════════════════════════════════════════ */
        window.onload = function () {
            initSidebar();
            renderWelcome();
        };
    </script>
</body>
