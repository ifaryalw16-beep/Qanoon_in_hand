    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0d2137;
            --primary-mid: #0f2d48;
            --accent-gold: #ffcc00;
            --accent-gold-dim: rgba(255, 204, 0, 0.12);
            --sidebar-width: 320px;
            --body-font: 'DM Sans', 'Segoe UI', sans-serif;
            --display-font: 'Cormorant Garamond', Georgia, serif;
        }

        body {
            background-color: #f4f7f6;
            overflow-x: hidden;
            font-family: var(--body-font);
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #0d2137 0%, #0f2d48 100%);
            color: white;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
            left: 0;
            scrollbar-width: thin;
            scrollbar-color: #ffcc00 #0d2137;
        }

        [dir="rtl"] .sidebar {
            left: auto;
            right: 0;
        }

        .logo {
            background: rgba(255, 204, 0, 0.1);
            padding: 20px;
            margin: 0 15px 25px 15px;
            border-radius: 8px;
            text-align: center;
        }

        .logo h1 {
            font-size: 20px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: var(--body-font);
        }

        .part-header {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .06em;
            margin-top: 15px;
        }

        .nav-links {
            list-style: none;
        }

        .category-group {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .category-header {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            transition: 0.3s;
        }

        .category-header:hover {
            background: rgba(255, 204, 0, 0.15);
        }

        .category-header span.arrow {
            font-size: 10px;
            transition: transform 0.3s;
        }

        .category-group.open .category-header {
            color: var(--accent-gold);
        }

        .category-group.open span.arrow {
            transform: rotate(90deg);
        }

        .sub-menu {
            list-style: none;
            background: rgba(0, 0, 0, 0.2);
            display: none;
        }

        .category-group.open .sub-menu {
            display: block;
        }

        .sub-item {
            padding: 10px 35px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.2s;
        }

        .sub-item:hover {
            opacity: 1;
            color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.05);
        }

        .sub-item.active-link {
            color: var(--accent-gold);
            opacity: 1;
            font-weight: bold;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 40px;
            transition: 0.3s;
        }

        [dir="rtl"] .main-content {
            margin-left: 0;
            margin-right: var(--sidebar-width);
        }

        .top-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        .lang-toggle {
            background: var(--accent-gold);
            color: var(--primary-dark);
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-family: var(--body-font);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform .2s, box-shadow .2s;
        }

        .lang-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .lang-toggle:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .info-card {
            background: white;
            padding: 48px 52px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border-top: 6px solid var(--accent-gold);
            min-height: 80vh;
        }

        #content-title {
            color: var(--primary-dark);
            font-size: 28px;
            font-family: var(--body-font);
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        #content-desc {
            line-height: 1.8;
            color: #444;
            font-size: 16px;
        }

        /* Translation loading overlay */
        .translation-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.85);
            z-index: 10;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            border-radius: 15px;
        }

        .translation-overlay.active {
            display: flex;
        }

        .translation-overlay .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .translation-overlay p {
            color: var(--primary-dark);
            font-size: 15px;
            font-weight: 500;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-card-wrapper {
            position: relative;
        }

        .welcome-eyebrow {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--accent-gold);
            background: var(--primary-dark);
            padding: 5px 14px;
            border-radius: 2px;
            margin-bottom: 28px;
        }

        .welcome-title {
            font-family: var(--display-font);
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            color: var(--primary-dark);
            line-height: 1.15;
            margin-bottom: 24px;
            max-width: 680px;
        }

        .welcome-title em {
            font-style: italic;
            color: #8a6e00;
        }

        .welcome-divider {
            width: 48px;
            height: 3px;
            background: var(--accent-gold);
            border-radius: 2px;
            margin-bottom: 24px;
        }

        .welcome-desc {
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.85;
            color: #4a5568;
            max-width: 620px;
            margin-bottom: 52px;
        }

        .welcome-steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 48px;
        }

        .welcome-step-card {
            border: 1px solid #e8eaec;
            border-top: 3px solid var(--primary-dark);
            border-radius: 8px;
            padding: 28px 24px;
            background: #fafafa;
            transition: border-top-color .25s, box-shadow .25s, transform .25s;
        }

        .welcome-step-card:hover {
            border-top-color: var(--accent-gold);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
            transform: translateY(-3px);
        }

        .step-numeral {
            font-family: var(--display-font);
            font-size: 2rem;
            font-weight: 700;
            color: #dde2e8;
            line-height: 1;
            margin-bottom: 14px;
            display: block;
        }

        .step-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--primary-dark);
            margin-bottom: 8px;
            display: block;
        }

        .step-body {
            font-size: 13.5px;
            font-weight: 400;
            color: #5a6472;
            line-height: 1.6;
        }

        .welcome-stats {
            display: flex;
            gap: 0;
            border-top: 1px solid #edf0f2;
            padding-top: 32px;
        }

        .stat-block {
            flex: 1;
            padding-right: 32px;
            border-right: 1px solid #edf0f2;
            margin-right: 32px;
        }

        .stat-block:last-child {
            border-right: none;
            margin-right: 0;
            padding-right: 0;
        }

        .stat-number {
            font-family: var(--display-font);
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-dark);
            line-height: 1;
            display: block;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #9ca3af;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .anim-1 { animation: fadeUp .55s .05s ease both; }
        .anim-2 { animation: fadeUp .55s .15s ease both; }
        .anim-3 { animation: fadeUp .55s .22s ease both; }
        .anim-4 { animation: fadeUp .55s .30s ease both; }
        .anim-5 { animation: fadeUp .55s .40s ease both; }
        .anim-6 { animation: fadeUp .55s .50s ease both; }

        [dir="rtl"] .welcome-stats { flex-direction: row-reverse; }
        [dir="rtl"] .stat-block {
            padding-right: 0; padding-left: 32px;
            border-right: none; border-left: 1px solid #edf0f2;
            margin-right: 0; margin-left: 32px;
        }
        [dir="rtl"] .stat-block:last-child {
            border-left: none; margin-left: 0; padding-left: 0;
        }
        [dir="rtl"] .welcome-steps { direction: rtl; }

        .legal-detail-box { background: #fff; padding: 10px; }
        .legal-detail-box h3 { color: #b08d00; margin-top: 15px; }
        .legal-detail-box ul { margin-left: 20px; }

        /* Urdu font support */
        [dir="rtl"] #content-desc,
        [dir="rtl"] #content-title,
        [dir="rtl"] .welcome-desc,
        [dir="rtl"] .welcome-title,
        [dir="rtl"] .step-body,
        [dir="rtl"] .step-label {
            font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Segoe UI', sans-serif;
            line-height: 2.2;
        }
    </style>
</head>

        const legalData = {
            Fundemental: [
                { en: "1. Right to Life and Liberty", ur: "۱۔ زندگی اور آزادی کا حق", desc: '<article class="life-liberty-legal-guide" style="font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); background-color: #ffffff;"><header style="background-color: #002147; color: #ffffff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 1.5rem;">Right to Life & Liberty: Citizen\'s Guide</h1><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Your Constitutional Protections Against Arbitrary Arrest &amp; Detention</p></header><div style="padding: 30px; line-height: 1.8; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px; margin-top: 0;">1. The Core Constitutional Shields</h3><p><strong>Article 9: Security of Person (The Right to Life)</strong><br><span style="font-style: italic; color: #555;">"No person shall be deprived of life or liberty save in accordance with law."</span><br><strong>What it actually means:</strong> The police or state authorities cannot arbitrarily arrest you, harm you, or place your life in danger.<br><strong>Modern Legal Expansion:</strong> The courts have ruled that "Life" includes the right to a clean and sustainable environment, access to clean drinking water, basic healthcare, and protection from civic hazards.</p><p><strong>Article 10: Safeguards as to Arrest and Detention</strong><br>This is your primary armor if you ever face law enforcement:</p><ul style="padding-left: 20px;"><li><strong>Right to Know:</strong> You must be told exactly why you are being arrested immediately.</li><li><strong>Right to Legal Counsel:</strong> You have a constitutional right to consult and be defended by a lawyer of your own choice from the moment of arrest.</li><li><strong>The 24-Hour Rule:</strong> The police must present you before a judicial magistrate within 24 hours of your arrest. Any detention beyond 24 hours without a judge\'s explicit order (remand) is completely illegal.</li></ul><p><strong>Article 10-A: Right to Fair Trial</strong><br>Whether facing a civil dispute or a criminal accusation, you are guaranteed due process. This means you are presumed innocent until proven guilty, you have the right to an independent judge, and you have the absolute right to hear the evidence against you and cross-examine witnesses (<em>Audi Alteram Partem</em>—the right to be heard).</p></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">2. Practical Guidelines: What to Do if Stopped or Arrested?</h3><p><strong>Scenario A: You are Stopped or Detained by Law Enforcement</strong></p><ul style="padding-left: 20px;"><li><strong>Ask for Identification:</strong> Politely ask the officer for their name, rank, and the police station (Thana) they are attached to.</li><li><strong>Demand the Reason:</strong> Under Article 10, you have the legal right to ask, "Under what charge or section of the law am I being detained?"</li><li><strong>Inform Your Family:</strong> You have the right to make a phone call to inform your family or a lawyer of your location. Do not sign blank papers or write statements under pressure—forced confessions are illegal under Article 14 (Inviolability of Dignity).</li></ul><p><strong>Scenario B: If Someone is Illegally Detained (The 24-Hour Rule Broken)</strong><br>If a relative or friend is taken by authorities and not produced before a magistrate within 24 hours, they are victims of illegal confinement.</p><ul style="padding-left: 20px;"><li><strong>Immediate Action:</strong> Do not wait for weeks. Hire a lawyer to file a Habeas Corpus Petition under Article 199 in your provincial High Court.</li><li><strong>The Power of Habeas Corpus:</strong> The High Court will immediately order the police or agency to "produce the body" in court and explain under what legal authority they are holding the individual.</li></ul></section><section style="margin-bottom: 25px; background-color: #f8f9fa; border-radius: 10px; padding: 25px; border-left: 5px solid #D4AF37;"><h3 style="color: #002147; margin-top: 0;">3. Common Public Myths vs. Constitutional Facts</h3><table style="width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white;"><thead style="background-color: #002147; color: white;"><tr><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 40%;">Public Myth</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 60%;">The Constitutional Fact</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"The police can keep you in the lockup for days for questioning without a judge\'s permission."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Keeping anyone past 24 hours without a Magistrate\'s formal remand order is a severe constitutional violation.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"If I can\'t afford a lawyer, I cannot defend myself properly."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Under Article 10-A, if you face serious criminal charges and cannot afford legal representation, the state is legally bound to provide you with a defense counsel at public expense.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"The state can punish me using a newly passed law for an action I did last year."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False (Article 12).</strong> No law can be applied retrospectively to criminalize an act that was perfectly legal when you performed it.</td></tr></tbody></table></section></div><footer style="background-color: #002147; color: #ffffff; padding: 15px; text-align: center; font-size: 0.9rem; border-top: 5px solid #D4AF37;"><strong>Human Rights Helpline: 1099</strong> | <strong>Police Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "2. Inviolability and Protection Against Abuse", ur: "تحفظ اور عزت کا حق", desc: '<article class="protection-abuse-guide" style="font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); background-color: #ffffff;"><header style="background-color: #002147; color: #ffffff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 1.5rem;">Dignity &amp; Protection Against Abuse: Public Guide</h1><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Your Constitutional Shields Against Torture, Forced Labor, &amp; Unlawful Exploitation</p></header><div style="padding: 30px; line-height: 1.8; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px; margin-top: 0;">1. The Four Constitutional Protections Explained</h3><p><strong>Article 11: Absolute Ban on Slavery &amp; Child Labor</strong><br><strong>What it means:</strong> Human trafficking, slavery, and forced labor (begar) are completely outlawed. Furthermore, no child under the age of 14 years can be employed in any factory, mine, or hazardous workplace.<br><strong>Practical Reality:</strong> If a landlord, employer, or brick-kiln owner holds someone\'s national documents or restricts their movement because of an unpaid debt (bonded labor), they are committing a severe constitutional offense.</p><p><strong>Article 12: Protection Against Retroactive Laws</strong><br><strong>What it means:</strong> The state cannot pass a new law today to punish you for an action you committed last year when it was perfectly legal.<br><strong>Practical Reality:</strong> You can only be penalized based on the exact law that was active at the exact moment the act took place. Furthermore, the state cannot increase your punishment later if a harsher penalty is enacted after your trial.</p><p><strong>Article 13: Double Jeopardy &amp; Self-Incrimination</strong><br>This article contains two massive shields for anyone facing a legal dispute:</p><ul style="padding-left: 20px;"><li><strong>Double Jeopardy:</strong> You cannot be prosecuted or punished twice for the exact same crime. If a competent court acquits you, the police cannot arrest you again on the same initial charge.</li><li><strong>Right to Remain Silent:</strong> You cannot be forced to be a witness against yourself. You have the absolute right to refuse to give a statement that incriminates you.</li></ul><p><strong>Article 14: Inviolability of Dignity &amp; Privacy</strong><br><span style="font-style: italic; color: #555;">"The dignity of man and, subject to law, the privacy of home, shall be inviolable."</span><br><strong>What it means:</strong> This is perhaps the most powerful statement in the Constitution. It declares your human dignity untouchable.<br><strong>The Ban on Torture:</strong> Article 14 strictly prohibits physical or psychological torture for the purpose of extracting evidence or confessions. Any confession beaten out of a suspect in a police station holds zero legal weight in a court of law.</p></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">2. Practical Guidelines: How to Protect Yourself Against Abuse</h3><p><strong>Scenario A: Dealing with Forced Confessions or Police Abuse</strong></p><ul style="padding-left: 20px;"><li><strong>Stay Silent if Guarded:</strong> If you are detained, remember that under Article 13 and Article 14, you do not have to confess. Politely state that you will only give a formal statement in the presence of your defense lawyer.</li><li><strong>Document Injuries Immediately:</strong> If law enforcement subjects an individual to physical abuse, demand a medical examination the moment they are produced before the Judicial Magistrate (which must happen within 24 hours). Tell the Magistrate directly about the torture so it is logged on the court record.</li></ul><p><strong>Scenario B: Unauthorized House Searches &amp; Privacy Violations</strong></p><ul style="padding-left: 20px;"><li><strong>Demand a Search Warrant:</strong> Under Article 14, your home privacy is protected. Except in rare emergency chase scenarios, the police cannot enter your private residence without a formal Search Warrant issued by a Magistrate under Section 96 or 98 of the Criminal Procedure Code (CrPC).</li><li><strong>Identify the Officers:</strong> Ensure that female police officers are present if a home containing women is being searched. Note the names and ranks of the officers conducting the raid.</li></ul><p><strong>Scenario C: Reporting Forced or Bonded Labor</strong></p><ul style="padding-left: 20px;"><li><strong>Do Not Accept Forced Work:</strong> If an employer holds your CNIC, salary, or bounds your family to a workplace due to a loan, this is a violation of Article 11.</li><li><strong>Immediate Remedy:</strong> You can approach the District Vigilance Committee or file a constitutional writ petition in the High Court to secure immediate release and recovery of the individuals.</li></ul></section><section style="margin-bottom: 25px; background-color: #f8f9fa; border-radius: 10px; padding: 25px; border-left: 5px solid #D4AF37;"><h3 style="color: #002147; margin-top: 0;">3. Common Public Myths vs. Constitutional Facts</h3><table style="width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white;"><thead style="background-color: #002147; color: white;"><tr><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 40%;">The Public Myth</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 60%;">The Constitutional Fact</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"A confession signed inside a police station is enough to convict me."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Under Article 14 and the Qanun-e-Shahadat Order, confessions made in police custody are completely inadmissible unless made directly before a Magistrate.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"If the police suspect a crime, they have the right to enter and search any home at any time."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Article 14 guards your privacy. Unauthorized entry without legal warrants or valid statutory reasons constitutes illegal trespassing.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"Children can work anywhere as long as their parents give permission."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Article 11 strictly bans hazardous child labor under 14. Parental consent cannot override a child\'s fundamental constitutional rights.</td></tr></tbody></table></section></div><footer style="background-color: #002147; color: #ffffff; padding: 15px; text-align: center; font-size: 0.9rem; border-top: 5px solid #D4AF37;"><strong>Human Rights Helpline: 1099</strong> | <strong>Federal Ombudsman: 1055</strong> | <strong>Police Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "3. Fundamental Civil Freedoms", ur: "بنیادی شہری آزادیاں", desc: '<article class="civil-freedoms-guide" style="font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); background-color: #ffffff;"><header style="background-color: #002147; color: #ffffff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 1.5rem;">Fundamental Civil Freedoms: Public Guide</h1><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Your Constitutional Rights to Movement, Assembly, Free Speech &amp; Information</p></header><div style="padding: 30px; line-height: 1.8; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px; margin-top: 0;">1. The Core Constitutional Freedoms Explained</h3><p><strong>Article 15: Freedom of Movement</strong><br><strong>What it means:</strong> Every Pakistani citizen has the absolute right to move freely throughout the country, enter its borders, and reside or settle anywhere they choose.<br><strong>The Legal Boundary:</strong> The state can only restrict movement under temporary, reasonable laws passed for public interest (e.g., active quarantine zones or localized security lockouts).</p><p><strong>Article 16: Freedom of Assembly</strong><br><strong>What it means:</strong> Citizens possess the legal right to assemble peacefully, organize rallies, or host sit-ins for public or political causes.<br><strong>The Legal Boundary:</strong> Assemblies must remain entirely peaceful and without arms. The state can restrict gatherings under public order regulations, such as Section 144 of the Criminal Procedure Code (CrPC), if there is an imminent threat of violence.</p><p><strong>Article 17: Freedom of Association</strong><br><strong>What it means:</strong> This guarantees the right to form labor unions, trade associations, civil society organizations, or actively join and run political parties.<br><strong>The Legal Boundary:</strong> Associations cannot operate against state sovereignty or public morality.</p><p><strong>Article 18: Freedom of Trade, Business, or Profession</strong><br><strong>What it means:</strong> Every citizen has the right to enter any lawful profession or trade. The state cannot lock you out of a career path arbitrarily.<br><strong>The Legal Boundary:</strong> The state retains the right to regulate trades through licensing requirements (e.g., passing the Bar for lawyers or securing PMDC accreditation for doctors) or run public monopolies.</p><p><strong>Article 19 &amp; 19-A: Freedom of Speech &amp; Right to Information</strong><br><strong>What it means:</strong> You have the right to express your thoughts, write columns, and publish media safely. Furthermore, Article 19-A ensures you have a structural right to demand data on any matter of public importance from state institutions.<br><strong>The Legal Boundary:</strong> Free speech does not include hate speech or defamation. It is subject to reasonable legal constraints regarding national security, decency, and court contempt.</p></section></div><footer style="background-color: #002147; color: #ffffff; padding: 15px; text-align: center; font-size: 0.9rem; border-top: 5px solid #D4AF37;"><strong>RTI Commissions Portal</strong> | <strong>Police Emergency Helpline: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "4. Equality and Education", ur: "برابری اور تعلیم", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15);"><header style="background-color: #002147; color: #fff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin:0; font-size:1.5rem; text-transform:uppercase;">Equality &amp; Right to Education: Public Guide</h1></header><div style="padding:30px; line-height:1.8; color:#333;"><p><strong>Article 25</strong> guarantees that all citizens are equal before the law regardless of gender. <strong>Article 25-A</strong> makes free and compulsory education a fundamental right for children aged 5–16. <strong>Articles 26 &amp; 27</strong> prohibit discrimination in public places and government employment. <strong>Article 28</strong> protects the right to preserve distinct languages, scripts, and cultures.</p></div><footer style="background-color:#002147; color:#fff; padding:15px; text-align:center; font-size:0.9rem; border-top:5px solid #D4AF37;"><strong>Ministry of Human Rights: 1099</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "5. Religious and Property Liberties", ur: "مذہبی اور جائیداد کی آزادی", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15);"><header style="background-color: #002147; color: #fff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin:0; font-size:1.5rem; text-transform:uppercase;">Religious &amp; Property Liberties: Public Guide</h1></header><div style="padding:30px; line-height:1.8; color:#333;"><p><strong>Article 20</strong> guarantees the right to profess and practise religion and manage religious institutions. <strong>Articles 21 &amp; 22</strong> protect against forced religious taxation and educational coercion. <strong>Articles 23 &amp; 24</strong> protect the right to own, hold, and dispose of property; the state cannot seize private land without lawful public purpose and just compensation.</p></div><footer style="background-color:#002147; color:#fff; padding:15px; text-align:center; font-size:0.9rem; border-top:5px solid #D4AF37;"><strong>National Commission for Human Rights: 1099</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
            ],
            criminal: [
                {
                    en: "1. Offenses Against Person", ur: "۱۔ انسانی جان کے خلاف جرائم",
                    subs: [
                        { en: "Qatl-e-Amd", ur: "قتل عمد", desc: '<article style="font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; border: 2px solid #002147; border-radius: 12px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.12); background-color: #ffffff;"><header style="background-color: #002147; color: #ffffff; padding: 30px; border-bottom: 4px solid #D4AF37;"><h2 style="margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px; text-align: center">Criminal Offenses: Sections 300 &amp; 302 PPC</h2><p style="margin: 5px 0 0; color: #D4AF37; font-size: 1rem; font-weight: 500;">Intentional Murder, Legal Realities, Victim Rights, and Procedural Checklists</p></header><div style="padding: 30px; line-height: 1.8; color: #333;"><p><strong>Sections 300 &amp; 302 PPC</strong> cover intentional murder. Punishment can be death (Qisas) or life imprisonment (Tazir). The victim\'s family (Wali) can forgive (Sulh), accept blood money (Diyat — minimum value of 30,630g silver), or the court may impose 10–25 years for particularly brutal crimes (Fasad-fil-Arz). Honour killings are non-compoundable; even if the family forgives, the court must sentence the offender to at least 25 years. File an immediate FIR, preserve evidence, and request forensic testing at PFSA.</p></div><footer style="background-color: #002147; color: #ffffff; padding: 12px; text-align: center; font-size: 0.85rem; border-top: 4px solid #D4AF37;"><strong>Emergency Dial: 15</strong> | <strong>Qanoon 24/7 Portal Resource</strong></footer></article>' },
                        { en: "Qatl-e-Shib-i-Amd", ur: "قتل شبہ عمد", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 12px; overflow: hidden; max-width: 850px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.15);"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; letter-spacing: 1px; text-transform: uppercase;">Qatl-e-Shibh-i-Amd: Legal Guidelines</h2><p style="margin: 5px 0 0; color: #D4AF37; font-weight: bold;">Quasi-Intentional Homicide under Section 316 PPC</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Under Section 315 PPC, Shibh-i-Amd occurs when the offender intends harm but not death, yet death results. Punishment includes Diyat (blood money equivalent to 30,630g silver) and up to 25 years imprisonment under Section 316. Using blunt objects or hands supports a Shibh-i-Amd plea; using a firearm makes it harder. Providing immediate medical aid to the victim is strong evidence of lack of murderous intent.</p></div><footer style="background-color: #002147; color: white; padding: 15px; text-align: center; font-size: 0.85rem;"><strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Rape Laws & Victim Guide", ur: "ریپ قوانین اور متاثرہ رہنمائی", desc: '<article style="font-family: Segoe UI, sans-serif; border: 1px solid #e1e8ed; border-radius: 12px; max-width: 950px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.08);"><header style="background-color: #002147; color: #fff; padding: 35px 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; font-size: 1.6rem;">Anti-Rape Laws & Protection: Public Guide</h1></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p><strong>Sections 375 &amp; 376 PPC</strong> cover rape (non-consensual intercourse via force, fear, or fraud). Punishment: 10–25 years or death for individual rape; mandatory life imprisonment or death for gang rape. The Anti-Rape Act 2020 mandates trials within 120 days and bans attacking the victim\'s character. The Two-Finger Test is illegal. Do not wash clothes; file an FIR immediately; request an in-camera statement before a Magistrate. Rape is non-compoundable — jirga settlements have no legal validity.</p></div><footer style="background-color: #002147; color: #fff; padding: 20px; text-align: center; font-size: 0.95rem; border-top: 4px solid #D4AF37;"><strong>Human Rights Helpline: 1099</strong> | <strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Hurt", ur: "ضرب (اتلافِ عضو)", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 12px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 4px solid #D4AF37;"><h2 style="margin:0; text-transform:uppercase;">Injured in an Attack? Your Action Plan</h2><p style="margin: 5px 0 0; color: #D4AF37; font-weight: bold;">Justice and Compensation under PPC 332–337</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Go to a <strong>Government Hospital</strong> first to obtain a Medico-Legal Certificate (MLC). File an FIR with the MLC attached. Compensation ranges from Daman (bills/pain) for minor scratches to 5% Diyat for exposed bone, 10% for fractures, and 33.3% Diyat for body-cavity wounds. Maximum jail terms range from 2 to 10 years depending on injury severity. If the police refuse to register, file a 22-A Application in court.</p></div><footer style="background-color: #002147; color: white; padding: 12px; text-align: center; font-size: 0.85rem; border-top: 4px solid #D4AF37;"><strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Kidnapping & Abduction", ur: "اغوا اور اغوا کاری", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 12px; overflow: hidden; max-width: 850px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.15);"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; letter-spacing: 1px; text-transform: uppercase;">Kidnapping & Abduction: Survival Guide</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Act within the first hour: check GPS/device tracking, recover CCTV footage (overwritten within 48 hours), and visit local ERs. Kidnapping for ransom (Section 365-A) carries death or life imprisonment; abduction for marriage (Section 365-B) carries life imprisonment. If the SHO refuses an FIR, file a Section 22-A petition. Consent of minors under 16 (girls) or 14 (boys) is legally irrelevant. Never pay investigation costs — report bribery to 1715.</p></div><footer style="background-color: #002147; color: white; padding: 15px; text-align: center; font-size: 0.85rem;"><strong>Emergency: 15</strong> | <strong>CPLC: 021-35662222</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Assault & Criminal Force", ur: "حملہ اور مجرمانہ طاقت", desc: '<article style="font-family: Segoe UI, sans-serif; border: 1px solid #002147; border-radius: 12px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center;"><h2 style="margin: 0; text-transform: uppercase;">Assault & Criminal Force: Your Rights</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold;">PPC Sections 349–358</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p><strong>Criminal Force (Section 350)</strong> is intentional physical force without consent. <strong>Assault (Section 351)</strong> requires no physical contact — a threatening gesture is enough. Assault on a woman (Section 354) and assault to dishonor (Section 355) are non-bailable. File the FIR under Section 352 or 354. If refused, use the 22-A petition. These cases are compoundable — use this as leverage to recover Daman (damages).</p></div><footer style="background-color: #002147; color: white; padding: 15px; text-align: center; font-size: 0.85rem;"><strong>Police: 15</strong> | <strong>Women\'s Helpline: 1094</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Wrongful Restraint", ur: "غلط راستہ روکنا اور قید", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 12px; max-width: 850px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 4px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Freedom of Movement: Your Rights — PPC 339–348</h2></header><div style="padding: 25px; line-height: 1.6; color: #333;"><p><strong>Wrongful Restraint (Section 339)</strong> blocks one direction of movement. <strong>Wrongful Confinement (Section 340)</strong> blocks all directions. A landlord locking a tenant out without a court order is illegal confinement. Police detaining someone without a legal entry in the Roznamcha is also illegal — file a Habeas Corpus (Section 491 CrPC) petition in court. Remedies include FIR under Section 341/342, Habeas Corpus, and a civil suit for damages.</p></div><footer style="background-color: #f4f4f4; padding: 15px; font-size: 0.85rem; text-align: center; border-top: 1px solid #ddd;"><strong>Emergency: 15</strong> | <strong>Police Complaint: 1715</strong> | <strong>Qanoon 24/7</strong></footer></article>' }
                    ]
                },
                {
                    en: "2. Offenses Against Property", ur: "۲۔ جائیداد کے خلاف جرائم",
                    subs: [
                        { en: "Theft (Sariqah)", ur: "سرقہ (چوری)", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 12px; overflow: hidden; max-width: 850px; margin: 20px auto;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Theft: Penalties & Legal Guidelines</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Simple theft (Section 379): 3 years + fine. Theft in a house (Section 380): 7 years. Vehicle theft (Section 381-A): 7 years. Buying stolen goods (Section 411): 3 years. Hadd (amputation) has extremely high evidentiary requirements and is applied in under 1% of cases. Call 15 immediately to create a timestamped record. File an FIR with specific identifiers (IMEI, engine number). Use a Superdari Application to recover seized property. Simple theft is compoundable.</p></div><footer style="background-color: #002147; color: white; padding: 15px; text-align: center; font-size: 0.85rem;"><strong>Emergency: 15</strong> | <strong>Bribery Complaints: 1715</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Extortion", ur: "بھتہ خوری", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 12px; max-width: 850px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Extortion (Bhatta) & Blackmail</h2><p style="margin: 5px 0 0; color: #D4AF37; font-weight: bold;">PPC Sections 383–389 & Anti-Terrorism Act</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Simple extortion (Section 384): 3 years. Extortion by death threat (Section 386): 10 years. Organised Bhatta (Section 7(h) ATA): 14 years to life. Photo-blackmail is both extortion and a PECA 2016 cybercrime — do not pay; report to FIA immediately. Forcing someone to sign a document under fear is also extortion. Save all digital evidence and use Section 22-A if the SHO refuses to act.</p></div><footer style="background-color: #002147; color: white; padding: 15px; text-align: center; font-size: 0.85rem;"><strong>Emergency: 15</strong> | <strong>Cyber Crime: 1799</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Robbery & Dacoity", ur: "ڈکیتی", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 12px; max-width: 850px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Robbery & Dacoity: Legal Protection</h2><p style="margin: 5px 0 0; color: #D4AF37;">PPC Sections 390–402</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Robbery is theft using force or threat; Dacoity is robbery by 5+ people. Simple robbery (Section 392): 10–14 years. Robbery with attempted murder (Section 394): life imprisonment. Dacoity with murder (Section 396): death penalty. You have the Right of Private Defence (Sections 96–106) to use proportionate force. Call 15 immediately, note partial vehicle numbers, and use a 22-A petition if the SHO refuses the FIR.</p></div><footer style="background-color: #002147; color: white; padding: 15px; text-align: center; font-size: 0.85rem;"><strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Criminal Breach of Trust", ur: "امانت میں خیانت", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 12px; max-width: 850px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Betrayal of Trust (CBT): Your Rights — PPC 405–409</h2></header><div style="padding: 25px; line-height: 1.6; color: #333;"><p>CBT is when property entrusted to someone (servant, partner, friend) is dishonestly misappropriated. Servant CBT (Section 408) carries a higher penalty than simple CBT. Bank employee misuse falls under Section 409 and is investigated by the FIA with potential life imprisonment. Gather receipts, bank transfers, and WhatsApp chats as evidence. Send a legal notice first to create a formal record. File an FIR for punishment; use a civil Recovery Suit to get money back.</p></div><footer style="background-color: #f4f4f4; padding: 15px; font-size: 0.85rem; text-align: center; border-top: 1px solid #ddd;"><strong>Emergency: 15</strong> | <strong>Bank Fraud: 1991 (FIA)</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Cheating", ur: "دھوکہ دہی", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 12px; max-width: 850px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Cheating & Fraud: Protect Your Assets — PPC 415–420</h2></header><div style="padding: 25px; line-height: 1.6; color: #333;"><p>Cheating is a crime only if intent to deceive existed at the time of the transaction. Selling a forged plot or land you do not own is a clear Section 420 case. Call FIA Cybercrime (1991) immediately for online scams — they can freeze accounts quickly. Always pay via bank transfer to create a money trail. Never pay cash without a receipt. Send a formal legal notice before filing an FIR to demonstrate good faith.</p></div><footer style="background-color: #f4f4f4; padding: 15px; font-size: 0.85rem; text-align: center; border-top: 1px solid #ddd;"><strong>Police: 15</strong> | <strong>Cyber Fraud: 1991</strong> | <strong>Qanoon 24/7</strong></footer></article>' }
                    ]
                },
                {
                    en: "3. Public Tranquility & Morals", ur: "۳۔ عوامی امن اور اخلاقیات",
                    subs: [
                        { en: "Unlawful Assembly", ur: "غیر قانونی اجتماع", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 12px; max-width: 850px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Protests & Unlawful Assembly — PPC 141–149</h2></header><div style="padding: 25px; line-height: 1.6; color: #333;"><p>If you are in an unlawful crowd, you are legally responsible for everything the crowd does (joint liability). Under Section 144 CrPC, your presence in a group is enough to charge you under Section 188 PPC. Police can use civil force to disperse crowds under Section 128 CrPC. Always carry your CNIC, document your route digitally, and stay away from government buildings during unrest.</p></div><footer style="background-color: #f4f4f4; padding: 15px; font-size: 0.85rem; text-align: center;"><strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Rioting", ur: "ہنگامہ آرائی", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 12px; max-width: 850px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Rioting & Public Violence — PPC 146–153</h2></header><div style="padding: 25px; line-height: 1.6; color: #333;"><p>A gathering becomes a Riot the moment force is used. Every person in the crowd is liable under Section 149, regardless of personal action. Being armed during a riot (Section 148) increases jail time to 3 years. Police may use lethal force under Sections 127–128 CrPC if the crowd does not disperse. If arrested, use Google Timeline to prove you were a bystander, not a participant.</p></div><footer style="background-color: #f4f4f4; padding: 15px; font-size: 0.85rem; text-align: center;"><strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Gambling (Qamar Bazi)", ur: "قمار بازی (جوا)", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 12px; max-width: 850px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Gambling & Betting Laws — Prevention of Gambling Act 1977</h2></header><div style="padding: 25px; line-height: 1.6; color: #333;"><p>Both the house and the player are criminals in Pakistan. Merely being present during a gambling raid is enough for arrest. Online sports betting via apps is illegal; the FIA monitors transactions and can permanently block mobile wallets used for betting. Never link your bank account or CNIC to international betting sites — these are flagged by the State Bank of Pakistan as suspicious activity.</p></div><footer style="background-color: #f4f4f4; padding: 15px; font-size: 0.85rem; text-align: center;"><strong>Police: 15</strong> | <strong>FIA Cybercrime: 1991</strong> | <strong>Qanoon 24/7</strong></footer></article>' }

                    en: "4. Offenses Against the State", ur: "۴۔ ریاست کے خلاف جرائم",
                    subs: [
                        { en: "Sedition", ur: "بغاوت", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 12px; max-width: 850px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Sedition & Free Speech — Article 19 Constitution</h2></header><div style="padding: 25px; line-height: 1.6; color: #333;"><p>Section 124-A PPC (Sedition) was struck down by the Lahore High Court as a violation of Article 19. Criticism of the government is not sedition. Allowed speech: "The government is corrupt," "We need new elections." Not allowed: direct incitement to violence or destruction. Use data and evidence in your criticism. If harassed for your speech, call the Sindh Legal Advisory Call Center (0800-70806) or Punjab Helpline (1043).</p></div><footer style="background-color: #f4f4f4; padding: 15px; font-size: 0.85rem; text-align: center;"><strong>Legal Helpline: 0800-70806</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Waging War", ur: "پاکستان کے خلاف جنگ", desc: '<article style="font-family: Segoe UI, sans-serif; border: 2px solid #002147; border-radius: 12px; max-width: 850px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Waging War Against the State — PPC 121–123</h2></header><div style="padding: 25px; line-height: 1.6; color: #333;"><p>Section 121 is one of the few laws where attempt and abetment are punished as severely as the act itself — including joining armed insurrection. Section 121-A covers conspiracy even without an act of violence. Concealing knowledge of a plot (Section 123) carries up to 10 years. Report suspicious activity or arms caches to the Counter-Terrorism Department (CTD) or nearest police station. Article 5 of the Constitution makes loyalty to the state a basic duty of every citizen.</p></div><footer style="background-color: #f4f4f4; padding: 15px; font-size: 0.85rem; text-align: center;"><strong>Emergency: 15</strong> | <strong>CTD Helpline</strong> | <strong>Qanoon 24/7</strong></footer></article>' }

                {
                    en: "5. Modern & White Collar Crimes", ur: "۵۔ جدید اور وائٹ کالر جرائم",
                    subs: [
                        { en: "Cyber Crimes (PECA)", ur: "سائبر جرائم (PECA)", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">The Citizen\'s Cyber Defense Manual — PECA 2025/2026</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Key offenses and 2026 penalties: Fake news/disinformation (Section 26-A): 3 years + Rs.2M fine. Morphing/deepfakes (Section 21): up to 7 years + Rs.5M fine. Cyberstalking (Section 24): 3 years + Rs.1M fine. Financial fraud/phishing (Section 13): 3 years + Rs.5M fine. Identity theft (Section 16): 3 years + Rs.5M fine. Always save the URL, not just a screenshot. Report to NCCIA at 1799 (24/7). The SMPRA (2025) can force platforms to remove harmful content within 24–48 hours.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>NCCIA Emergency: 1799</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Corruption (NAB/FIA)", ur: "بدعنوانی اور رشوت ستانی", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Anti-Corruption Citizen Manual — 2026 Edition</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Report federal departments (WAPDA, NADRA, FIA, Passport) to FIA/NAB: dial 1991 or 108. Provincial departments (Police, Patwari, Health) go to Anti-Corruption Establishment (ACE): Punjab dial 1350. Use the Pakistan Citizen\'s Portal App for any department. Never pay a fee without a Challan Form (32-A). Use RTI requests to make stalled files move instantly. The ACE can organise a "Trap Raid" with marked currency notes. Reporting a policeman to ACE — not his own station — gets him suspended.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>NAB: 108</strong> | <strong>ACE Punjab: 1350</strong> | <strong>Qanoon 24/7</strong></footer></article>' }
                    ]

                {
                    en: "6. Procedural Rights", ur: "۶۔ طریقہ کار کے حقوق",
                    subs: [
                        { en: "FIR", ur: "ایف آئی آر", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">FIR & Police Procedures — Section 154 CrPC</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>An FIR must include: who, when, where, what (factual narration — no exaggerations), names of witnesses, and mention of available evidence (CCTV, MLC, shell casings). Filing is 100% free. If police refuse, approach the Justice of Peace (Sessions Judge) under Section 22-A CrPC. In 2026, apps like Punjab Police Dost, Sindh Police CMS, and KP Police E-Policing allow digital complaints. Report misconduct to 1715. Never file a false FIR — Section 182 PPC carries up to 6 months in jail.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Police Emergency: 15</strong> | <strong>IGP Complaints: 1715</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Rights of the Accused", ur: "ملزم کے حقوق", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Rights of the Accused: From Arrest to Detention</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>At arrest: you must be told the grounds immediately (Article 10(1)). During interrogation: you cannot be forced to testify against yourself (Article 13(b)); confessions to police are inadmissible in court (Qanoon-e-Shahadat Articles 38/39). In custody: you must be produced before a Magistrate within 24 hours (Article 10(2)). No torture permitted (Article 14). Assert your right to remain silent and request a lawyer. If mistreated, demand a medical exam under Section 54 CrPC when produced before the Magistrate.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Human Rights: 1099</strong> | <strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Bail", ur: "ضمانت", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Bail & Release — CrPC 496–498</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Types: Pre-Arrest (Anticipatory) bail before arrest; Protective bail when in a different city; Post-Arrest bail after arrest; Statutory bail if trial exceeds 1 year (men) or 6 months (women). For offences under 10 years, bail is generally available unless exceptional circumstances exist. Medical grounds (illness, old age, women) allow extra judicial discretion. If you miss a court date, bail can be cancelled and an NBW issued. Only the granting court or a higher court can cancel bail — not the police.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' }

                {
                    en: "1. Family & Personal Laws", ur: "۱۔ خاندانی قوانین",
                    subs: [
                        { en: "Nikah and Polygamy", ur: "نکاح اور تعدد ازدواج", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Nikah & Polygamy Rights — MFLO 1961</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>A valid Nikah requires legal age (18/16 in Punjab, KP, Balochistan; 18 for both in Sindh), Ijab-o-Qubul, two adult witnesses, specified Mahr, and free consent. An adult Muslim woman does not legally require a Wali\'s consent. For polygamy, the husband must obtain written permission from the Union Council Arbitration Council — bypassing this makes the entire Mahr immediately payable and constitutes a criminal offence. Always obtain a NADRA Marriage Registration Certificate (MRC) for official recognition.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "NikahNama and Nikkah Registration", ur: "نکاح نامہ اور رجسٹریشن", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Nikkahnama & Registration — MFLO 1961</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>The Nikkahnama has 25 columns. Key columns: 13–16 (Mahr — Mu\'ajjal prompt or Mu\'wajjal deferred), 18 (Talaq-e-Tafweez — delegated right of divorce to wife), 19–20 (special conditions such as wife\'s right to work or monthly allowance), 21–22 (polygamy permission). It is illegal for a Registrar to cross out Columns 18–22 without the bride\'s consent. The Nikkah Khawan must register with the Union Council within 30 days. Non-registration is a criminal offence. Obtain a NADRA MRC for all official purposes.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Rights of Husband and Wife", ur: "شوہر اور بیوی کے حقوق", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Spousal Rights & Obligations — MFLO</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Wife\'s rights: Maintenance (Nafqah) covering food, clothing, medical care, and housing — absolute regardless of the wife\'s own income; full ownership of Mahr (Mu\'ajjal on demand, Mu\'wajjal on divorce/death); delegated right of divorce (Talaq-e-Tafweez) if Column 18 is signed; protection against unauthorised polygamy under MFLO Section 6. Husband\'s rights: Talaq with mandatory 90-day notice to Union Council; conditional polygamy; right to consortium. The NADRA MRC is mandatory for CNICs, passports, child registration, and inheritance.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Khula & Talaq", ur: "خلع اور طلاق", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Dissolution of Marriage — Talaq, Khula & Faskh</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p><strong>Talaq:</strong> Written notice to Union Council Chairman + copy to wife; 90-day reconciliation period; divorce effective after 90 days if reconciliation fails; full Mahr must be paid. <strong>Khula:</strong> Wife files in Family Court; no husband consent required; wife usually returns Mahr or waives unpaid portion. <strong>Faskh:</strong> Judicial dissolution under Dissolution of Muslim Marriages Act 1939 based on grounds such as desertion (4 years), failure to maintain (2 years), cruelty, or imprisonment (7+ years). Must register Divorce Effectiveness Certificate with Union Council. Custody decided separately in Guardian Court.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Maintenance (Nan-Nafqa)", ur: "نان نفقہ (خرچہ)", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Citizen\'s Guide to Maintenance Law</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>A husband must maintain his wife regardless of her income. Children\'s maintenance is the father\'s sole responsibility: sons until age 18 (or longer for higher education), daughters until marriage. Gather CNIC, Nikkahnama, school fee vouchers, and proof of husband\'s income. Under Section 17-A of the Family Courts Act, interim maintenance is fixed within 1–3 months of filing. Non-payment allows the court to freeze bank accounts, attach salary, seize property, or imprison the defaulter for 6 months to 1 year. Past maintenance claimable: wife up to 3 years; children up to 6 years.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid: 1043</strong> | <strong>Human Rights: 1099</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Child Custody", ur: "بچوں کی تحویل (حضانت)", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Citizen\'s Guide to Child Custody Law</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>The supreme principle is the Welfare of the Minor — not parental rights. Hizanat (physical custody) generally belongs to the mother: boys up to age 7, girls until puberty. Wilayat (guardianship) belongs to the father for major decisions. A mother\'s remarriage does not automatically end her custody. Poverty is not a ground to deny a mother custody — the court will order the father to pay maintenance. Apply for Visitation Rights / Temporary Custody under Section 12 of the Guardians and Wards Act if access is denied. The child\'s own preference matters from approximately age 7–10.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid: 1043</strong> | <strong>Human Rights: 1099</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Inheritance", ur: "وراثت", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Citizen\'s Guide to Inheritance Law</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>Shariah shares are mandatory and cannot be waived by force. Denying a woman her inheritance share is a criminal offence under Section 498-A PPC (up to 10 years). A "nominee" on a bank account is only a trustee — funds must be distributed among all legal heirs. A will (Wasiyat) can only cover 1/3 of the estate and cannot favour existing legal heirs without unanimous consent. NADRA can issue Succession Certificates for movable assets and Letters of Administration for immovable property within 15–30 days without going to court, provided all heirs provide biometrics. No time limit exists to claim inheritance.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid: 1043</strong> | <strong>Human Rights: 1099</strong> | <strong>Qanoon 24/7</strong></footer></article>' }
                    ]

                {
                    en: "2. Property & Land Laws", ur: "۲۔ جائیداد اور اراضی کے قوانین",
                    subs: [
                        { en: "Stay Orders", ur: "سٹے آرڈرز (حکم امتناہی)", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Citizen\'s Guide to Stay Orders</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>To get a stay order, prove the Triple Test: (1) Serious case — arguable legal grounds; (2) Irreparable loss — damage money cannot fix; (3) Balance of convenience — you suffer more without the stay. Use an "Urgency Slip" for same-day hearings. If the judge is hesitant, ask for a "Status Quo" order to freeze the situation. An Ex-Parte stay lasts only 15 days — serve the other party immediately. Take a certified copy to the local SHO and have it entered in the Roznamcha to enforce it physically. Do not conceal facts — doing so can result in the stay being cancelled and a heavy fine.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid: 1043</strong> | <strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Illegal Dispossession", ur: "غیر قانونی قبضہ", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Protection Against Land Grabbing — IDA 2005</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>The Illegal Dispossession Act 2005 allows immediate court action without years of civil litigation. Land grabbers face up to 10 years imprisonment. File a complaint directly in the Sessions Court (faster than Civil Court) and request "interim possession." The judge will direct a Police/Revenue Officer to visit the site within 15 days. Bring utility bills, photos, and neighbor testimonials as proof of possession. A tenant can also file against a landlord who forcibly evicts without a court order. If the land is sold to a third party by an illegal occupant, ownership cannot pass (Nemo dat quod non habet).</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid: 1043</strong> | <strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Land Records (Fard/Mutation)", ur: "اراضی ریکارڈ (فرد اور انتقال)", desc: '<article style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden;"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase;">Guide to Land Records — Fard & Mutation</h2></header><div style="padding: 30px; line-height: 1.7; color: #333;"><p>The Fard is your official proof of ownership (Fard-e-Malkiat for record, Fard-e-Baye to sell, Fard-e-Zamanat for bail). Having only a Registry (Sale Deed) is not enough — the Mutation (Intiqal) must be done at the ARC to transfer the land officially. Every citizen can verify land records at the Arazi Record Center or via official apps (PLRA in Punjab). Before any purchase, check digitally for encumbrances or stay orders. Demand biometric verification at the ARC; both buyer and seller must provide thumbprints. Always verify the Shajra (revenue map) to match ground reality.</p></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>PLRA: 0800-27274</strong> | <strong>Qanoon 24/7</strong></footer></article>' }
                    ]
