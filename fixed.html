<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qanoon 24/7 - Legal Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-dark: #0d2137;
            --primary-mid: #0f2d48;
            --accent-gold: #ffcc00;
            --sidebar-width: 320px;
            --body-font: 'DM Sans', 'Segoe UI', sans-serif;
            --display-font: 'Cormorant Garamond', Georgia, serif;
        }

        body { background-color: #f4f7f6; overflow-x: hidden; font-family: var(--body-font); }

        .container { display: flex; min-height: 100vh; }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #0d2137 0%, #0f2d48 100%);
            color: white; padding: 20px 0;
            position: fixed; height: 100vh; overflow-y: auto;
            z-index: 1000; left: 0;
            scrollbar-width: thin; scrollbar-color: #ffcc00 #0d2137;
        }
        [dir="rtl"] .sidebar { left: auto; right: 0; }

        .logo { background: rgba(255,204,0,0.1); padding: 20px; margin: 0 15px 25px 15px; border-radius: 8px; text-align: center; }
        .logo h1 { font-size: 20px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; }

        .part-header {
            padding: 10px 20px; background: rgba(255,255,255,0.1);
            color: var(--accent-gold); font-weight: bold; font-size: 13px;
            text-transform: uppercase; letter-spacing: .06em; margin-top: 15px;
        }

        .nav-links { list-style: none; }
        .category-group { border-bottom: 1px solid rgba(255,255,255,0.05); }
        .category-header {
            padding: 12px 20px; cursor: pointer; display: flex;
            justify-content: space-between; align-items: center;
            font-size: 13px; font-weight: 500; transition: 0.3s;
        }
        .category-header:hover { background: rgba(255,204,0,0.15); }
        .category-header span.arrow { font-size: 10px; transition: transform 0.3s; }
        .category-group.open .category-header { color: var(--accent-gold); }
        .category-group.open span.arrow { transform: rotate(90deg); }

        .sub-menu { list-style: none; background: rgba(0,0,0,0.2); display: none; }
        .category-group.open .sub-menu { display: block; }
        .sub-item { padding: 10px 35px; font-size: 12px; cursor: pointer; opacity: 0.7; transition: 0.2s; }
        .sub-item:hover { opacity: 1; color: var(--accent-gold); background: rgba(255,255,255,0.05); }
        .sub-item.active-link { color: var(--accent-gold); opacity: 1; font-weight: bold; }

        /* ── Main Content ── */
        .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 40px; transition: 0.3s; }
        [dir="rtl"] .main-content { margin-left: 0; margin-right: var(--sidebar-width); }

        .top-header { display: flex; justify-content: flex-end; margin-bottom: 25px; }

        .lang-toggle {
            background: var(--accent-gold); color: var(--primary-dark);
            border: none; padding: 12px 24px; border-radius: 30px;
            font-weight: bold; font-family: var(--body-font); cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform .2s, box-shadow .2s;
        }
        .lang-toggle:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .lang-toggle:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ── Card wrapper for overlay positioning ── */
        .card-wrapper { position: relative; }

        .info-card {
            background: white; padding: 48px 52px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-top: 6px solid var(--accent-gold); min-height: 80vh;
        }

        /* ── Translation loading overlay ── */
        .translation-overlay {
            display: none; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.88);
            z-index: 10; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px; border-radius: 15px;
        }
        .translation-overlay.active { display: flex; }
        .spinner {
            width: 42px; height: 42px;
            border: 4px solid #e0e0e0; border-top-color: var(--accent-gold);
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        .overlay-msg { color: var(--primary-dark); font-size: 15px; font-weight: 500; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Content area ── */
        #content-title {
            color: var(--primary-dark); font-size: 28px; font-family: var(--body-font);
            margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;
        }
        #content-desc { line-height: 1.8; color: #444; font-size: 16px; }

        /* Urdu content gets better line-height */
        [dir="rtl"] #content-desc,
        [dir="rtl"] #content-title {
            font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Segoe UI', sans-serif;
            line-height: 2.2;
        }

        /* ── Welcome screen ── */
        .welcome-eyebrow {
            display: inline-block; font-size: 11px; font-weight: 500;
            letter-spacing: .2em; text-transform: uppercase;
            color: var(--accent-gold); background: var(--primary-dark);
            padding: 5px 14px; border-radius: 2px; margin-bottom: 28px;
        }
        .welcome-title {
            font-family: var(--display-font); font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700; color: var(--primary-dark); line-height: 1.15;
            margin-bottom: 24px; max-width: 680px;
        }
        .welcome-divider { width: 48px; height: 3px; background: var(--accent-gold); border-radius: 2px; margin-bottom: 24px; }
        .welcome-desc { font-size: 1rem; font-weight: 300; line-height: 1.85; color: #4a5568; max-width: 620px; margin-bottom: 52px; }

        .welcome-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 48px; }
        .welcome-step-card {
            border: 1px solid #e8eaec; border-top: 3px solid var(--primary-dark);
            border-radius: 8px; padding: 28px 24px; background: #fafafa;
            transition: border-top-color .25s, box-shadow .25s, transform .25s;
        }
        .welcome-step-card:hover { border-top-color: var(--accent-gold); box-shadow: 0 6px 24px rgba(0,0,0,0.08); transform: translateY(-3px); }
        .step-numeral { font-family: var(--display-font); font-size: 2rem; font-weight: 700; color: #dde2e8; line-height: 1; margin-bottom: 14px; display: block; }
        .step-label { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--primary-dark); margin-bottom: 8px; display: block; }
        .step-body { font-size: 13.5px; font-weight: 400; color: #5a6472; line-height: 1.6; }

        .welcome-stats { display: flex; gap: 0; border-top: 1px solid #edf0f2; padding-top: 32px; }
        .stat-block { flex: 1; padding-right: 32px; border-right: 1px solid #edf0f2; margin-right: 32px; }
        .stat-block:last-child { border-right: none; margin-right: 0; padding-right: 0; }
        .stat-number { font-family: var(--display-font); font-size: 2.2rem; font-weight: 700; color: var(--primary-dark); line-height: 1; display: block; margin-bottom: 5px; }
        .stat-label { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #9ca3af; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .anim-1 { animation: fadeUp .55s .05s ease both; }
        .anim-2 { animation: fadeUp .55s .15s ease both; }
        .anim-3 { animation: fadeUp .55s .22s ease both; }
        .anim-4 { animation: fadeUp .55s .30s ease both; }
        .anim-5 { animation: fadeUp .55s .40s ease both; }
        .anim-6 { animation: fadeUp .55s .50s ease both; }

        /* RTL welcome adjustments */
        [dir="rtl"] .welcome-stats { flex-direction: row-reverse; }
        [dir="rtl"] .stat-block { padding-right: 0; padding-left: 32px; border-right: none; border-left: 1px solid #edf0f2; margin-right: 0; margin-left: 32px; }
        [dir="rtl"] .stat-block:last-child { border-left: none; margin-left: 0; padding-left: 0; }
        [dir="rtl"] .welcome-steps { direction: rtl; }
    </style>
</head>
<body>
<div class="container">

    <aside class="sidebar">
        <div class="logo"><h1 id="portal-title">Public Portal</h1></div>
        <div class="part-header" id="part1-label">Part 1: Fundamental Rights</div>
        <ul class="nav-links" id="fundemental-nav"></ul>
        <div class="part-header" id="part2-label">Part 2: Criminal Law</div>
        <ul class="nav-links" id="criminal-nav"></ul>
        <div class="part-header" id="part3-label">Part 3: Civil Law</div>
        <ul class="nav-links" id="civil-nav"></ul>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <button class="lang-toggle" id="langBtn" onclick="toggleLanguage()">اردو میں دیکھیں</button>
        </header>
        <div class="card-wrapper">
            <div class="info-card">
                <h2 id="content-title" style="display:none;"></h2>
                <div id="content-desc"></div>
                <div id="steps-container"></div>
            </div>
            <!-- Overlay shown during AI translation -->
            <div class="translation-overlay" id="translationOverlay">
                <div class="spinner"></div>
                <p class="overlay-msg" id="overlayMsg">ترجمہ ہو رہا ہے...</p>
            </div>
        </div>
    </main>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   DATA  —  each entry has:
     en      : English sidebar label
     ur      : Urdu sidebar label
     desc    : English HTML article (always present)

              If present, it is shown instantly; otherwise the
              Claude API translates `desc` on demand.
   Sub-items follow the exact same shape inside `subs: []`.
═══════════════════════════════════════════════════════════════ */
const legalData = {
    Fundemental: [
        {
            en: "1. Right to Life and Liberty",
            ur: "۱۔ زندگی اور آزادی کا حق",
            desc: <'article class="life-liberty-legal-guide" style="font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.15);background-color:#ffffff">' + '<header style="background-color:#002147;color:#ffffff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37">' + '<h1 style="margin:0;text-transform:uppercase;letter-spacing:2px;font-size:1.5rem">Right to Life &amp; Liberty: Citizen&#39;s Guide</h1>' + '<p style="margin:10px 0 0;color:#D4AF37;font-weight:bold;font-size:1.1rem">Your Constitutional Protections &amp; Legal Remedies Under Pakistani Law</p>' + '</header>' + '<div style="padding:30px;line-height:1.8;color:#333">' + '<section style="margin-bottom:25px">' + '<h3 style="color:#002147;border-bottom:2px solid #D4AF37;padding-bottom:5px;margin-top:0">1. The Constitutional Shields</h3>' + '<p><strong>Article 9: Security of Person</strong><br><span style="font-style:italic;color:#555">&quot;No person shall be deprived of life or liberty save in accordance with law.&quot;</span><br><strong>The Legal Reality:</strong> State authorities cannot arbitrarily detain or harm you. Furthermore, the Superior Judiciary has expanded &quot;Life&quot; to include the right to a clean environment, basic healthcare, clean drinking water, and civic safety.</p><p><strong>Article 10: Safeguards as to Arrest and Detention</strong><br>Your primary legal armor during law enforcement interactions:</p>' + '<ul style="padding-left:20px">' + '<li><strong>Right to Grounds of Arrest:</strong> You must be informed of the exact reasons/charges for your arrest as soon as you are detained.</li>' + '<li><strong>Right to Legal Counsel:</strong> You have an absolute right to consult and be defended by a legal practitioner of your choice from the moment of your arrest.</li>' + '<li><strong>The 24-Hour Rule (Section 61, CrPC):</strong> You must be produced before a Judicial Magistrate within 24 hours of arrest. *Note: This 24-hour window legally excludes the time required to travel from the place of arrest to the Magistrate.*</li>' + '</ul>' + '<p><strong>Article 10-A: Right to Fair Trial &amp; Due Process</strong><br>You are constitutionally presumed innocent until proven guilty. You are guaranteed a trial by an independent court, the right to review all state evidence, and the right to cross-examine witnesses (the principle of <em>Audi Alteram Partem</em>—no one shall be condemned unheard).</p>' + '</section>' + '<section style="margin-bottom:25px">' + '<h3 style="color:#002147;border-bottom:2px solid #D4AF37;padding-bottom:5px">2. Practical Guidelines: What to Do if Detained?</h3>' + '<p><strong>Scenario A: If Stopped or Questioned by Police</strong></p><ul style="padding-left:20px">' + '<li><strong>Verify Authority:</strong> Politely ask the officer for their name, rank, and the police station (Thana) they represent.</li>' + '<li><strong>Ask for the FIR or Offense:</strong> Ask if a First Information Report (FIR) has been registered, or if you are being detained under Section 54 of the CrPC (arrest without a warrant for a cognizable offense).</li>' + '<li><strong>Invoke Article 14 (Dignity):</strong> Forced confessions are illegal and inadmissible. Do not sign blank papers or statements under coercion. Request an immediate medical examination if subjected to physical abuse.</li>' + '</ul>' + '<p><strong>Scenario B: If Someone is Illegally Detained (Past 24 Hours)</strong></p>' + '<ul style="padding-left:20px">' + '<li><strong>The Local Remedy (Section 491, CrPC):</strong> Have a lawyer immediately file a Habeas Corpus petition before the local <strong>District &amp; Sessions Judge</strong>. The judge can appoint a Court Bailiff to immediately raid the police station and recover the detainee within hours.</li>' + '<li><strong>The Constitutional Remedy (Article 199):</strong> Alternatively, a constitutional writ can be filed in the provincial High Court, ordering the state authorities to &quot;produce the body&quot; and justify the detention.</li>' + '</ul>' + '</section>' + '<section style="margin-bottom:25px;background-color:#f8f9fa;border-radius:10px;padding:25px;border-left:5px solid #D4AF37"><h3 style="color:#002147;margin-top:0">3. Public Myths vs. Hard Legal Facts</h3>' + '<table style="width:100%;border-collapse:collapse;margin-top:15px;background-color:white">' + '<thead style="background-color:#002147;color:white">' + '<tr>' + '<th style="padding:12px;border:1px solid #ddd;text-align:left;width:40%">Public Myth</th>' + '<th style="padding:12px;border:1px solid #ddd;text-align:left;width:60%">The Legal Fact</th>' + '</tr>' + '</thead>' + '<tbody>' + '<tr>' + '<td style="padding:12px;border:1px solid #ddd;font-weight:bold">&quot;The police can keep you for days for interrogation without a judge&#39;s permission.&quot;</td>' + '<td style="padding:12px;border:1px solid #ddd"><strong>False.</strong> Any detention beyond 24 hours (excluding transit time) without a formal physical remand order from a Magistrate is a constitutional violation and constitutes illegal confinement.</td>' + '</tr>' + '<tr>' + '<td style="padding:12px;border:1px solid #ddd;font-weight:bold">&quot;These protections apply to every single type of arrest universally.&quot;</td>' + '<td style="padding:12px;border:1px solid #ddd"><strong>False (The Exception).</strong> Under Article 10(4)-(8), the standard 24-hour rule and right to know grounds do not apply to individuals arrested under special <strong>Preventive Detention laws</strong> (e.g., threat to state security or public order). They can be held longer under Review Board oversight.</td>' + '</tr>' + '<tr>' + '<td style="padding:12px;border:1px solid #ddd;font-weight:bold">&quot;The state can punish me using a newly passed law for something I did last year.&quot;</td>' + '<td style="padding:12px;border:1px solid #ddd"><strong>Partially False (Article 12).</strong> Protection against retrospective law applies strictly to <em>criminal offenses and punishments</em>. The legislature *can* legally pass retrospective civil, tax, or fiscal laws.</td>' + '</tr>' + '</tbody>' + '</table>' + '</section>' + '</div>' + '<footer style="background-color:#002147;color:#ffffff;padding:15px;text-align:center;font-size:0.9rem;border-top:5px solid #D4AF37"><strong>Ministry of Human Rights Helpline: 1099</strong> | <strong>Police Emergency: 15</strong> | <strong>Legal Awareness Initiative</strong>' + '</footer>' + '</article'>;
            desc_ur: '<article dir="rtl" style="font-family:\'Noto Nastaliq Urdu\',\'Jameel Noori Nastaleeq\',Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.15);background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h1 style="margin:0;font-size:1.8rem;font-weight:normal">حقِ زندگی اور آزادی: شہریوں کی رہنمائی</h1><p style="margin:10px 0 0;color:#D4AF37;font-weight:bold;font-size:1.2rem">بلاوجہ گرفتاری اور نظربندی کے خلاف آپ کے آئینی تحفظات</p></header><div style="padding:30px;line-height:2.2;color:#333;text-align:right"><section style="margin-bottom:25px"><h3 style="color:#002147;border-bottom:2px solid #D4AF37;padding-bottom:5px;margin-top:0;font-size:1.3rem">۱۔ بنیادی آئینی ڈھال</h3><p><strong>آرٹیکل 9:</strong> کسی بھی شخص کو قانون کے مطابق عمل کیے بغیر زندگی یا آزادی سے محروم نہیں کیا جا سکتا۔ عدالتوں نے "زندگی" کے مفہوم میں صاف ماحول، صاف پانی اور بنیادی صحت کی سہولت بھی شامل کی ہے۔</p><p><strong>آرٹیکل 10 — گرفتاری کے تحفظات:</strong></p><ul style="padding-right:20px;padding-left:0"><li><strong>جاننے کا حق:</strong> آپ کو فوری طور پر گرفتاری کی وجہ بتانا لازمی ہے۔</li><li><strong>وکیل کا حق:</strong> گرفتاری کے پہلے لمحے سے اپنی پسند کے وکیل سے مشورہ کا آئینی حق حاصل ہے۔</li><li><strong>24 گھنٹے کا قانون:</strong> پولیس کو 24 گھنٹے کے اندر آپ کو مجسٹریٹ کے سامنے پیش کرنا لازمی ہے۔ ریمانڈ آرڈر کے بغیر اس کے بعد کی حراست مکمل طور پر غیر قانونی ہے۔</li></ul><p><strong>آرٹیکل 10-اے — منصفانہ ٹرائل:</strong> آپ بے گناہ ہیں جب تک جرم ثابت نہ ہو۔ آپ کو آزاد جج اور ثبوتوں کو چیلنج کرنے کا مکمل حق حاصل ہے۔</p></section><section style="margin-bottom:25px"><h3 style="color:#002147;border-bottom:2px solid #D4AF37;padding-bottom:5px;font-size:1.3rem">۲۔ عملی ہدایات</h3><p><strong>اگر روکا جائے:</strong> اہلکار کا نام، عہدہ اور تھانہ پوچھیں۔ قانونی وجہ مانگیں۔ گھر والوں کو اطلاع دیں۔ خالی کاغذ پر دستخط نہ کریں۔</p><p><strong>اگر 24 گھنٹے سے زیادہ غیر قانونی حراست ہو:</strong> فوری طور پر صوبائی ہائی کورٹ میں آرٹیکل 199 کے تحت حبسِ بے جا کی پٹیشن دائر کریں۔</p></section><section style="background:#f8f9fa;border-radius:10px;padding:25px;border-right:5px solid #D4AF37"><h3 style="color:#002147;margin-top:0;font-size:1.3rem">۳۔ عوامی مفروضے بنام آئینی حقائق</h3><table style="width:100%;border-collapse:collapse;background:#fff"><thead style="background:#002147;color:#fff"><tr><th style="padding:12px;border:1px solid #ddd;text-align:right">مفروضہ</th><th style="padding:12px;border:1px solid #ddd;text-align:right">آئینی حقیقت</th></tr></thead><tbody><tr><td style="padding:12px;border:1px solid #ddd">"پولیس جج کی اجازت کے بغیر دنوں تک رکھ سکتی ہے۔"</td><td style="padding:12px;border:1px solid #ddd"><strong>غلط۔</strong> 24 گھنٹے کی حد آئینی طور پر مطلق ہے۔</td></tr><tr><td style="padding:12px;border:1px solid #ddd">"وکیل کے بغیر دفاع نہیں کر سکتا۔"</td><td style="padding:12px;border:1px solid #ddd"><strong>غلط۔</strong> ریاست مفت قانونی نمائندگی فراہم کرنے کی پابند ہے۔</td></tr><tr><td style="padding:12px;border:1px solid #ddd">"نیا قانون پرانے عمل پر سزا دے سکتا ہے۔"</td><td style="padding:12px;border:1px solid #ddd"><strong>غلط (آرٹیکل 12)۔</strong> ماضی پر لاگو ہونے والے فوجداری قوانین ممنوع ہیں۔</td></tr></tbody></table></section></div><footer style="background:#002147;color:#fff;padding:15px;text-align:center;font-size:0.95rem;border-top:5px solid #D4AF37"><strong>انسانی حقوق: 1099</strong> | <strong>پولیس ایمرجنسی: 15</strong> | <strong>قانون 24/7</strong></footer></article>'
        },
        {

 Ombudsperson (workplace), police FIR under Sec 509 (public spaces), or FIA Cyber Crime (online).</li></ul><h3 style="color:#002147;margin-top:20px">Penalties at a Glance</h3><table style="width:100%;border-collapse:collapse"><thead style="background:#002147;color:#fff"><tr><th style="padding:10px;border:1px solid #ddd;text-align:left">Violation</th><th style="padding:10px;border:1px solid #ddd">Forum</th><th style="padding:10px;border:1px solid #ddd">Max Penalty</th></tr></thead><tbody><tr><td style="padding:10px;border:1px solid #ddd">Workplace/Education</td><td style="padding:10px;border:1px solid #ddd">Inquiry Committee / Ombudsperson</td><td style="padding:10px;border:1px solid #ddd">Dismissal/Expulsion</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Public Space</td><td style="padding:10px;border:1px solid #ddd">Police / Magistrate (Sec 509)</td><td style="padding:10px;border:1px solid #ddd">3 Years + Fine</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Digital/Online</td><td style="padding:10px;border:1px solid #ddd">FIA Cyber Crime (Sec 21 PECA)</td><td style="padding:10px;border:1px solid #ddd">3 Years + Rs.1M Fine</td></tr></tbody></table><div style="background:#eef2f7;padding:20px;border-radius:10px;border:1px solid #002147;margin-top:20px"><strong>Emergency Helplines:</strong> Police: 15 | FIA Cyber Crime: 9911 | Human Rights: 1099 | FOSPAH: (051) 9262952</div></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem">Police: 15 | FIA Cyber: 9911 | <strong>Qanoon 24/7</strong></footer></article>'

                { en: "Theft (Sariqah)", ur: "سرقہ (چوری)", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:12px;max-width:850px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:25px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase">Theft — PPC &amp; Hudood Laws</h2></header><div style="padding:30px;line-height:1.7;color:#333"><table style="width:100%;border-collapse:collapse;margin-top:10px"><thead><tr style="background:#f0f4f8;border-bottom:2px solid #002147"><th style="padding:10px;border:1px solid #ddd">Offence</th><th style="padding:10px;border:1px solid #ddd;text-align:center">Section</th><th style="padding:10px;border:1px solid #ddd">Max Punishment</th></tr></thead><tbody><tr><td style="padding:10px;border:1px solid #ddd">Simple Theft</td><td style="padding:10px;border:1px solid #ddd;text-align:center">379 PPC</td><td style="padding:10px;border:1px solid #ddd">3 Years + Fine</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Theft in House/Shop</td><td style="padding:10px;border:1px solid #ddd;text-align:center">380 PPC</td><td style="padding:10px;border:1px solid #ddd">7 Years + Fine</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Vehicle Theft</td><td style="padding:10px;border:1px solid #ddd;text-align:center">381-A PPC</td><td style="padding:10px;border:1px solid #ddd">7 Years + Fine</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Buying Stolen Goods</td><td style="padding:10px;border:1px solid #ddd;text-align:center">411 PPC</td><td style="padding:10px;border:1px solid #ddd">3 Years + Fine</td></tr></tbody></table><p style="margin-top:15px"><strong>Recovery:</strong> Call 15 immediately for a timestamped log. If police recover your item, your lawyer must file a Superdari Application to get it back. Simple theft (379) is compoundable — you can settle out of court.</p></div><footer style="background:#002147;color:#fff;padding:15px;text-align:center;font-size:0.85rem"><strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Extortion", ur: "بھتہ خوری", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:12px;max-width:850px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:25px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase">Extortion (Bhatta) &amp; Blackmail — PPC 383–389 &amp; ATA</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>Simple extortion (Sec 384): 3 years. Death-threat extortion (Sec 386): 10 years. Organised Bhatta (ATA 7(h)): 14 years to life. Photo blackmail is both extortion and a PECA cybercrime — do not pay; report to FIA immediately. Forcing someone to sign a document under fear is also extortion. Save all evidence and use 22-A petition if SHO refuses to act.</p></div><footer style="background:#002147;color:#fff;padding:15px;text-align:center;font-size:0.85rem"><strong>Emergency: 15</strong> | <strong>Cyber Crime: 1799</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Robbery & Dacoity", ur: "ڈکیتی", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:12px;max-width:850px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:25px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase">Robbery &amp; Dacoity — PPC 390–402</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>Robbery = theft using force or immediate threat. Dacoity = robbery by 5+ persons. Simple robbery (Sec 392): 10–14 years. Robbery with attempted murder (Sec 394): life. Dacoity with murder (Sec 396): death penalty. You have the Right of Private Defence (Sec 96–106) to use proportionate — even lethal — force to protect life and property. If SHO refuses FIR, use a 22-A petition immediately.</p></div><footer style="background:#002147;color:#fff;padding:15px;text-align:center;font-size:0.85rem"><strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Criminal Breach of Trust", ur: "امانت میں خیانت", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:12px;max-width:850px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:25px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase">Criminal Breach of Trust — PPC 405–409</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>CBT = dishonestly misusing property entrusted to you. Servant CBT (Sec 408) carries a higher penalty than simple CBT. Bank employee misuse (Sec 409) is investigated by the FIA with potential life imprisonment. Gather receipts, bank transfers, and chat evidence. Send a legal notice first to create a formal record. Use a civil Recovery Suit to get money back in addition to the criminal FIR.</p></div><footer style="background:#f4f4f4;padding:15px;font-size:0.85rem;text-align:center;border-top:1px solid #ddd"><strong>Emergency: 15</strong> | <strong>Bank Fraud: 1991 (FIA)</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Cheating", ur: "دھوکہ دہی", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:12px;max-width:850px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:25px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase">Cheating &amp; Fraud — PPC 415–420</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>Cheating is criminal only if the intent to deceive existed at the time of the transaction. Selling a forged plot = Section 420. Call FIA Cybercrime (1991) immediately for online scams — they can freeze accounts quickly. Always pay via bank transfer to create a money trail. Send a formal legal notice before filing FIR to show good faith.</p></div><footer style="background:#f4f4f4;padding:15px;font-size:0.85rem;text-align:center;border-top:1px solid #ddd"><strong>Police: 15</strong> | <strong>Cyber Fraud: 1991</strong> | <strong>Qanoon 24/7</strong></footer></article>' }

                { en: "Unlawful Assembly", ur: "غیر قانونی اجتماع", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:12px;max-width:850px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:25px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase">Protests &amp; Unlawful Assembly — PPC 141–149</h2></header><div style="padding:25px;line-height:1.6;color:#333"><p><strong>Joint Liability:</strong> If you are in an unlawful crowd, you are legally responsible for everything the crowd does. If Section 144 is imposed, your mere presence in a group is enough to charge you under PPC 188. Police may use civil force under CrPC 128. Always carry your CNIC, document your route digitally, and leave as soon as a dispersal order is given.</p></div><footer style="background:#f4f4f4;padding:15px;text-align:center;font-size:0.85rem"><strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },

anoon 24/7</strong></footer></article>' }

        {
            en: "6. Procedural Rights", ur: "۶۔ طریقہ کار کے حقوق",
            subs: [
                { en: "FIR", ur: "ایف آئی آر", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">FIR &amp; Police Procedures — Section 154 CrPC</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>A weak FIR = a weak trial. Include: Who (name/description), When &amp; Where (exact date/time/location), What (factual step-by-step narration — no exaggerations), Witnesses (names and contacts), Evidence (CCTV, MLC, shell casings). Filing is 100% free. If police refuse, approach the Justice of Peace under Section 22-A CrPC. In 2026, apps like Punjab Police Dost, Sindh Police CMS, and KP E-Policing allow digital complaint filing. Report misconduct to IGP at 1715. Never file a false FIR — PPC 182 = up to 6 months jail.</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>Police Emergency: 15</strong> | <strong>IGP Complaints: 1715</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Rights of the Accused", ur: "ملزم کے حقوق", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Rights of the Accused: Arrest to Detention</h2></header><div style="padding:30px;line-height:1.7;color:#333"><table style="width:100%;border-collapse:collapse;margin-bottom:20px"><thead><tr style="background:#002147;color:#fff"><th style="padding:10px;border:1px solid #ddd;text-align:left">Phase</th><th style="padding:10px;border:1px solid #ddd;text-align:left">Right</th><th style="padding:10px;border:1px solid #ddd;text-align:left">Authority</th></tr></thead><tbody><tr><td style="padding:10px;border:1px solid #ddd">Arrest</td><td style="padding:10px;border:1px solid #ddd">Must be told exact grounds immediately</td><td style="padding:10px;border:1px solid #ddd">Article 10(1)</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Interrogation</td><td style="padding:10px;border:1px solid #ddd">Right to remain silent; no self-incrimination</td><td style="padding:10px;border:1px solid #ddd">Article 13(b)</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Interrogation</td><td style="padding:10px;border:1px solid #ddd">Confessions to police are inadmissible in court</td><td style="padding:10px;border:1px solid #ddd">QeS Arts 38/39</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Custody</td><td style="padding:10px;border:1px solid #ddd">Produced before Magistrate within 24 hours</td><td style="padding:10px;border:1px solid #ddd">Article 10(2)</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Legal Support</td><td style="padding:10px;border:1px solid #ddd">Right to consult and be defended by own lawyer</td><td style="padding:10px;border:1px solid #ddd">Article 10(1)</td></tr><tr><td style="padding:10px;border:1px solid #ddd">Human Rights</td><td style="padding:10px;border:1px solid #ddd">No torture to extract evidence or confessions</td><td style="padding:10px;border:1px solid #ddd">Article 14(1)</td></tr></tbody></table><p>If mistreated: demand a medical exam (CrPC Sec 54) when produced before the Magistrate. State only "I will provide a statement in the presence of my lawyer."</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>Human Rights: 1099</strong> | <strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Bail", ur: "ضمانت", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Bail &amp; Release — CrPC 496–498</h2></header><div style="padding:30px;line-height:1.7;color:#333"><table style="width:100%;border-collapse:collapse;margin-bottom:20px"><thead><tr style="background:#002147;color:#fff"><th style="padding:10px;border:1px solid #ddd">Type</th><th style="padding:10px;border:1px solid #ddd">When</th><th style="padding:10px;border:1px solid #ddd">Purpose</th></tr></thead><tbody><tr><td style="padding:10px;border:1px solid #ddd;font-weight:bold">Pre-Arrest (Anticipatory)</td><td style="padding:10px;border:1px solid #ddd">Before arrest</td><td style="padding:10px;border:1px solid #ddd">Prevent harassment-based arrest</td></tr><tr><td style="padding:10px;border:1px solid #ddd;font-weight:bold">Protective</td><td style="padding:10px;border:1px solid #ddd">When in another city</td><td style="padding:10px;border:1px solid #ddd">1–2 weeks to reach the relevant court</td></tr><tr><td style="padding:10px;border:1px solid #ddd;font-weight:bold">Post-Arrest</td><td style="padding:10px;border:1px solid #ddd">After arrest</td><td style="padding:10px;border:1px solid #ddd">Release while trial pending</td></tr><tr><td style="padding:10px;border:1px solid #ddd;font-weight:bold">Statutory</td><td style="padding:10px;border:1px solid #ddd">Trial delayed</td><td style="padding:10px;border:1px solid #ddd">Right: 1 yr (men) / 6 months (women)</td></tr></tbody></table><p>Offences below 10 years generally attract bail. Medical grounds (illness, old age, women) allow extra discretion. Bail can be cancelled only by a court — not the police. Missing a court date = bail cancelled + NBW issued. If granted Interim Pre-Arrest Bail, join the investigation immediately.</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' }
            ]
        }
    ],
    civil: [
        {
            en: "1. Family & Personal Laws", ur: "۱۔ خاندانی قوانین",
            subs: [
                { en: "Nikah and Polygamy", ur: "نکاح اور تعدد ازدواج", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Nikah &amp; Polygamy — MFLO 1961</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>A valid Nikah requires: legal age (18/16 in Punjab, KP, Balochistan; 18 for both in Sindh), Ijab-o-Qubul, two adult witnesses, specified Mahr (Mu\'ajjal = prompt; Mu\'wajjal = deferred), and free consent. An adult Muslim woman does not legally require a Wali\'s consent (Saima Waheed case).</p><p>For polygamy, the husband must obtain written permission from the Union Council Arbitration Council. Bypassing this makes the entire Mahr immediately payable and is a criminal offence. Always obtain a NADRA Marriage Registration Certificate (MRC) for all official purposes.</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "NikahNama and Registration", ur: "نکاح نامہ اور رجسٹریشن", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Nikkahnama &amp; Registration — MFLO 1961</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p><strong>Key Columns:</strong> 13–16 (Mahr — Mu\'ajjal or Mu\'wajjal), 18 (Talaq-e-Tafweez — delegate right of divorce to wife), 19–20 (special conditions: wife\'s right to work, monthly allowance), 21–22 (polygamy permission). It is illegal for a Registrar to cross out Columns 18–22 without the bride\'s explicit consent. The Nikkah Khawan must register with the Union Council within 30 days. Obtain a NADRA MRC for all official purposes.</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Rights of Husband and Wife", ur: "شوہر اور بیوی کے حقوق", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Spousal Rights &amp; Obligations — MFLO</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p><strong>Wife\'s rights:</strong> Maintenance (Nafqah) covering food, clothing, medical care, housing — absolute regardless of her own income; full ownership of Mahr; delegated right of divorce (Talaq-e-Tafweez) if Column 18 is signed; protection against unauthorised polygamy (MFLO Sec 6).</p><p><strong>Husband\'s rights:</strong> Talaq with mandatory 90-day notice to Union Council; conditional polygamy; right to consortium. NADRA MRC is mandatory for CNICs, passports, B-Forms, and inheritance.</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Khula & Talaq", ur: "خلع اور طلاق", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Dissolution of Marriage — Talaq, Khula &amp; Faskh</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p><strong>Talaq:</strong> Written notice to Union Council + copy to wife; 90-day reconciliation period; effective after 90 days if reconciliation fails; full Mahr must be paid.</p><p><strong>Khula:</strong> Wife files in Family Court; no husband consent needed; usually returns Mahr or waives unpaid portion.</p><p><strong>Faskh:</strong> Judicial dissolution under Dissolution of Muslim Marriages Act 1939 — grounds include desertion (4 yrs), failure to maintain (2 yrs), cruelty, or imprisonment (7+ yrs). Must register Divorce Effectiveness Certificate with Union Council.</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Maintenance (Nan-Nafqa)", ur: "نان نفقہ (خرچہ)", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Maintenance Law — Nan-Nafqa</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>A husband must maintain his wife regardless of her income. The father must support sons until 18 (longer for higher education) and daughters until marriage. Under Family Courts Act Sec 17-A, interim maintenance is fixed within 1–3 months of filing. Non-payment allows the court to freeze accounts, attach salary, seize property, or jail the defaulter for 6 months–1 year. Past maintenance is claimable: wife up to 3 years, children up to 6 years.</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>Legal Aid: 1043</strong> | <strong>Human Rights: 1099</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Child Custody", ur: "بچوں کی تحویل (حضانت)", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Child Custody Law — Hizanat &amp; Wilayat</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>The paramount principle is the Welfare of the Minor. Hizanat (physical custody) typically goes to the mother: boys up to 7, girls until puberty — but courts can extend if it serves the child. Wilayat (guardianship) goes to the father for major decisions. A mother\'s remarriage does not automatically lose her custody. Poverty is not a ground to deny custody; the court will order the father to pay maintenance. Apply for Visitation Rights under Guardians and Wards Act Sec 12 if access is denied. The child\'s preference matters from around age 7–10.</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>Legal Aid: 1043</strong> | <strong>Human Rights: 1099</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Inheritance", ur: "وراثت", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Inheritance Law — Wirasat</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>Shariah shares are mandatory and cannot be waived by force. Denying a woman her share is a criminal offence under PPC 498-A (up to 10 years). A "nominee" on a bank account is only a trustee — funds must be distributed among all legal heirs. A will (Wasiyat) can cover only 1/3 of the estate and cannot favour existing legal heirs without unanimous consent after death. NADRA can issue Succession Certificates (movable) and Letters of Administration (immovable) within 15–30 days if all heirs provide biometrics. No time limit exists to claim inheritance.</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>Legal Aid: 1043</strong> | <strong>Human Rights: 1099</strong> | <strong>Qanoon 24/7</strong></footer></article>' }
            ]
        },
        {
            en: "2. Property & Land Laws", ur: "۲۔ جائیداد اور اراضی کے قوانین",
            subs: [
                { en: "Stay Orders", ur: "سٹے آرڈرز (حکم امتناہی)", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Stay Orders — Emergency Property Protection</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>To get a stay order, prove the Triple Test: (1) Serious arguable case; (2) Irreparable loss — damage money cannot fix; (3) Balance of convenience — you suffer more without the stay. Use an "Urgency Slip" for same-day hearings. Ask for a "Status Quo" order if the judge hesitates. An Ex-Parte stay lasts only 15 days — serve the other party immediately. Take a certified copy to the local SHO and enter it in the Roznamcha to enforce physically. Lying to get a stay = heavy fine for "unclean hands."</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>Legal Aid: 1043</strong> | <strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Illegal Dispossession", ur: "غیر قانونی قبضہ", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Protection Against Land Grabbing — IDA 2005</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>The IDA 2005 allows immediate court action without years of civil litigation. Land grabbers face up to 10 years. File directly in the Sessions Court (faster track). Request "interim possession" so you can move back while the trial continues. The judge will direct a Police/Revenue Officer to visit the site within 15 days. Bring utility bills, photos, and neighbour testimonials as proof of possession. A tenant can also file against a landlord who forcibly evicts without a court order. Illegal sale to a third party = no legal title passes (Nemo dat quod non habet).</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>Legal Aid: 1043</strong> | <strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Land Records (Fard/Mutation)", ur: "اراضی ریکارڈ (فرد اور انتقال)", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Land Records — Fard &amp; Mutation</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>The Fard is official proof of ownership. Having only a Registry (Sale Deed) is not enough — you must complete the Mutation (Intiqal) at the ARC to transfer the land officially. Verify online before any payment: check Khasra and Khewat numbers and look for encumbrances or stay orders. Both buyer and seller must provide biometrics at the ARC. Always verify the Shajra (revenue map) to confirm the physical land matches the documents.</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>PLRA: 0800-27274</strong> | <strong>Qanoon 24/7</strong></footer></article>' }
            ]
        },
        {
            en: "3. Succession & Inheritance", ur: "۳۔ وراثت اور جانشینی",
            subs: [
                { en: "Succession Certificate", ur: "سکسیشن سرٹیفکیٹ", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Succession Certificates — NADRA Route</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>Under the Letters of Administration and Succession Certificates Act 2021, NADRA issues certificates within 15–30 days. Succession Certificate = movable assets (bank, stocks, prize bonds). Letter of Administration = immovable (houses, plots, land). Steps: (1) Cancel deceased\'s CNIC at NADRA; (2) One heir applies with authorisation letter from all heirs; (3) All heirs provide biometrics (abroad: Pakistani Embassy or Pak-ID App); (4) NADRA publishes 14-day newspaper notice; (5) Certificate issued if no objections. Fee: Rs.20,000 for assets over Rs.100,000.</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>NADRA: 1777</strong> | succession.nadra.gov.pk | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Inheritance Distribution", ur: "وراثت کی تقسیم", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase;letter-spacing:2px">Inheritance Distribution — Wirasat</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>Shariah shares are mandatory. After getting the NADRA Letter of Administration, take it to the ARC (Patwari) to complete the Wirasat Mutation (Intiqal) to put heirs\' names on the Fard. If heirs disagree, file a Partition Suit in Civil Court. Heirs can voluntarily redistribute shares via Relinquishment Deeds after legal shares are recorded. PPC 498-A: denying a woman her share = up to 10 years prison.</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>NADRA: 1777</strong> | <strong>Legal Aid: 1043</strong> | <strong>Qanoon 24/7</strong></footer></article>' }
            ]
        },
        {
            en: "4. Public Interest Topics", ur: "۴۔ عوامی مفاد کے موضوعات",
            subs: [
                { en: "Women's Rights", ur: "خواتین کے حقوق", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h1 style="margin:0;text-transform:uppercase;letter-spacing:2px;font-size:1.5rem">Women\'s Rights in Pakistan</h1></header><div style="padding:35px;line-height:1.8;color:#333"><p><strong>Safety:</strong> Domestic Violence Act 2026 criminalises economic abuse and emotional abuse; marital intimidation is a specific offence; a Residence Order can evict the abuser while you stay. Anti-Rape Act 2020: 4-month trials; Two-Finger Test illegal and criminal.</p><p><strong>Digital:</strong> Sextortion (Sec 21) and cyberstalking (Sec 24) carry heavy penalties. Report to FIA at 9911; do not delete evidence.</p><p><strong>Workplace:</strong> 2022 Amendment covers students, domestic workers, and freelancers. Provincial Ombudsperson (Mohtasib) is the fastest forum.</p><p><strong>Inheritance:</strong> PPC 498-A protects your share. NADRA issues certificates within 30 days.</p><p><strong>Marriage:</strong> Ensure Column 18 of your Nikkahnama is not crossed out — it allows you to exit an abusive marriage without a long Khula battle.</p><p><strong>Custody:</strong> Poverty is not a ground to deny a mother custody (Supreme Court 2026).</p></div><footer style="background:#002147;color:#fff;padding:20px;text-align:center;font-size:0.9rem"><strong>Legal Aid: 1099</strong> | <strong>Cybercrime: 9911</strong> | <strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Domestic Violence", ur: "گھریلو تشدد", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:15px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:30px;text-align:center;border-bottom:5px solid #D4AF37"><h1 style="margin:0;text-transform:uppercase;letter-spacing:2px;font-size:1.5rem">Domestic Violence Protection</h1></header><div style="padding:30px;line-height:1.8;color:#333"><p>Domestic violence now includes physical abuse, emotional/psychological abuse (insults, threats of divorce or second marriage), economic abuse (denying kharcha, hiding property), and stalking. Immediate remedies — no need to wait for divorce or criminal trial: Protection Order (banning contact/proximity), Residence Order (you stay, abuser leaves), Monetary Order (medical bills + maintenance). Document with MLC, digital trails, and witnesses. File at a police station or directly in Family Court. Request in-camera proceedings for privacy.</p></div><footer style="background:#002147;color:#fff;padding:15px;text-align:center;font-size:0.9rem;border-top:5px solid #D4AF37"><strong>Legal Aid: 1099</strong> | <strong>Police: 15</strong> | <strong>Cybercrime: 9911</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Tax Law & FBR Compliance", ur: "ٹیکس قوانین اور ایف بی آر", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:12px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:25px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase">Tax Law: Citizen\'s Guide 💰</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>Being a filer (Active Taxpayers List) reduces withholding tax on bank withdrawals, property purchases, and vehicle registration. Citizens earning over Rs.600,000/year must file. Register for NTN via FBR IRIS portal using your CNIC. File a Wealth Statement reconciling income with assets — unexplained gaps trigger FBR notices. FBR cannot freeze your account without a prior notice and final assessment order (Sec 140). Appeal unfair treatment to the Commissioner (Appeals) or Federal Tax Ombudsman (FTO) at 1144. Always collect tax deduction certificates from your bank, telecom, and employer.</p></div><footer style="background:#002147;color:#fff;padding:15px;text-align:center;font-size:0.85rem"><strong>FBR: 051-111-772-772</strong> | <strong>Tax Ombudsman: 1144</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "Consumer Rights & Protection", ur: "صارفین کے حقوق", desc: '<article style="font-family:Segoe UI,sans-serif;border:2px solid #002147;border-radius:12px;max-width:900px;margin:20px auto;overflow:hidden;background:#fff"><header style="background:#002147;color:#fff;padding:25px;text-align:center;border-bottom:5px solid #D4AF37"><h2 style="margin:0;text-transform:uppercase">Consumer Protection: Your Rights 🛒</h2></header><div style="padding:30px;line-height:1.7;color:#333"><p>Under Provincial Consumer Protection Acts (PCPA 2005), sellers must provide receipts, repair/replace defective goods or refund, and display prices and expiry dates. "No Return/No Exchange" signs are legally void for defective items. Filing in Consumer Court is free and no lawyer is needed. Process: send a written legal notice via registered post within 15 days; if no response, file in District Consumer Court within 30 days (claim product cost + mental agony). Keep original receipt, defect photos, and courier receipt as evidence. Record an unboxing video for online purchases.</p></div><footer style="background:#002147;color:#fff;padding:15px;text-align:center;font-size:0.85rem"><strong>Consumer Helpline: 0800-08808</strong> | <strong>Qanoon 24/7</strong></footer></article>' },

/* ═══════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
let currentLang = 'en';
// Track the currently displayed view so language toggle re-renders it
let currentView = { type: 'welcome' };
// Cache translated HTML to avoid repeat API calls
const translationCache = {};

/* ═══════════════════════════════════════════════════════════════
   TRANSLATION — Claude API
   Translates the English HTML of an article into Urdu.
   Uses a cache so each article is only ever translated once.
═══════════════════════════════════════════════════════════════ */
async function translateToUrdu(htmlContent, cacheKey) {
    // Return cached result if available
    if (translationCache[cacheKey]) {
        return translationCache[cacheKey];
    }

    const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 1000,
            messages: [{
                role: "user",
                content: `You are a professional legal translator specialising in Pakistani law.
Translate the TEXT CONTENT of the following HTML into clear, formal Urdu (Nastaliq script).

CRITICAL RULES:
- Preserve ALL HTML tags, attributes, and inline styles EXACTLY as-is.
- Only translate the visible text between the tags.
- Keep all legal section numbers (e.g. Section 302 PPC, Article 10), article numbers, phone/helpline numbers, and emergency numbers unchanged.
- Keep English acronyms such as PPC, CrPC, MFLO, FIA, NAB, NADRA, CNIC, MLC, FIR, RTI, PFSA etc. unchanged.
- Keep proper nouns like Pakistan, Qanoon 24/7, NADRA, PFSA unchanged.
- Return ONLY the translated HTML — no preamble, no explanation, no markdown code fences.

HTML to translate:
${htmlContent}`
            }]
        })
    });

    const data = await response.json();
    const translated = data.content[0].text;
    translationCache[cacheKey] = translated;
    return translated;
}

/* ═══════════════════════════════════════════════════════════════
   OVERLAY HELPERS
   Show/hide the loading spinner that sits over the info-card.
═══════════════════════════════════════════════════════════════ */
function showOverlay(msg) {
    document.getElementById('overlayMsg').textContent = msg || 'ترجمہ ہو رہا ہے...';
    document.getElementById('translationOverlay').classList.add('active');
    document.getElementById('langBtn').disabled = true;
}

function hideOverlay() {
    document.getElementById('translationOverlay').classList.remove('active');
    document.getElementById('langBtn').disabled = false;
}

/* ═══════════════════════════════════════════════════════════════
   WELCOME SCREEN
   Renders the landing page in the currently selected language.
═══════════════════════════════════════════════════════════════ */
function renderWelcome() {
    currentView = { type: 'welcome' };
    const d = welcomeData[currentLang];

    document.getElementById('content-title').style.display = 'none';
    document.getElementById('steps-container').innerHTML = '';
    document.getElementById('content-desc').innerHTML = `
        <span class="welcome-eyebrow anim-1">${d.eyebrow}</span>
        <h1 class="welcome-title anim-2">${d.title}</h1>
        <div class="welcome-divider anim-3"></div>
        <p class="welcome-desc anim-4">${d.description}</p>
        <div class="welcome-steps anim-5">
            ${d.steps.map(s => `
                <div class="welcome-step-card">
                    <span class="step-numeral">${s.numeral}</span>
                    <span class="step-label">${s.label}</span>
                    <p class="step-body">${s.body}</p>
                </div>`).join('')}
        </div>
        <div class="welcome-stats anim-6">
            ${d.stats.map(s => `
                <div class="stat-block">
                    <span class="stat-number">${s.number}</span>
                    <span class="stat-label">${s.label}</span>
                </div>`).join('')}
        </div>`;
}

/* ═══════════════════════════════════════════════════════════════
   CONTENT DISPLAY
   Called when a sidebar item is clicked.
   - For top-level items (no subs), e.g. Fundamental Rights entries.
   - For sub-items (subs array), e.g. Qatl-e-Amd.
   Both functions:
     1. Update currentView state.
     2. Set the page title.
     3. If Urdu mode and desc_ur exists → show it instantly.
     4. If Urdu mode and no desc_ur → call the API and show overlay.
     5. If English mode → show desc directly.
═══════════════════════════════════════════════════════════════ */
async function showContent(category, index) {
    const item = legalData[category][index];
    currentView = { type: 'item', category, index };
    await _renderArticle(item, `item_${category}_${index}`);
}

async function showSubContent(category, index, subIndex) {
    const sub = legalData[category][index].subs[subIndex];
    currentView = { type: 'sub', category, index, subIndex };
    await _renderArticle(sub, `sub_${category}_${index}_${subIndex}`);
}

async function _renderArticle(item, cacheKey) {
    const titleEl = document.getElementById('content-title');
    document.getElementById('steps-container').innerHTML = '';
    titleEl.style.display = 'block';

    if (currentLang === 'ur') {
        // Show Urdu title
        titleEl.innerText = item.ur || item.en;

        // If a hand-written Urdu article exists, use it instantly
        if (item.desc_ur) {
            document.getElementById('content-desc').innerHTML = item.desc_ur;
        } else {
            // Otherwise call the Claude API for translation
            showOverlay('ترجمہ ہو رہا ہے...');
            try {
                const urduHTML = await translateToUrdu(item.desc, cacheKey);
                document.getElementById('content-desc').innerHTML = urduHTML;
            } catch (err) {
                // Graceful fallback: show English if translation fails
                document.getElementById('content-desc').innerHTML = item.desc;
                console.error('Translation failed:', err);
            } finally {
                hideOverlay();
            }
        }
    } else {
        // English mode — always use desc
        titleEl.innerText = item.en;
        document.getElementById('content-desc').innerHTML = item.desc;
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ═══════════════════════════════════════════════════════════════
   SIDEBAR
   Rebuilds the entire sidebar navigation in the current language.
   Called on init and on every language toggle.
═══════════════════════════════════════════════════════════════ */
function initSidebar() {
    const sections = [
        { key: 'Fundemental', navId: 'fundemental-nav' },
        { key: 'criminal',    navId: 'criminal-nav'    },
        { key: 'civil',       navId: 'civil-nav'       }
    ];

    sections.forEach(({ key, navId }) => {
        const nav = document.getElementById(navId);
        if (!nav) return;
        nav.innerHTML = '';

        legalData[key].forEach((item, index) => {
            const group = document.createElement('li');
            group.className = 'category-group';
            const label = currentLang === 'en' ? item.en : (item.ur || item.en);
            let subItems = '';

            if (item.subs && item.subs.length) {
                item.subs.forEach((sub, subIndex) => {
                    const subLabel = currentLang === 'en' ? sub.en : (sub.ur || sub.en);
                    subItems += `<li class="sub-item"
                        onclick="showSubContent('${key}',${index},${subIndex})">${subLabel}</li>`;
                });
            } else {
                const viewLabel = currentLang === 'en' ? 'View Details' : 'تفصیلات دیکھیں';
                subItems = `<li class="sub-item"
                    onclick="showContent('${key}',${index})">${viewLabel}</li>`;
            }

            group.innerHTML = `
                <div class="category-header"
                     onclick="this.parentElement.classList.toggle('open')">
                    <span>${label}</span>
                    <span class="arrow">▶</span>
                </div>
                <ul class="sub-menu">${subItems}</ul>`;

            nav.appendChild(group);
        });
    });

    // Update section headers
    if (currentLang === 'ur') {
        document.getElementById('part1-label').textContent   = 'حصہ اول: بنیادی حقوق';
        document.getElementById('part2-label').textContent   = 'حصہ دوم: فوجداری قانون';
        document.getElementById('part3-label').textContent   = 'حصہ سوم: دیوانی قانون';
        document.getElementById('portal-title').textContent  = 'عوامی پورٹل';
    } else {
        document.getElementById('part1-label').textContent   = 'Part 1: Fundamental Rights';
        document.getElementById('part2-label').textContent   = 'Part 2: Criminal Law';
        document.getElementById('part3-label').textContent   = 'Part 3: Civil Law';
        document.getElementById('portal-title').textContent  = 'Public Portal';
    }
}

/* ═══════════════════════════════════════════════════════════════
   LANGUAGE TOGGLE
   Flips the language, switches the HTML direction (RTL/LTR),
   rebuilds the sidebar, and re-renders whatever is currently open.
═══════════════════════════════════════════════════════════════ */
async function toggleLanguage() {
    currentLang = currentLang === 'en' ? 'ur' : 'en';
    document.documentElement.dir = currentLang === 'ur' ? 'rtl' : 'ltr';
    document.getElementById('langBtn').innerText =
        currentLang === 'ur' ? 'View in English' : 'اردو میں دیکھیں';

    initSidebar();

    // Re-render whatever was open in the new language
    if (currentView.type === 'welcome') {
        renderWelcome();
    } else if (currentView.type === 'item') {
        await showContent(currentView.category, currentView.index);
    } else if (currentView.type === 'sub') {
        await showSubContent(currentView.category, currentView.index, currentView.subIndex);
    }
}

/* ═══════════════════════════════════════════════════════════════
   INIT — run on page load
═══════════════════════════════════════════════════════════════ */
window.onload = function () {
    initSidebar();
    renderWelcome();
};
</script>
