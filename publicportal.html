<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qanoon 24/7 - Legal Portal</title>
    <link

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0d2137;
            --primary-mid: #0f2d48;
            --accent-gold: #ffcc00;
            --accent-gold-dim: rgba(255, 204, 0, 0.12);
            --sidebar-width: 320px;
            --body-font: 'DM Sans', 'Segoe UI', sans-serif;
            --display-font: 'Cormorant Garamond', Georgia, serif;
        }

        body {
            background-color: #f4f7f6;
            overflow-x: hidden;
            font-family: var(--body-font);
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #0d2137 0%, #0f2d48 100%);
            color: white;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
            left: 0;
            scrollbar-width: thin;
            scrollbar-color: #ffcc00 #0d2137;
        }

        [dir="rtl"] .sidebar {
            left: auto;
            right: 0;
        }

        .logo {
            background: rgba(255, 204, 0, 0.1);
            padding: 20px;
            margin: 0 15px 25px 15px;
            border-radius: 8px;
            text-align: center;
        }

        .logo h1 {
            font-size: 20px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: var(--body-font);
        }

        .part-header {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .06em;
            margin-top: 15px;
        }

        .nav-links {
            list-style: none;
        }

        .category-group {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .category-header {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            transition: 0.3s;
        }

        .category-header:hover {
            background: rgba(255, 204, 0, 0.15);
        }

        .category-header span.arrow {
            font-size: 10px;
            transition: transform 0.3s;
        }

        .category-group.open .category-header {
            color: var(--accent-gold);
        }

        .category-group.open span.arrow {
            transform: rotate(90deg);
        }

        .sub-menu {
            list-style: none;
            background: rgba(0, 0, 0, 0.2);
            display: none;
        }

        .category-group.open .sub-menu {
            display: block;
        }

        .sub-item {
            padding: 10px 35px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.2s;
        }

        .sub-item:hover {
            opacity: 1;
            color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.05);
        }

        .sub-item.active-link {
            color: var(--accent-gold);
            opacity: 1;
            font-weight: bold;
        }

        /* ── Main Content ── */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 40px;
            transition: 0.3s;
        }

        [dir="rtl"] .main-content {
            margin-left: 0;
            margin-right: var(--sidebar-width);
        }

        .top-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        .lang-toggle {
            background: var(--accent-gold);
            color: var(--primary-dark);
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-family: var(--body-font);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform .2s, box-shadow .2s;
        }

        .lang-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .info-card {
            background: white;
            padding: 48px 52px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border-top: 6px solid var(--accent-gold);
            min-height: 80vh;
        }

        /* ── Content area (topic pages) ── */
        #content-title {
            color: var(--primary-dark);
            font-size: 28px;
            font-family: var(--body-font);
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        #content-desc {
            line-height: 1.8;
            color: #444;
            font-size: 16px;
        }

        /* ── Welcome screen ── */
        .welcome-eyebrow {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--accent-gold);
            background: var(--primary-dark);
            padding: 5px 14px;
            border-radius: 2px;
            margin-bottom: 28px;
        }

        .welcome-title {
            font-family: var(--display-font);
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            color: var(--primary-dark);
            line-height: 1.15;
            margin-bottom: 24px;
            max-width: 680px;
        }

        .welcome-title em {
            font-style: italic;
            color: #8a6e00;
        }

        .welcome-divider {
            width: 48px;
            height: 3px;
            background: var(--accent-gold);
            border-radius: 2px;
            margin-bottom: 24px;
        }

        .welcome-desc {
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.85;
            color: #4a5568;
            max-width: 620px;
            margin-bottom: 52px;
        }

        /* Step cards */
        .welcome-steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 48px;
        }

        .welcome-step-card {
            border: 1px solid #e8eaec;
            border-top: 3px solid var(--primary-dark);
            border-radius: 8px;
            padding: 28px 24px;
            background: #fafafa;
            transition: border-top-color .25s, box-shadow .25s, transform .25s;
        }

        .welcome-step-card:hover {
            border-top-color: var(--accent-gold);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
            transform: translateY(-3px);
        }

        .step-numeral {
            font-family: var(--display-font);
            font-size: 2rem;
            font-weight: 700;
            color: #dde2e8;
            line-height: 1;
            margin-bottom: 14px;
            display: block;
        }

        .step-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--primary-dark);
            margin-bottom: 8px;
            display: block;
        }

        .step-body {
            font-size: 13.5px;
            font-weight: 400;
            color: #5a6472;
            line-height: 1.6;
        }

        /* Stats strip */
        .welcome-stats {
            display: flex;
            gap: 0;
            border-top: 1px solid #edf0f2;
            padding-top: 32px;
        }

        .stat-block {
            flex: 1;
            padding-right: 32px;
            border-right: 1px solid #edf0f2;
            margin-right: 32px;
        }

        .stat-block:last-child {
            border-right: none;
            margin-right: 0;
            padding-right: 0;
        }

        .stat-number {
            font-family: var(--display-font);
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-dark);
            line-height: 1;
            display: block;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #9ca3af;
        }

        /* Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .anim-1 {
            animation: fadeUp .55s .05s ease both;
        }

        .anim-2 {
            animation: fadeUp .55s .15s ease both;
        }

        .anim-3 {
            animation: fadeUp .55s .22s ease both;
        }

        .anim-4 {
            animation: fadeUp .55s .30s ease both;
        }

        .anim-5 {
            animation: fadeUp .55s .40s ease both;
        }

        .anim-6 {
            animation: fadeUp .55s .50s ease both;
        }

        /* RTL adjustments */
        [dir="rtl"] .welcome-stats {
            flex-direction: row-reverse;
        }

        [dir="rtl"] .stat-block {
            padding-right: 0;
            padding-left: 32px;
            border-right: none;
            border-left: 1px solid #edf0f2;
            margin-right: 0;
            margin-left: 32px;
        }

        [dir="rtl"] .stat-block:last-child {
            border-left: none;
            margin-left: 0;
            padding-left: 0;
        }

        [dir="rtl"] .welcome-steps {
            direction: rtl;
        }

        /* Utility for topic article content */
        .legal-detail-box {
            background: #fff;
            padding: 10px;
        }

        .legal-detail-box h3 {
            color: #b08d00;
            margin-top: 15px;
        }

        .legal-detail-box ul {
            margin-left: 20px;
        }
    </style>
</head>

 The High Court will immediately order the police or agency to "produce the body" in court and explain under what legal authority they are holding the individual.</li></ul></section><section style="margin-bottom: 25px; background-color: #f8f9fa; border-radius: 10px; padding: 25px; border-left: 5px solid #D4AF37;"><h3 style="color: #002147; margin-top: 0;">3. Common Public Myths vs. Constitutional Facts</h3><table style="width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white;"><thead style="background-color: #002147; color: white;"><tr><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 40%;">Public Myth</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 60%;">The Constitutional Fact</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"The police can keep you in the lockup for days for questioning without a judge\'s permission."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Keeping anyone past 24 hours without a Magistrate\'s formal remand order is a severe constitutional violation.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"If I can\'t afford a lawyer, I cannot defend myself properly."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Under Article 10-A, if you face serious criminal charges and cannot afford legal representation, the state is legally bound to provide you with a defense counsel at public expense.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"The state can punish me using a newly passed law for an action I did last year."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False (Article 12).</strong> No law can be applied retrospectively to criminalize an act that was perfectly legal when you performed it.</td></tr></tbody></table></section></div><footer style="background-color: #002147; color: #ffffff; padding: 15px; text-align: center; font-size: 0.9rem; border-top: 5px solid #D4AF37;"><strong>Human Rights Helpline: 1099</strong> | <strong>Police Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>',
                    desc_ur: '<article class="life-liberty-legal-guide" style="font-family: \'Jameel Noori Nastaleeq\', \'Noto Nastaliq Urdu\', Segoe UI, Tahoma, sans-serif; direction: rtl; text-align: right; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); background-color: #ffffff;"><header style="background-color: #002147; color: #ffffff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; font-size: 1.8rem; font-weight: normal;">حقِ زندگی اور آزادی: شہریوں کے لیے رہنمائی</h1><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.2rem;">بلاوجہ گرفتاری اور نظربندی کے خلاف آپ کے آئینی تحفظات</p></header><div style="padding: 30px; line-height: 2; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px; margin-top: 0; font-weight: normal; font-size: 1.4rem;">۱۔ بنیادی آئینی تحفظات (ڈھال)</h3><p><strong>آرٹیکل 9: تحفظِ جان (زندگی کا حق)</strong><br><span style="font-style: italic; color: #555;">"کسی شخص کو زندگی یا آزادی سے محروم نہیں کیا جائے گا سوائے قانون کے مطابق۔"</span><br><strong>اصل مطلب کیا ہے:</strong> پولیس یا ریاستی حکام آپ کو بلاوجہ گرفتار نہیں کر سکتے، آپ کو نقصان نہیں پہنچا سکتے، اور نہ ہی آپ کی زندگی کو خطرے میں ڈال سکتے ہیں۔<br><strong>جدید قانونی دائرہ کار:</strong> عدالتوں نے یہ فیصلہ دیا ہے کہ "زندگی" میں صاف اور پائیدار ماحول، پینے کے صاف پانی تک رسائی، بنیادی صحت کی دیکھ بھال، اور شہری خطرات سے تحفظ کا حق بھی شامل ہے۔</p><p><strong>آرٹیکل 10: گرفتاری اور نظربندی کے خلاف تحفظات</strong><br>اگر آپ کو کبھی قانون نافذ کرنے والے اداروں کا سامنا کرنا پڑے تو یہ آپ کا سب سے بڑا دفاع ہے:</p><ul style="padding-right: 20px; padding-left: 0;"><li><strong>جاننے کا حق:</strong> آپ کو فوراً اور بالکل واضح طور پر بتایا جانا چاہیے کہ آپ کو کیوں گرفتار کیا جا رہا ہے۔</li><li><strong>قانونی مشورے کا حق:</strong> آپ کو گرفتاری کے پہلے لمحے ہی سے اپنی پسند کے وکیل سے مشورہ کرنے اور ان کے ذریعے اپنا دفاع کرنے کا آئینی حق حاصل ہے۔</li><li><strong>24 گھنٹے کا قانون:</strong> پولیس کے لیے لازم ہے کہ وہ آپ کو گرفتاری کے 24 گھنٹوں کے اندر علاقہ مجسٹریٹ (جج) کے سامنے پیش کرے۔ جج کے واضح حکم (ریمانڈ) کے بغیر 24 گھنٹے سے زیادہ کی کوئی بھی حراست مکمل طور پر غیر قانونی ہے۔</li></ul><p><strong>آرٹیکل 10-اے: منصفانہ ٹرائل کا حق</strong><br>چاہے آپ کو کسی سول تنازع کا سامنا ہو یا مجرمانہ الزام کا، آپ کو قانونی طریقہ کار (Due Process) کی ضمانت دی گئی ہے۔ اس کا مطلب ہے کہ جب تک آپ کا جرم ثابت نہ ہو جائے، آپ کو بے گناہ تصور کیا جائے گا، آپ کو ایک آزاد جج کا حق حاصل ہے، اور آپ کو اپنے خلاف پیش کیے گئے ثبوتوں کو سننے اور گواہوں پر جرح کرنے کا پورا حق ہے (<em>Audi Alteram Partem</em> — یعنی دوسرے فریق کو بھی سنا جائے)۔</p></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px; font-weight: normal; font-size: 1.4rem;">۲۔ عملی ہدایات: اگر روکا یا گرفتار کیا جائے تو کیا کریں؟</h3><p><strong>صورتحال الف: اگر آپ کو قانون نافذ کرنے والے ادارے روکیں یا حراست میں لیں</strong></p><ul style="padding-right: 20px; padding-left: 0;"><li><strong>شناخت مانگیں:</strong> شائستگی سے اہلکار کا نام، عہدہ اور وہ کس تھانے سے وابستہ ہیں، دریافت کریں۔</li><li><strong>وجہ پوچھیں:</strong> آرٹیکل 10 کے تحت آپ کو یہ پوچھنے کا قانونی حق ہے کہ "مجھے قانون کی کس دفعہ یا کس جرم کے تحت روکا جا رہا ہے؟"</li><li><strong>اہلِ خانہ کو اطلاع دیں:</strong> آپ کو اپنے مقام کے بارے میں گھر والوں یا وکیل کو بتانے کے لیے فون کال کرنے کا پورا حق ہے۔ دباؤ میں آ کر کسی خالی کاغذ پر دستخط نہ کریں اور نہ ہی کوئی بیان لکھیں — آرٹیکل 14 (عصمتِ انسانی کا تحفظ) کے تحت زبردستی لیا گیا اعترافِ جرم غیر قانونی ہے۔</li></ul><p><strong>صورتحال ب: اگر کسی کو غیر قانونی طور پر حراست میں رکھا جائے (24 گھنٹے کا قانون ٹوٹ جائے)</strong><br>اگر کسی رشتہ دار یا دوست کو حکام اٹھا لیں اور 24 گھنٹے کے اندر مجسٹریٹ کے سامنے پیش نہ کریں، تو وہ غیر قانونی حراست کے شکار ہیں۔</p><ul style="padding-right: 20px; padding-left: 0;"><li><strong>فوری اقدام:</strong> ہفتوں کا انتظار نہ کریں۔ اپنے صوبے کی ہائی کورٹ میں آرٹیکل 199 کے تحت حبسِ بے جا (Habeas Corpus) کی پٹیشن دائر کرنے کے لیے فوری طور پر وکیل کی خدمات حاصل کریں۔</li><li><strong>حبسِ بے جا کی طاقت:</strong> ہائی کورٹ فوری طور پر پولیس یا متعلقہ ادارے کو حکم دے گی کہ وہ بندے کو عدالت میں پیش کرے اور واضح کرے کہ کس قانونی اختیار کے تحت اسے حراست میں رکھا گیا ہے۔</li></ul></section><section style="margin-bottom: 25px; background-color: #f8f9fa; border-radius: 10px; padding: 25px; border-right: 5px solid #D4AF37; border-left: none;"><h3 style="color: #002147; margin-top: 0; font-weight: normal; font-size: 1.4rem;">۳۔ عام عوامی مفروضے بنام آئینی حقائق</h3><table style="width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white;"><thead style="background-color: #002147; color: white;"><tr><th style="padding: 12px; border: 1px solid #ddd; text-align: right; width: 40%;">عوامی مفروضہ</th><th style="padding: 12px; border: 1px solid #ddd; text-align: right; width: 60%;">آئینی حقیقت</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"پولیس جج کی اجازت کے بغیر پوچھ گچھ کے لیے آپ کو کئی دنوں تک حوالات میں رکھ سکتی ہے۔"</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>غلط۔</strong> مجسٹریٹ کے باقاعدہ ریمانڈ آرڈر کے بغیر کسی کو بھی 24 گھنٹے سے زیادہ رکھنا آئین کی سنگین خلاف ورزی ہے۔</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"اگر میں وکیل کا خرچہ برداشت نہیں کر سکتا، تو میں اپنا دفاع ٹھیک سے نہیں کر پاؤں گا۔"</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>غلط۔</strong> آرٹیکل 10-اے کے تحت، اگر آپ پر سنگین مجرمانہ الزامات ہیں اور آپ وکیل کی فیس ادا نہیں کر سکتے، تو ریاست قانونی طور پر پابند ہے کہ وہ سرکاری خرچے پر آپ کو دفاعی وکیل فراہم کرے۔</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"ریاست نئے پاس ہونے والے قانون کے ذریعے مجھے کسی ایسے کام پر سزا دے سکتی ہے جو میں نے پچھلے سال کیا تھا۔"</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>غلط (آرٹیکل 12)۔</strong> کوئی بھی قانون ماضی پر لاگو ہو کر کسی ایسے عمل کو جرم قرار نہیں دے سکتا جو اس وقت مکمل طور پر قانونی تھا جب آپ نے اسے انجام دیا تھا۔</td></tr></tbody></table></section></div><footer style="background-color: #002147; color: #ffffff; padding: 15px; text-align: center; font-size: 1rem; border-top: 5px solid #D4AF37;"><strong>انسانی حقوق ہیلپ لائن: 1099</strong> | <strong>پولیس ایمرجنسی: 15</strong> | <strong>قانون 24/7</strong></footer></article>'

                { en: "2. Inviolability and Protection Against Abuse", ur: "تحفظ اور عزت کا حق", desc: '<article class="protection-abuse-guide" style="font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); background-color: #ffffff;"><header style="background-color: #002147; color: #ffffff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 1.5rem;">Dignity &amp; Protection Against Abuse: Public Guide</h1><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Your Constitutional Shields Against Torture, Forced Labor, &amp; Unlawful Exploitation</p></header><div style="padding: 30px; line-height: 1.8; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px; margin-top: 0;">1. The Four Constitutional Protections Explained</h3><p><strong>Article 11: Absolute Ban on Slavery &amp; Child Labor</strong><br><strong>What it means:</strong> Human trafficking, slavery, and forced labor (begar) are completely outlawed. Furthermore, no child under the age of 14 years can be employed in any factory, mine, or hazardous workplace.<br><strong>Practical Reality:</strong> If a landlord, employer, or brick-kiln owner holds someone\'s national documents or restricts their movement because of an unpaid debt (bonded labor), they are committing a severe constitutional offense.</p><p><strong>Article 12: Protection Against Retroactive Laws</strong><br><strong>What it means:</strong> The state cannot pass a new law today to punish you for an action you committed last year when it was perfectly legal.<br><strong>Practical Reality:</strong> You can only be penalized based on the exact law that was active at the exact moment the act took place. Furthermore, the state cannot increase your punishment later if a harsher penalty is enacted after your trial.</p><p><strong>Article 13: Double Jeopardy &amp; Self-Incrimination</strong><br>This article contains two massive shields for anyone facing a legal dispute:</p><ul style="padding-left: 20px;"><li><strong>Double Jeopardy:</strong> You cannot be prosecuted or punished twice for the exact same crime. If a competent court acquits you, the police cannot arrest you again on the same initial charge.</li><li><strong>Right to Remain Silent:</strong> You cannot be forced to be a witness against yourself. You have the absolute right to refuse to give a statement that incriminates you.</li></ul><p><strong>Article 14: Inviolability of Dignity &amp; Privacy</strong><br><span style="font-style: italic; color: #555;">"The dignity of man and, subject to law, the privacy of home, shall be inviolable."</span><br><strong>What it means:</strong> This is perhaps the most powerful statement in the Constitution. It declares your human dignity untouchable.<br><strong>The Ban on Torture:</strong> Article 14 strictly prohibits physical or psychological torture for the purpose of extracting evidence or confessions. Any confession beaten out of a suspect in a police station holds zero legal weight in a court of law.</p></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">2. Practical Guidelines: How to Protect Yourself Against Abuse</h3><p><strong>Scenario A: Dealing with Forced Confessions or Police Abuse</strong></p><ul style="padding-left: 20px;"><li><strong>Stay Silent if Guarded:</strong> If you are detained, remember that under Article 13 and Article 14, you do not have to confess. Politely state that you will only give a formal statement in the presence of your defense lawyer.</li><li><strong>Document Injuries Immediately:</strong> If law enforcement subjects an individual to physical abuse, demand a medical examination the moment they are produced before the Judicial Magistrate (which must happen within 24 hours). Tell the Magistrate directly about the torture so it is logged on the court record.</li></ul><p><strong>Scenario B: Unauthorized House Searches &amp; Privacy Violations</strong></p><ul style="padding-left: 20px;"><li><strong>Demand a Search Warrant:</strong> Under Article 14, your home privacy is protected. Except in rare emergency chase scenarios, the police cannot enter your private residence without a formal Search Warrant issued by a Magistrate under Section 96 or 98 of the Criminal Procedure Code (CrPC).</li><li><strong>Identify the Officers:</strong> Ensure that female police officers are present if a home containing women is being searched. Note the names and ranks of the officers conducting the raid.</li></ul><p><strong>Scenario C: Reporting Forced or Bonded Labor</strong></p><ul style="padding-left: 20px;"><li><strong>Do Not Accept Forced Work:</strong> If an employer holds your CNIC, salary, or bounds your family to a workplace due to a loan, this is a violation of Article 11.</li><li><strong>Immediate Remedy:</strong> You can approach the District Vigilance Committee or file a constitutional writ petition in the High Court to secure immediate release and recovery of the individuals.</li></ul></section><section style="margin-bottom: 25px; background-color: #f8f9fa; border-radius: 10px; padding: 25px; border-left: 5px solid #D4AF37;"><h3 style="color: #002147; margin-top: 0;">3. Common Public Myths vs. Constitutional Facts</h3><table style="width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white;"><thead style="background-color: #002147; color: white;"><tr><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 40%;">The Public Myth</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 60%;">The Constitutional Fact</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"A confession signed inside a police station is enough to convict me."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Under Article 14 and the Qanun-e-Shahadat Order, confessions made in police custody are completely inadmissible unless made directly before a Magistrate.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"If the police suspect a crime, they have the right to enter and search any home at any time."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Article 14 guards your privacy. Unauthorized entry without legal warrants or valid statutory reasons constitutes illegal trespassing.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"Children can work anywhere as long as their parents give permission."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Article 11 strictly bans hazardous child labor under 14. Parental consent cannot override a child\'s fundamental constitutional rights.</td></tr></tbody></table></section></div><footer style="background-color: #002147; color: #ffffff; padding: 15px; text-align: center; font-size: 0.9rem; border-top: 5px solid #D4AF37;"><strong>Human Rights Helpline: 1099</strong> | <strong>Federal Ombudsman: 1055</strong> | <strong>Police Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "3. Fundamental Civil Freedoms", ur: "بنیادی شہری آزادیاں", desc: '<article class="civil-freedoms-guide" style="font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); background-color: #ffffff;"><header style="background-color: #002147; color: #ffffff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 1.5rem;">Fundamental Civil Freedoms: Public Guide</h1><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Your Constitutional Rights to Movement, Assembly, Free Speech &amp; Information</p></header><div style="padding: 30px; line-height: 1.8; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px; margin-top: 0;">1. The Core Constitutional Freedoms Explained</h3><p><strong>Article 15: Freedom of Movement</strong><br><strong>What it means:</strong> Every Pakistani citizen has the absolute right to move freely throughout the country, enter its borders, and reside or settle anywhere they choose.<br><strong>The Legal Boundary:</strong> The state can only restrict movement under temporary, reasonable laws passed for public interest (e.g., active quarantine zones or localized security lockouts).</p><p><strong>Article 16: Freedom of Assembly</strong><br><strong>What it means:</strong> Citizens possess the legal right to assemble peacefully, organize rallies, or host sit-ins for public or political causes.<br><strong>The Legal Boundary:</strong> Assemblies must remain entirely peaceful and without arms. The state can restrict gatherings under public order regulations, such as Section 144 of the Criminal Procedure Code (CrPC), if there is an imminent threat of violence.</p><p><strong>Article 17: Freedom of Association</strong><br><strong>What it means:</strong> This guarantees the right to form labor unions, trade associations, civil society organizations, or actively join and run political parties.<br><strong>The Legal Boundary:</strong> Associations cannot operate against state sovereignty or public morality.</p><p><strong>Article 18: Freedom of Trade, Business, or Profession</strong><br><strong>What it means:</strong> Every citizen has the right to enter any lawful profession or trade. The state cannot lock you out of a career path arbitrarily.<br><strong>The Legal Boundary:</strong> The state retains the right to regulate trades through licensing requirements (e.g., passing the Bar for lawyers or securing PMDC accreditation for doctors) or run public monopolies.</p><p><strong>Article 19 &amp; 19-A: Freedom of Speech &amp; Right to Information</strong><br><strong>What it means:</strong> You have the right to express your thoughts, write columns, and publish media safely. Furthermore, Article 19-A ensures you have a structural right to demand data on any matter of public importance from state institutions.<br><strong>The Legal Boundary:</strong> Free speech does not include hate speech or defamation. It is subject to reasonable legal constraints regarding national security, decency, and court contempt.</p></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">2. Practical Guidelines: How to Exercise Your Freedoms Safely</h3><p><strong>Scenario A: Encountering Local Traffic Interceptions or Blockades</strong></p><ul style="padding-left: 20px;"><li><strong>Know the Scope:</strong> Under Article 15, public roads cannot be blocked permanently by administrative forces without a clear legal reason.</li><li><strong>Action Step:</strong> If stopped at an internal provincial border check, you are legally required to verify your identity (CNIC). However, you cannot be barred from entering a specific city or territory within Pakistan unless a formal judicial order or executive safety emergency declaration explicitly bars entry.</li></ul><p><strong>Scenario B: Organizing a Peaceful Public Assembly or Protests</strong></p><ul style="padding-left: 20px;"><li><strong>Secure Permissions Proactively:</strong> If planning a protest, file an official notification with the local District Administration (Deputy Commissioner\'s office) to secure a "No Objection Certificate" (NOC). This fulfills the statutory requirement under local rules while protecting your Article 16 rights.</li><li><strong>Handle Section 144 Correctly:</strong> If the administration imposes Section 144 CrPC, any public gathering of more than four people becomes temporarily illegal. Violating it can lead to immediate arrest under Section 188 of the Pakistan Penal Code (PPC). If an administrative ban is unlawful, it must be challenged in High Court via a constitutional writ petition.</li></ul><p><strong>Scenario C: Dealing with Forced Confessions or Police Abuse</strong></p><ul style="padding-left: 20px;"><li><strong>Qualified Silence:</strong> Do not remain completely silent during investigations by agencies like FIA or NAB, as it may be interpreted as non-cooperation.</li><li><strong>The Statement:</strong> Clearly state: <em>"I will give my formal statement only in the presence of my lawyer."</em> Assert your right verbally without insulting the officer.</li></ul><p><strong>Scenario D: Accessing Public Records &amp; The RTI Appeal Process (Article 19-A)</strong></p><ul style="padding-left: 20px;"><li><strong>File Formal Applications:</strong> If you need to trace how public funds are spent or verify institutional policies, draft a formal RTI Application addressed to the Public Information Officer (PIO) of the respective department. Under Article 19-A, departments are legally bound to provide records within a fixed timeframe (usually 14 to 28 days depending on the province).</li><li><strong>What If No Response or Denial?</strong> If the PIO does not respond within the legal time limit or wrongly denies your request, follow these remedy steps:<br><strong>Step 1:</strong> File a First Appeal with the department\'s internal Appellate Authority (name must be displayed on their website).<br><strong>Step 2:</strong> If still unsatisfied, file a Second Appeal with your province\'s Chief Information Commission (CIC) – this is a free process, no lawyer required.<br><strong>Step 3:</strong> As a final remedy, file a Constitutional Writ Petition under Article 199 in the High Court.<br><strong>Action Tip:</strong> Always keep a dated copy (acknowledged receipt or courier slip) of every application as proof of filing.</li></ul></section><section style="margin-bottom: 25px; background-color: #f8f9fa; border-radius: 10px; padding: 25px; border-left: 5px solid #D4AF37;"><h3 style="color: #002147; margin-top: 0;">3. Common Public Myths vs. Constitutional Facts</h3><table style="width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white;"><thead style="background-color: #002147; color: white;"><tr><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 40%;">The Public Myth</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 60%;">The Constitutional Fact</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"Freedom of speech means I can post or say anything online without any legal consequences."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Article 19 freedoms are bound by laws against defamation, cyber-harassment, and threats to state sovereignty under the Prevention of Electronic Crimes Act (PECA).</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"The district management can ban all public rallies permanently whenever they want."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Banning assemblies permanently violates Article 16. Section 144 measures are strictly temporary fixes intended to tackle immediate, visible disruptions to public peace.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"Government departments have the right to keep all internal data secret from citizens."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False (Article 19-A).</strong> Barring explicit classified military or intelligence data, public operational costs, hiring records, and municipal decisions must be made accessible to citizens upon request.</td></tr></tbody></table></section></div><footer style="background-color: #002147; color: #ffffff; padding: 15px; text-align: center; font-size: 0.9rem; border-top: 5px solid #D4AF37;"><strong>RTI Commissions Portal</strong> | <strong>Police Emergency Helpline: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "4. Equality and Education", ur: "برابری اور تعلیم", desc: '<article class="equality-education-guide" style="font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); background-color: #ffffff;"><header style="background-color: #002147; color: #ffffff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 1.5rem;">Equality &amp; Right to Education: Public Guide</h1><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Your Constitutional Protections for Equal Treatment, Gender Justice, &amp; Free Schooling</p></header><div style="padding: 30px; line-height: 1.8; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px; margin-top: 0;">1. The Core Constitutional Guarantees Explained</h3><p><strong>Article 25: Equality of Citizens &amp; Gender Justice</strong><br><strong>What it means:</strong> All citizens are completely equal before the law and are entitled to equal protection under it. There can be no discrimination based on gender alone.<br><strong>The Protective Exception:</strong> While discrimination against women is illegal, the state is explicitly allowed to make special provisions for the protection of women and children (e.g., reserving seats in assemblies, setting up dedicated women\'s police stations, or creating targeted financial support programs).</p><p><strong>Article 25-A: The Absolute Right to Free and Compulsory Education</strong><br><strong>What it means:</strong> Added via the landmark 18th Amendment, this article shifts education from a privilege to a fundamental right. The state is constitutionally bound to provide free and compulsory education to all children aged 5 to 16 years in such a manner as determined by law.</p><p><strong>Articles 26 &amp; 27: Non-Discrimination in Public Places &amp; Services</strong><br><strong>Article 26:</strong> No citizen can be barred from entering public places of entertainment, resorts, shops, or restaurants based on race, religion, caste, sex, or place of birth.<br><strong>Article 27:</strong> Safeguards your employment opportunities. You cannot be discriminated against for a government job booking or service selection based on your regional or demographic background alone.</p><p><strong>Article 28: Protection of Language, Script, and Culture</strong><br><strong>What it means:</strong> Any section of citizens possessing a distinct language, script, or regional culture has the absolute right to preserve, promote, and establish institutions for it.</p></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">2. Practical Guidelines: How to Claim Your Rights</h3><p><strong>Scenario A: Dealing with Admission Refusals in Schools (The Age 5–16 Shield)</strong></p><ul style="padding-left: 20px;"><li><strong>Know the Power of 25-A:</strong> If a public or state-funded school refuses to enroll a child aged 5 to 16 due to minor documentation issues, lack of funds, or arbitrary caps, they are violating a primary constitutional mandate.</li><li><strong>Action Step:</strong> Parents can approach the district education officer (DEO) or use provincial grievance portals (like the Prime Minister\'s Performance Delivery Unit or provincial ombudsman offices) to report the refusal. If systemic denial persists, a pro-bono writ petition can be moved in the High Court.</li></ul><p><strong>Scenario B: Facing Discrimination at Work or Public Venues</strong></p><ul style="padding-left: 20px;"><li><strong>Document the Disparity:</strong> If an enterprise, office, or public commercial space denies access, benefits, or promotional tracks purely based on regional bias or gender discrimination, gather written or electronic evidence (emails, recordings, or witness statements).</li><li><strong>Action Step:</strong> File a formal complaint with the National Commission on the Status of Women (NCSW) or the Ombudsman Office (Mohtasib) for Workplace Harassment and Discrimination. These forums bypass sluggish civil courts to deliver faster administrative resolutions.</li></ul><p><strong>Scenario C: Private Clubs Exception (Article 26)</strong></p><ul style="padding-left: 20px;"><li><strong>The Exception:</strong> Article 26 applies only to public places (restaurants, shops, state-funded venues).</li><li><strong>Member-Only Venues:</strong> Private clubs or gyms that receive no state funding and operate via private bylaws can legally restrict entry based on internal rules (e.g., requiring member sponsorship).</li><li><strong>The Catch:</strong> If the venue accepts government subsidies or occupies land on concession, Article 26 fully applies.</li><li><strong>Action Tip:</strong> Use an RTI application to check if a venue receives government funding.</li></ul><p><strong>Scenario D: Accessing Special Quotas</strong></p><ul style="padding-left: 20px;"><li><strong>Utilize Affirmative Action:</strong> Citizens should check for specific provincial statutory quotas under Article 25 and 27 directives—such as dedicated job and admission seats for women, persons with disabilities (minority/transgender inclusions), and under-developed rural regions. Always attach valid domicile certifications to enforce these claims.</li></ul></section><section style="margin-bottom: 25px; background-color: #f8f9fa; border-radius: 10px; padding: 25px; border-left: 5px solid #D4AF37;"><h3 style="color: #002147; margin-top: 0;">3. Common Public Myths vs. Constitutional Facts</h3><table style="width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white;"><thead style="background-color: #002147; color: white;"><tr><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 40%;">The Public Myth</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 60%;">The Constitutional Fact</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"Free education under Article 25-A is optional for the state depending on its economic budget."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> It is a mandatory Fundamental Right. The state is legally obligated to establish structures to ensure children up to 16 are in school.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"Private clubs or recreational venues have an absolute right to bar citizens based on their caste or province."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Under Article 26, public access areas cannot discriminate based on regional background, caste, or gender lines.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"Setting aside special seats or job quotas for women violates the principle of overall citizen equality."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Article 25(3) explicitly permits the state to execute targeted affirmative actions to uplift women and children.</td></tr></tbody></table></section></div><footer style="background-color: #002147; color: #ffffff; padding: 15px; text-align: center; font-size: 0.9rem; border-top: 5px solid #D4AF37;"><strong>Ministry of Human Rights: 1099</strong> | <strong>Wafaqi Mohtasib Helpline: 1055</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                { en: "5. Religious and Property Liberties", ur: "مذہبی اور جائیداد کی آزادی", desc: '<article class="religious-property-guide" style="font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); background-color: #ffffff;"><header style="background-color: #002147; color: #ffffff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 1.5rem;">Religious &amp; Property Liberties: Public Guide</h1><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Your Constitutional Protections for Faith Practice, Institution Management, &amp; Ownership Security</p></header><div style="padding: 30px; line-height: 1.8; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px; margin-top: 0;">1. The Core Constitutional Protections Explained</h3><p><strong>Article 20: Freedom to Profess Religion &amp; Manage Institutions</strong><br><strong>What it means:</strong> Every citizen has the right to profess, practice, and propagate their religion. Furthermore, every religious denomination or sect has the absolute right to establish, maintain, and manage its own religious institutions (such as mosques, churches, temples, and seminaries).</p><p><strong>Articles 21 &amp; 22: Safeguards Against Forced Taxation &amp; Educational Coercion</strong><br><strong>Article 21:</strong> You cannot be forced to pay any special tax if the proceeds are spent directly on the propagation or maintenance of a religion different from your own.<br><strong>Article 22:</strong> No person attending an educational institution can be compelled to receive religious instruction, take part in religious ceremonies, or attend religious worship if it relates to a religion other than their own. It also guarantees that no citizen will be denied admission to a state-funded school based on race, religion, caste, or place of birth.</p><p><strong>Articles 23 &amp; 24: The Fundamental Right to Own Property</strong><br><strong>Article 23:</strong> Every citizen has the right to acquire, hold, and dispose of property in any part of Pakistan, subject to reasonable restrictions imposed by law in the public interest.<br><strong>Article 24 (Protection of Property Rights):</strong> No person can be deprived of their property save in accordance with the law. The state cannot compulsorily acquire private land unless it is for a valid public purpose and the law provides for just compensation (market-rate payment) to the owner.</p></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">2. Practical Guidelines: How to Secure Your Liberty</h3><p><strong>Scenario A: Protecting Private Land from Arbitrary State Seizure</strong></p><ul style="padding-left: 20px;"><li><strong>Verify Acquisition Notices:</strong> If a government development authority (e.g., CDA, RDA, or LDA) attempts to take over your land, immediately demand the official notification issued under the Land Acquisition Act, 1894 (specifically Section 4 or Section 6 notifications).</li><li><strong>Action Step:</strong> Under Article 24, you have a constitutional right to object to the acquisition or challenge the valuation if the compensation offered is below fair market value. If the acquisition lacks a genuine "public purpose" or bypasses due process, a writ petition can be filed in the High Court to halt the execution.</li></ul><p><strong>Scenario B: Safe Guardrails for Buying and Selling Property</strong></p><ul style="padding-left: 20px;"><li><strong>Execute Due Diligence:</strong> To protect your Article 23 right to hold property safely, never buy land based on simple oral promises or basic stamp papers alone.</li><li><strong>Action Step:</strong> Always verify the property\'s clean title trail through the official Fard (revenue record) from the local Patwari or digital Land Records Authority portals. Ensure the final transaction is executed via a formal, registered Sale Deed (Registry) at the sub-registrar\'s office and followed immediately by a Mutation (Intiqal) to transfer the tax records to your name.</li></ul><p><strong>Scenario C: Resisting Religious Discrimination in Schools or Workplaces</strong></p><ul style="padding-left: 20px;"><li><strong>Enforce Educational Exemptions:</strong> If a minority student is being forced to take classes or exams in a religion they do not practice, or is denied admission to a public institution based on faith, this violates Article 22.</li><li><strong>Action Step:</strong> Submit a formal written application to the head of the institution citing Article 22 protections. If the administration fails to comply, escalate the matter to the provincial education department or the National Commission for Human Rights (NCHR).</li></ul></section><section style="margin-bottom: 25px; background-color: #f8f9fa; border-radius: 10px; padding: 25px; border-left: 5px solid #D4AF37;"><h3 style="color: #002147; margin-top: 0;">3. Common Public Myths vs. Constitutional Facts</h3><table style="width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white;"><thead style="background-color: #002147; color: white;"><tr><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 40%;">The Public Myth</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left; width: 60%;">The Constitutional Fact</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"The government can take over my house or land at any moment without paying me market value."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Under Article 24, the state must strictly prove a valid public purpose and is constitutionally bound to pay fair, just compensation determined by law.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"Public educational institutions can deny admission to students simply because of their religious beliefs."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Article 22(3) explicitly bans state-funded schools and colleges from discriminating against any applicant based on religion or race.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">"A property transfer is legally complete as soon as I pay the money and take physical possession."</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>False.</strong> Your right to hold property securely under Article 23 requires a complete legal title trail. Without a registered Sale Deed and Mutation (Intiqal), your ownership remains vulnerable to fraud.</td></tr></tbody></table></section></div><footer style="background-color: #002147; color: #ffffff; padding: 15px; text-align: center; font-size: 0.9rem; border-top: 5px solid #D4AF37;"><strong>National Commission for Human Rights: 1099</strong> | <strong>Land Records Helpline</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
