                        { en: "FIR", ur: "ایف آئی آر", desc: '<article class="fir-citizen-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">FIR & Police Procedures: Citizen Manual ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Section 154 CrPC | Your Rights & Remedies (2026 Edition)</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">1. The FIR Checklist: What to Include</h3><p style="font-style: italic; color: #555;">A "weak" FIR leads to a weak trial. When narrating your statement, ensure these details are precise:</p><ul style="padding-left: 20px; list-style-type: disc;"><li><strong>The "Who":</strong> Names or physical descriptions of the accused. If unknown, state "unidentified persons."</li><li><strong>The "When & Where":</strong> Precise date, time, and exact location of the incident.</li><li><strong>The "What":</strong> A factual, step-by-step narration. Avoid adding "spice" or exaggerations, as these can be used against you during cross-examination.</li><li><strong>Witnesses:</strong> Names and contact details of people who saw the incident.</li><li><strong>Evidence:</strong> Explicitly mention if there is CCTV footage, medical reports (MLC), or physical evidence like shell casings.</li></ul></section><hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">2. Frequently Asked Questions (FAQs)</h3><div style="margin-top: 15px;"><p><strong>Q: Can I file an FIR from home?</strong><br><strong>Answer:</strong> Yes. In 2026, you can use provincial apps like Punjab Police Dost, Sindh Police CMS, or the KP Police E-Policing App to lodge complaints. While these often start as "complaints," they can be converted into formal FIRs after initial verification.</p><p><strong>Q: Is there a fee for filing an FIR?</strong><br><strong>Answer:</strong> No. Filing an FIR is 100% free by law. If an officer asks for "stationery charges" or a bribe, they are committing a crime.</p><p><strong>Q: Can the police refuse to register my FIR?</strong><br><strong>Answer:</strong> Legally, no—if the crime is "cognizable" (serious crimes like theft, assault, etc.). Practically, they often do. If they refuse, you have the right to approach the Justice of Peace (Sessions Judge) under Section 22-A CrPC.</p><p><strong>Q: Can a minor or a woman file an FIR?</strong><br><strong>Answer:</strong> Yes. Any person who has knowledge of a crime can report it. For women, many cities now have dedicated Women Police Stations or help desks to ensure a comfortable environment.</p></div></section><hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;"><section style="background-color: #f9f9f9; padding: 25px; border-radius: 10px; border-left: 5px solid #d32f2f;"><h3 style="color: #d32f2f; margin-top: 0;">3. What to do if the Police Misbehave or Refuse Help</h3><p>If a police officer is rude, demands a bribe, or refuses to perform their duty, do not argue—escalate through these legal channels:</p><ul style="padding-left: 20px; list-style-type: square;"><li><strong>IGP Complaint Management System (1715):</strong> Dial 1715 (or 1787) to report misconduct directly to the Inspector General’s office. These calls are recorded and tracked.</li><li><strong>District Police Complaint Authority:</strong> Submit a written complaint to the DPO or RPO. Under the Police Order 2002, they are bound to take action for "neglect of duty."</li><li><strong>The "22-A" Petition:</strong> If the police refuse to register an FIR, hire a lawyer to file a petition under Section 22-A & 22-B CrPC in the Sessions Court. A judge can order the registration and initiate proceedings against the officer.</li><li><strong>Pakistan Citizen\'s Portal:</strong> Use the mobile app to report the specific officer. These complaints are monitored by the Prime Minister\'s Performance Delivery Unit (PMDU).</li></ul></section><div style="background-color: #fff1f1; padding: 15px; border-radius: 8px; border: 1px solid #d32f2f; margin-top: 25px;"><p style="margin: 0; color: #d32f2f;"><strong>⚠️ Warning:</strong> Never file a "False FIR" to settle a personal grudge. Under Section 182 of the PPC, giving false information to a public servant can land you in jail for up to 6 months. Stick to the truth!</p></div></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Police Emergency:</strong> 15 | <strong>IGP Complaints:</strong> 1715 | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Rights of the Accused", ur: "ملزم کے حقوق", desc: '<article class="accused-rights-comprehensive" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Rights of the Accused: From Arrest to Detention ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Legal Protections Under Pakistani Law (2026 Edition)</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">1. Comprehensive Rights: From Arrest to Detention</h3><p style="font-style: italic; color: #555;">The journey from arrest to the courtroom is governed by specific legal milestones that must be respected by the state.</p><table style="width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.95rem;"><thead><tr style="background-color: #002147; color: white;"><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">Phase</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">Legal Right</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">Legal Authority</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">At Arrest</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>Right to be Informed:</strong> You must be told the exact grounds for your arrest immediately.</td><td style="padding: 12px; border: 1px solid #ddd;">Article 10(1) Constitution</td></tr><tr style="background-color: #f9f9f9;"><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">Interrogation</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>Right to Remain Silent:</strong> You cannot be forced to give a statement or be a witness against yourself.</td><td style="padding: 12px; border: 1px solid #ddd;">Article 13(b) Constitution</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">Interrogation</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>Inadmissibility of Confession:</strong> Any confession made to a police officer is NOT evidence in court.</td><td style="padding: 12px; border: 1px solid #ddd;">Art. 38/39 Qanoon-e-Shahadat</td></tr><tr style="background-color: #f9f9f9;"><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">Custody</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>The 24-Hour Rule:</strong> You must be produced before a Magistrate within 24 hours of arrest.</td><td style="padding: 12px; border: 1px solid #ddd;">Article 10(2) Constitution</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">Legal Support</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>Right to Counsel:</strong> You have the right to consult and be defended by a lawyer of your choice.</td><td style="padding: 12px; border: 1px solid #ddd;">Article 10(1) Constitution</td></tr><tr style="background-color: #f9f9f9;"><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">Human Rights</td><td style="padding: 12px; border: 1px solid #ddd;"><strong>Protection from Torture:</strong> Dignity is inviolable; no person shall be subjected to torture for extracting evidence.</td><td style="padding: 12px; border: 1px solid #ddd;">Article 14(1) Constitution</td></tr></tbody></table></section><hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">2. Practical Action Plan: The "Defense Sequence"</h3><ul style="list-style-type: none; padding-left: 0; margin-top: 15px;"><li style="margin-bottom: 15px;"><strong>Step 1: Exercise the "Right to Silence":</strong> If the police pressure you to sign a statement, you have the constitutional right to say: <em>"I will only provide a statement in the presence of my lawyer."</em></li><li style="margin-bottom: 15px;"><strong>Step 2: Verification of the "Roznamcha":</strong> Ensure your family checks the Daily Diary (Roznamcha) at the police station. If your arrest isn\'t logged, it is "illegal detention."</li><li style="margin-bottom: 15px;"><strong>Step 3: Objecting to Physical Remand:</strong> When produced before the Magistrate, your lawyer should argue against physical remand unless the police can prove they need to "recover" specific items.</li><li style="margin-bottom: 15px;"><strong>Step 4: Requesting a Medical Exam:</strong> If you are mistreated, immediately ask the Magistrate for a medical examination under <strong>Section 54 CrPC</strong>. A medical report showing bruises is the strongest evidence against police misconduct.</li></ul></section><hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">3. Frequently Asked Questions (FAQs)</h3><div style="margin-top: 15px;"><p><strong>Q: Can I be kept in the police station for 3 days for "questioning"?</strong><br><strong>Answer:</strong> No. This is illegal. Any detention beyond 24 hours without a Magistrate’s specific "Remand Order" is a violation of Article 10. Your family can file a Habeas Corpus petition in the High Court to have you recovered immediately.</p><p><strong>Q: Does "Right to Silence" mean I don\'t have to answer anything?</strong><br><strong>Answer:</strong> You must provide basic identity details (name, address), but you have the absolute right to refuse to answer any question that relates to the alleged crime until your lawyer arrives.</p><p><strong>Q: What is "Judicial Remand"?</strong><br><strong>Answer:</strong> This is when the Judge sends you to jail (not the police station) while the trial or investigation continues. You are much safer in judicial remand than in physical (police) remand.</p></div></section><section style="background-color: #f0f4f8; padding: 25px; border-radius: 10px; border-left: 5px solid #002147; margin-top: 20px;"><p style="margin: 0; font-weight: bold; color: #002147;">The "Right to Silence" is your most powerful tool. The police often use "psychological pressure" to get a signature. Remember, if you stay silent and demand your lawyer, you prevent the police from building a fake case based on coerced words. Stay firm, stay legal!</p></section></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Human Rights Helpline:</strong> 1099 | <strong>Legal Aid:</strong> 1043 | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Bail", ur: "ضمانت", desc: '<article class="bail-provisions-manual" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Bail & Release: Citizen Manual ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">CrPC Sections 496–498 | Legal Rights & Procedures (2026 Edition)</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">1. Types of Bail You Should Know</h3><div style="overflow-x: auto; margin-top: 15px;"><table style="width: 100%; border-collapse: collapse; font-size: 0.95rem;"><thead><tr style="background-color: #002147; color: white;"><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">Type</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">When to Apply</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">Purpose</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">Pre-Arrest (Anticipatory)</td><td style="padding: 12px; border: 1px solid #ddd;">Before you are arrested.</td><td style="padding: 12px; border: 1px solid #ddd;">To prevent arrest intended for harassment or based on <em>mala fide</em> (bad faith) intentions.</td></tr><tr style="background-color: #f9f9f9;"><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">Protective Bail</td><td style="padding: 12px; border: 1px solid #ddd;">When you are in a different city.</td><td style="padding: 12px; border: 1px solid #ddd;">To get 1–2 weeks of protection to travel to the relevant court to apply for regular bail.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">Post-Arrest Bail</td><td style="padding: 12px; border: 1px solid #ddd;">After you have been arrested.</td><td style="padding: 12px; border: 1px solid #ddd;">To be released from jail while the trial is pending.</td></tr><tr style="background-color: #f9f9f9;"><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">Statutory Bail</td><td style="padding: 12px; border: 1px solid #ddd;">If the trial is delayed.</td><td style="padding: 12px; border: 1px solid #ddd;">Granted as a right if trial hasn\'t finished within 1 year (for men) or 6 months (for women).</td></tr></tbody></table></div></section><hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">2. Practical "Pro-Tips" for a Successful Bail</h3><ul style="list-style-type: none; padding-left: 0; margin-top: 15px;"><li style="margin-bottom: 15px;"><strong>The "Further Inquiry" Ground:</strong> Under Section 497(2) CrPC, if your lawyer shows that evidence is contradictory or incomplete, the court must grant bail as the case requires "further inquiry."</li><li style="margin-bottom: 15px;"><strong>The Prohibitory Clause:</strong> If the alleged crime carries a sentence of 10+ years, life, or death, bail is harder to get. Below 10 years, you are generally entitled to bail unless exceptional circumstances exist.</li><li style="margin-bottom: 15px;"><strong>Medical Grounds:</strong> If the accused is sick, elderly, or a woman, the court has extra discretion to grant bail, even in serious cases.</li><li style="margin-bottom: 15px;"><strong>Surety Bonds:</strong> Bail requires a Surety Bond (Zamanat Nama), involving property documents or a clean-record person vouching for you. Ensure documents are verified to avoid delays.</li></ul></section><hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">3. Frequently Asked Questions (FAQs)</h3><div style="margin-top: 15px;"><p><strong>Q: Can the police cancel my bail?</strong><br><strong>Answer:</strong> No. Only the Court that granted it (or a higher court) can cancel it. Police must prove you are misusing freedom (e.g., threatening witnesses) to apply for cancellation.</p><p><strong>Q: What happens if I miss a court date while on bail?</strong><br><strong>Answer:</strong> Your bail can be cancelled, your surety bond forfeited, and a "Non-Bailable Warrant" (NBW) issued. Always appear or file an "Exemption Application" via your lawyer.</p><p><strong>Q: Can I get bail in 2026 for digital/cyber crimes?</strong><br><strong>Answer:</strong> Yes. Under PECA 2016/2026 updates, these are serious, but lawyers often argue "further inquiry" because digital evidence (logs/screenshots) can be easily tampered with.</p></div></section><div style="background-color: #fff1f1; padding: 20px; border-radius: 10px; border: 1px solid #d32f2f; margin-top: 20px;"><p style="margin: 0; color: #d32f2f; font-weight: bold;">⚠️ Warning: If you are granted Interim Pre-Arrest Bail, you MUST join the police investigation immediately. If the Investigation Officer (IO) logs you as "non-cooperative," the judge will likely dismiss your bail at the next hearing.</p></div></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid:</strong> 1043 | <strong>Case Tracking:</strong> CFMS | <strong>Qanoon 24/7</strong></footer></article>' }

                        { en: "Nikah and Polygamy", ur: "نکاح اور نکاح نامہ رجسٹریشن", desc: '<article class="nikkah-comprehensive-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Legal Manual: Nikkah & Polygamy Rights ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Comprehensive Citizen Guide | 2026 Edition</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">1. Essential Requirements for a Valid Nikkah</h3><p style="margin-top: 15px;">Under the <strong>Muslim Family Laws Ordinance (MFLO) 1961</strong> and the <strong>Qanun-e-Shahadat Order</strong>, a Nikkah is a civil contract requiring the following for legal validity:</p><ul style="padding-left: 20px;"><li style="margin-bottom: 10px;"><strong>Legal Age (Provincial Variation):</strong> In Punjab, KP, and Balochistan, the minimum age is 18 for males and 16 for females. In <strong>Sindh</strong>, the minimum age is strictly 18 for both parties.</li><li style="margin-bottom: 10px;"><strong>Ijab-o-Qubul (Proposal & Acceptance):</strong> There must be a clear, verbal proposal from one party and an absolute acceptance from the other, made in the same sitting.</li><li style="margin-bottom: 10px;"><strong>Witnesses:</strong> The law requires at least two sane, adult witnesses to be present to testify to the consent of both parties.</li><li style="margin-bottom: 10px;"><strong>Mahr (Dower):</strong> This is a mandatory entitlement for the wife. It must be specified as <em>Mu\'ajjal</em> (Prompt - due immediately) or <em>Mu\'wajjal</em> (Deferred - due upon death or divorce).</li><li style="margin-bottom: 10px;"><strong>Consent:</strong> The marriage must be entered into with the free will of both parties; any marriage conducted under duress, fraud, or force is legally voidable.</li></ul></section><section style="margin-bottom: 30px; background-color: #f9f9f9; padding: 20px; border-radius: 10px;"><h3 style="color: #002147; margin-top: 0;">2. The Role of the Wali (Guardian)</h3><p>There is often public confusion regarding whether a woman needs a Wali\'s consent to marry.</p><p><strong>Legal Standing:</strong> Under the landmark <em>Saima Waheed</em> case and subsequent rulings, an adult Muslim woman can enter into a valid Nikkah without the consent of a Wali.</p><p><strong>Practical Suggestion:</strong> While a Wali is not a legal requirement for an adult woman\'s marriage, having witnesses and a registered Nikkah Registrar is mandatory to ensure the marriage is recognized by the state.</p></section><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">3. Polygamy: Rights and Restrictions</h3><p style="margin-top: 15px;">Pakistani law does not grant men an absolute or unconditional right to a second marriage. Strict procedural hurdles exist to protect the first wife:</p><ul style="padding-left: 20px;"><li style="margin-bottom: 10px;"><strong>Arbitration Council Permission:</strong> A husband must apply for and receive written permission from the Union Council\'s Arbitration Council before contracting a subsequent marriage.</li><li style="margin-bottom: 10px;"><strong>The First Wife\'s Consent:</strong> The Council will only grant permission if the first wife consents and the husband proves the second marriage is "necessary and just" (e.g., in cases of sterility or physical infirmity).</li><li style="margin-bottom: 10px;"><strong>Financial Consequences:</strong> If a man marries again without this permission, the entire Mahr (both prompt and deferred) of the first wife becomes immediately payable.</li><li style="margin-bottom: 10px;"><strong>Criminal Penalties:</strong> Violating polygamy laws can result in up to one year of imprisonment and significant fines.</li><li style="margin-bottom: 10px;"><strong>Equal Treatment:</strong> The law mandates that a husband must maintain all wives equally; failure to do so provides the first wife with a legal ground for divorce.</li></ul></section><section style="margin-bottom: 30px; border-top: 1px solid #eee; padding-top: 20px;"><h3 style="color: #002147;">4. Frequently Asked Questions (FAQs)</h3><div style="margin-top: 15px;"><p><strong>Q: Can a husband marry a second wife if the first Nikkahnama "allowed" it?</strong><br><strong>Answer:</strong> Even if the first Nikkahnama does not explicitly forbid it, the husband must still follow the legal process of obtaining permission from the Arbitration Council under Section 6 of the MFLO.</p><p><strong>Q: What is Column 18, and why is it vital in the context of polygamy?</strong><br><strong>Answer:</strong> Column 18 (Talaq-e-Tafweez) allows the husband to delegate the right of divorce to the wife. A wife can use this to add a condition that she may divorce herself if the husband takes a second wife, thereby avoiding the need to prove "cruelty" in court.</p><p><strong>Q: What happens if the Mahr was not written in the Nikkahnama?</strong><br><strong>Answer:</strong> If the amount is not specified, the court will determine a "Proper Dower" (Mahr-ul-Misl) based on the wife\'s social status and the Mahr received by her female paternal relatives.</p></div></section><div style="background-color: #eef2f7; padding: 20px; border-radius: 10px; border: 1px solid #002147;"><p style="margin: 0; font-size: 0.95rem; color: #002147;"><strong>2026 Digital Update:</strong> Many Union Councils now offer digital tracking of Nikkah registrations. Always ensure your manual Nikkahnama is converted into a <strong>NADRA Marriage Registration Certificate</strong> as soon as possible, as this is the only document recognized for international travel, bank accounts, and inheritance claims.</p></div></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid:</strong> 1043 | <strong>Human Rights:</strong> 1099 | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "NikahNama and Nikkah Registration", ur: "خلع اور طلاق", desc: '<article class="nikkahnama-registration-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Nikkahnama & Registration: Legal Manual ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Muslim Family Laws Ordinance, 1961 | 2026 Edition</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">1. Vital Clauses in the Nikkahnama</h3><p style="margin-top: 10px; font-style: italic; color: #555;">The Nikkahnama consists of 25 columns and should be treated as a high-stakes legal contract.</p><ul style="padding-left: 20px;"><li style="margin-bottom: 10px;"><strong>Column 13–16 (Mahr/Dower):</strong> This section must clearly state the amount and type of dower. <em>Mu\'ajjal</em> (Prompt) is payable immediately at the time of Nikkah, while <em>Mu\'wajjal</em> (Deferred) is payable upon demand, death, or divorce.</li><li style="margin-bottom: 10px;"><strong>Column 18 (Talaq-e-Tafweez):</strong> This delegates the right of divorce to the wife. If this is signed "Yes," the wife can end the marriage without losing her dower or needing to file for Khula in court.</li><li style="margin-bottom: 10px;"><strong>Column 19 & 20 (Special Conditions):</strong> These columns allow for custom clauses, such as the wife’s right to work, a monthly allowance (Kharch-e-Pandān), or a pre-agreed house for the wife.</li><li style="margin-bottom: 10px;"><strong>Column 21 & 22 (Polygamy):</strong> This records whether the groom has existing wives and confirms if he has obtained the mandatory legal permission from the Arbitration Council for a subsequent marriage.</li></ul></section><hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">2. The Registration Process & Legal Duties</h3><p style="margin-top: 10px; font-style: italic; color: #555;">Registration is a mandatory legal requirement under Pakistani law.</p><ul style="padding-left: 20px;"><li style="margin-bottom: 10px;"><strong>Responsibility:</strong> The Nikkah Khawan (Registrar) is legally bound to register the Nikkahnama with the local Union Council.</li><li style="margin-bottom: 10px;"><strong>Timeline:</strong> Documentation should ideally be submitted to the Union Council within 30 days of the ceremony to ensure compliance.</li><li style="margin-bottom: 10px;"><strong>Verification:</strong> Citizens must verify that the Nikkah Khawan holds a valid license from the local government to prevent fraudulent or invalid registrations.</li></ul></section><hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">3. NADRA Marriage Registration Certificate (MRC)</h3><p style="margin-top: 10px; font-style: italic; color: #555;">The computerized NADRA MRC is the only version recognized for many official and international purposes.</p><ul style="padding-left: 20px;"><li style="margin-bottom: 10px;"><strong>Legal Necessity:</strong> This certificate is required for updating CNICs, international travel (passports/visas), opening bank accounts, and claiming inheritance.</li><li style="margin-bottom: 10px;"><strong>Digital Tracking:</strong> In 2026, many Union Councils offer digital tracking to verify that the marriage has been officially logged in the state system.</li></ul></section><hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">4. Practical Suggestions for Public Awareness</h3><ul style="padding-left: 20px;"><li style="margin-bottom: 10px;"><strong>Avoid Malpractice:</strong> It is illegal for a Registrar to cross out columns—specifically 18 through 22—without the bride\'s explicit consent.</li><li style="margin-bottom: 10px;"><strong>Read Before Signing:</strong> Never sign a blank Nikkahnama or sign under pressure; once registered, the terms are legally binding.</li><li style="margin-bottom: 10px;"><strong>Maintenance Rights:</strong> A husband is legally bound to provide maintenance (food, clothing, housing), which remains enforceable through Family Courts regardless of the Nikkahnama\'s specific wording.</li></ul></section><hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;"><section style="margin-bottom: 20px;"><h3 style="color: #002147;">Frequently Asked Questions (FAQs)</h3><div style="margin-top: 15px;"><p><strong>Q: What if the Nikkah is not registered?</strong><br><strong>Answer:</strong> While the marriage may be religiously valid if essential conditions were met, non-registration is a criminal offense punishable by fines or imprisonment. It also makes legal claims regarding dower or inheritance extremely difficult to prove in court.</p><p><strong>Q: Can a husband marry again without permission?</strong><br><strong>Answer:</strong> No. Under MFLO Section 6, a husband must obtain written permission from the Arbitration Council. If he bypasses this, the entire Mahr (both prompt and deferred) becomes immediately payable to the first wife.</p></div></section></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid:</strong> 1043 | <strong>Human Rights:</strong> 1099 | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Rights of Husband and Wife", ur: "خلع اور طلاق", desc: '<article class="spousal-rights-manual" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Spousal Rights & Obligations: Legal Manual ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Muslim Family Laws Ordinance (MFLO) | 2026 Edition</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">1. Core Statutory Rights of the Wife</h3><p style="margin-top: 10px;">Under contemporary Pakistani jurisprudence, a wife holds distinct financial, personal, and legal protections:</p><ul style="padding-left: 20px;"><li style="margin-bottom: 10px;"><strong>Right to Maintenance (Nafqah):</strong> A husband is legally obligated to maintain his wife according to his financial status and social standing. This covers food, clothing, medical care, and proper housing. If a husband neglects this duty, the wife can file a recovery claim in the Family Court or file an application before the local Union Council.</li><li style="margin-bottom: 10px;"><strong>Absolute Ownership of Mahr (Dower):</strong> The Mahr is a mandatory statutory and religious right belonging exclusively to the wife.<ul><li><strong>Mu\'ajjal (Prompt Mahr):</strong> Must be paid immediately upon demand by the wife at any point during the subsistence of the marriage.</li><li><strong>Mu\'wajjal (Deferred Mahr):</strong> Must be paid immediately upon the dissolution of marriage via death or divorce.</li></ul></li><li style="margin-bottom: 10px;"><strong>Delegated Right of Divorce (Talaq-e-Tafweez):</strong> If Column 18 of the Nikkahnama is answered with a "Yes," the husband legally delegates his right of divorce to the wife. This permits the wife to dissolve the marriage contract without losing her Mahr and without having to surrender her financial rights by filing for a court-ordered Khula.</li><li style="margin-bottom: 10px;"><strong>Protection Against Unauthorized Polygamy:</strong> Under Section 6 of the MFLO, a wife has the right to object to a subsequent marriage. If a husband enters into a second marriage without the explicit written permission of the Arbitration Council, the first wife is legally entitled to the immediate payment of her entire Mahr (both prompt and deferred parts), and she can initiate criminal proceedings against him.</li></ul></section><hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">2. Core Statutory Rights of the Husband</h3><p style="margin-top: 10px;">The law establishes specific procedural rights and expectations for the husband within the marital framework:</p><ul style="padding-left: 20px;"><li style="margin-bottom: 10px;"><strong>Right to Divorce (Talaq) via Due Process:</strong> A husband possesses the right to divorce, but it is strictly regulated. He must issue a written notice of pronouncement to the Chairman of the Union Council and send a copy to his wife. A divorce does not become legally effective until a mandatory 90-day reconciliation period expires.</li><li style="margin-bottom: 10px;"><strong>Conditional Polygamy:</strong> A husband does not have an absolute right to multiple marriages. He must apply to the Arbitration Council and prove that a subsequent marriage is "necessary and just." Bypassing this step constitutes a criminal offense.</li><li style="margin-bottom: 10px;"><strong>Right to Consortium:</strong> The husband has a legal expectation of companionship, cohabitation, and fidelity within the bounds of the marriage contract, provided he fulfills his primary obligations of maintenance and safety.</li></ul></section><hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">3. Practical Suggestions for Citizens</h3><ul style="padding-left: 20px;"><li style="margin-bottom: 10px;"><strong>Do Not Accept a Crossed-Out Contract:</strong> Malpractice by Nikkah Registrars involving the crossing out of Columns 18 through 22 without the bride\'s explicit authorization is illegal. Every column must be read, negotiated, and completed truthfully.</li><li style="margin-bottom: 10px;"><strong>Utilize Column 20 for Custom Terms:</strong> Spouses can use Column 20 (Special Conditions) to write legally enforceable terms, such as ensuring the wife\'s right to continuous higher education, professional employment, a separate residential house, or a fixed monthly pocket allowance (Kharch-e-Pandān).</li><li style="margin-bottom: 10px;"><strong>Secure the Computerized Certificate:</strong> A manual Nikkahnama is the primary contract, but you must register it at the Union Council to obtain the computerized NADRA Marriage Registration Certificate (MRC). This digital document is strictly mandatory for updating CNICs, processing passports, child registration (B-Forms), and claiming inheritance.</li></ul></section><hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;"><section style="margin-bottom: 20px;"><h3 style="color: #002147;">4. Frequently Asked Questions (FAQs)</h3><div style="margin-top: 15px;"><p><strong>Q: Can a husband refuse to pay maintenance if the wife is earning?</strong><br><strong>Answer:</strong> No. Under Pakistani law, the husband\'s duty to maintain his wife is absolute and independent of her independent wealth or professional income. Even if the wife is financially independent, the husband remains legally bound to provide her maintenance.</p><p><strong>Q: What is the legal remedy if a husband refuses to pay Mahr?</strong><br><strong>Answer:</strong> The wife can file a suit for the recovery of dower in the local Family Court. If the court rules in her favor and the husband fails to pay, the court can attach his properties, freeze his bank accounts, or issue arrest warrants to enforce execution.</p></div></section></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid:</strong> 1043 | <strong>Human Rights:</strong> 1099 | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Khula & Talaq", ur: "خلع اور طلاق", desc: '<article class="marriage-dissolution-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Dissolution of Marriage: Legal Manual ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Talaq, Khula & Faskh | 2026 Edition</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">1. Talaq (Divorce by the Husband)</h3><p style="margin-top: 10px;">Talaq is the legal process through which a husband dissolves the marriage contract.</p><ul style="padding-left: 20px;"><li style="margin-bottom: 10px;"><strong>The Procedure:</strong> The husband must pronounce divorce and then send a written notice to the Chairman of the Union Council of the area where his wife resides. He is also legally required to provide a copy of this notice to the wife.</li><li style="margin-bottom: 10px;"><strong>Reconciliation Period:</strong> Upon receiving the notice, the Chairman constitutes an Arbitration Council to facilitate reconciliation between the spouses.</li><li style="margin-bottom: 10px;"><strong>Effectiveness:</strong> If reconciliation fails, the divorce becomes legally effective 90 days after the notice is delivered to the Union Council.</li><li style="margin-bottom: 10px;"><strong>Financial Consequence:</strong> The husband remains legally bound to pay the full Mahr (Dower) to the wife if it has not already been paid.</li></ul></section><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">2. Khula (Divorce Initiated by the Wife)</h3><p style="margin-top: 10px;">Khula is the process by which a wife seeks a judicial divorce through the Family Court when she can no longer live with her husband.</p><ul style="padding-left: 20px;"><li style="margin-bottom: 10px;"><strong>The Basis:</strong> A wife does not need the husband\'s consent for Khula but must file a suit in the Family Court.</li><li style="margin-bottom: 10px;"><strong>The Procedure:</strong> The court issues a decree for Khula after a failed attempt at reconciliation during the pre-trial stage.</li><li style="margin-bottom: 10px;"><strong>Financial Consideration:</strong> In a Khula, the wife is usually required to return the Mahr (or a portion of it) or waive her claim to any unpaid Mahr as a form of "compensation" for the dissolution.</li><li style="margin-bottom: 10px;"><strong>Talaq-e-Tafweez (The Exception):</strong> If the wife was granted the Right of Divorce in Column 18 of her Nikkahnama, she can divorce her husband without going to court and without losing her Mahr.</li></ul></section><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">3. Faskh/Dissolution of Marriage (Judicial Decree)</h3><p style="margin-top: 10px;">Faskh is a judicial dissolution of marriage based on specific faults or grounds provided under the Dissolution of Muslim Marriages Act 1939.</p><ul style="padding-left: 20px;"><li style="margin-bottom: 10px;"><strong>Grounds for Faskh:</strong> A wife can seek Faskh if she can prove specific grounds such as Desertion (4 years unknown whereabouts), Failure to Maintain (2 years), Cruelty (physical/mental abuse), or Imprisonment (7+ years).</li><li style="margin-bottom: 10px;"><strong>Failure to Provide Marital Benefits:</strong> Grounds include failure to maintain (Nafqah) for two years or failure to perform marital obligations without reasonable cause for three years.</li><li style="margin-bottom: 10px;"><strong>Advantage:</strong> Unlike Khula, if a wife proves a ground for Faskh (such as inability to fulfill marital benefits), she may be able to retain her full Mahr.</li></ul></section><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">4. Practical Suggestions for Citizens</h3><ul style="padding-left: 20px;"><li style="margin-bottom: 10px;"><strong>Register the Decree:</strong> You MUST obtain a Divorce Effectiveness Certificate from the Union Council to update government records and avoid legal complications.</li><li style="margin-bottom: 10px;"><strong>Check Column 18:</strong> Using the delegated right of divorce is faster and financially safer than a court-contested Khula.</li><li style="margin-bottom: 10px;"><strong>Maintenance Claims:</strong> During the 90-day Iddat period, the husband is legally required to provide maintenance to the wife.</li><li style="margin-bottom: 10px;"><strong>Child Custody:</strong> Custody is decided based on the "welfare of the minor" in separate Guardian Court proceedings.</li></ul></section><section style="margin-bottom: 20px;"><h3 style="color: #002147;">Frequently Asked Questions (FAQs)</h3><div style="margin-top: 15px;"><p><strong>Q: What is a Suit for Restitution of Conjugal Rights?</strong><br><strong>Answer:</strong> This is a legal petition filed by one spouse (usually the husband) when the other has left the marital home without a "justifiable cause". If the court rules in favor of the petitioner, it orders the other spouse to return. However, a wife can successfully defend this suit by proving cruelty, non-payment of prompt dower, or lack of a safe residence.</p><p><strong>Q: How does reconcilation occur?</strong><br><strong>Answer:</strong> Under the Muslim Family Laws Ordinance 1961, the reconciliation process begins within thirty days after the Chairman of the Union Council receives a formal written notice of divorce or a court-ordered decree. The Chairman then constitutes a formal Arbitration Council, which includes himself and one chosen representative from both the husband and the wife to ensure fair representation. Over a mandatory ninety-day waiting period, this Council schedules meetings and takes all necessary statutory steps to help the couple resolve their marital disputes and patch up differences. If the spouses successfully reach a mutual understanding during this timeframe, the divorce notice is officially withdrawn and the marriage remains fully intact; if they fail to reconcile after the ninety days expire, the Union Council formally issues a Divorce Effectiveness Certificate to finalize the dissolution in government records.</p></div></section></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid:</strong> 1043 | <strong>Human Rights:</strong> 1099 | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Maintenance (Nan-Nafqa)", ur: "نان نفقہ (خرچہ)", desc: '<article class="citizen-maintenance-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Citizen\'s Guide to Maintenance Law ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Spousal Support, Child Welfare & Legal Procedures | 2026 Edition</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">📋 The Core Legal Rights</h3><div style="margin-bottom: 15px;"><h4 style="color: #002147; margin-bottom: 5px;">1. Maintenance for the Wife</h4><p style="margin: 5px 0;"><strong>An Absolute Right:</strong> A husband must provide his wife with food, clothing, shelter, medical care, and general living expenses according to his financial status.</p><p style="margin: 5px 0;"><strong>Employment Status:</strong> A husband cannot refuse maintenance just because his wife earns her own money or is financially stable.</p><p style="margin: 5px 0;"><strong>When can it be refused?</strong> A husband is only exempt from paying if the wife is legally declared Nashiza (disobedient)—meaning she refuses to live with him without any valid legal reason (such as domestic abuse, non-payment of prompt Mahr, or cruelty).</p></div><div><h4 style="color: #002147; margin-bottom: 5px;">2. Maintenance for the Children</h4><p style="margin: 5px 0;"><strong>The Father\'s Sole Responsibility:</strong> The father is the natural guardian and must pay for his children\'s upbringing (including school fees, uniforms, and healthcare).</p><p style="margin: 5px 0;"><strong>Custody Matters Not:</strong> Even if the parents are separated or divorced and the children live with the mother, the father must pay monthly maintenance.</p><p style="margin: 5px 0;"><strong>Age Limits:</strong><br>&bull; <strong>Sons:</strong> Until they turn 18 (or longer if they are adult students dependent on the father for higher education).<br>&bull; <strong>Daughters:</strong> Continuous support until the day they get married.</p></div></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">🛠️ Practical Suggestions for Citizens</h3><p>If a husband or father refuses to pay monthly expenses, citizens do not have to wait months for a final court verdict to get financial help.</p><div style="margin-top: 15px;"><p><strong>Step 1: Gather Your Documents</strong><br>Before approaching a lawyer or the court, collect the following to make your case unbreakable:<br>&bull; Copy of your CNIC and the children\'s B-Forms.<br>&bull; The original Nikkahnama (Marriage Contract).<br>&bull; <strong>Proof of Expenses:</strong> School fee vouchers, utility bills, house rent agreements, and medical prescriptions.<br>&bull; <strong>Proof of Husband’s Income:</strong> Salary slips, tax returns, bank statements, or evidence of properties/vehicles owned by him (if available). Even if you don\'t have these, the court will demand them from him.</p><p style="margin-top: 15px;"><strong>Step 2: Use the "Interim Maintenance" Shortcut</strong><br>Many people avoid filing a case because they fear long, drawn-out legal battles. However, the law provides a safety net:<br>&bull; Under Section 17-A of the Family Courts Act, as soon as the husband makes his first appearance in court, the judge is legally mandated to fix an Interim (Temporary) Maintenance amount.<br>&bull; This temporary financial support is usually set within 1 to 3 months of filing the case to ensure the woman and children do not starve while the main trial continues.</p><p style="margin-top: 15px;"><strong>Step 3: What if he refuses to pay the Court Order?</strong><br>Pakistani Family Courts have strict mechanisms to enforce payment. If a man refuses to comply with the court-ordered maintenance, the judge can:<br>&bull; Freeze his bank accounts.<br>&bull; Attach/deduct the amount directly from his salary (if he is employed).<br>&bull; Seize and auction his properties.<br>&bull; <strong>Arrest him:</strong> The court can send a defaulting father/husband to jail for 6 months to 1 year for non-payment.</p></div></section><section style="background-color: #f9f9f9; padding: 20px; border-radius: 10px; border-left: 5px solid #002147;"><h3 style="color: #002147; margin-top: 0;">💡 Pro-Tips for General Public Awareness</h3><p style="margin: 5px 0;"><strong>Past Maintenance can be claimed:</strong> A wife can claim unpaid maintenance for up to the past 3 years, and children can claim past maintenance for up to 6 years.</p><p style="margin: 5px 0;"><strong>File where you live:</strong> A wife does not need to travel to her husband\'s city to file a case. The law allows her to file the maintenance suit in the Family Court of the area where she currently resides.</p><p style="margin: 5px 0;"><strong>Inflation adjustments:</strong> Maintenance is not fixed forever. If school fees increase or high inflation hits, a separate application for Enhancement of Maintenance can be filed to increase the monthly amount.</p></section></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid Helpline:</strong> 1043 | <strong>Ministry of Human Rights:</strong> 1099 | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Child Custody", ur: "بچوں کی تحویل (حضانت)", desc: '<article class="citizen-custody-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Citizen\'s Guide to Child Custody Law ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Minor Welfare, Guardianship Rights & Practical Court Procedures | 2026 Edition</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">📋 The Core Legal Rights</h3><div style="margin-bottom: 15px;"><h4 style="color: #002147; margin-bottom: 5px;">1. The Supreme Principle: "Welfare of the Minor"</h4><p style="margin: 5px 0;">The most important rule to remember is that Pakistani courts do not view custody as a "prize" won by a mother or a father. The entire case revolves around the Welfare of the Minor (Child). The court evaluates who can provide the best:</p><p style="margin: 5px 0;">&bull; Emotional stability and love.<br>&bull; Moral, religious, and psychological upbringing.<br>&bull; Educational environment and safety.</p></div><div style="margin-bottom: 15px;"><h4 style="color: #002147; margin-bottom: 5px;">2. Physical Custody (Hizanat) vs. Guardianship (Wilayat)</h4><p style="margin: 5px 0;">The law separates the daily physical care of a child from their legal representation:</p><p style="margin: 5px 0;"><strong>Hizanat (Physical Custody):</strong> This usually belongs to the mother for young children. Traditionally, under Islamic law, mothers get custody of boys up to age 7 and girls until they reach puberty (approx. age 16).</p><p style="margin: 5px 0;"><strong>The Exception:</strong> These age boundaries are not absolute. If a mother can prove that transferring custody to the father will harm the child’s well-being, the Guardian Court can extend her custody indefinitely.</p><p style="margin: 5px 0;"><strong>Wilayat (Guardianship):</strong> The father is the natural, legal guardian (Wali). Even if the mother has physical custody, the father retains legal authority over major life decisions (like signing passport applications or choosing a school) and must pay for all expenses.</p></div><div><h4 style="color: #002147; margin-bottom: 5px;">3. Does a Mother lose custody if she remarries?</h4><p style="margin: 5px 0;"><strong>Common Myth:</strong> Many believe a mother automatically loses her children if she takes a second husband.</p><p style="margin: 5px 0;"><strong>The Reality:</strong> No, it is not automatic. Superior courts have repeatedly ruled that unless the new stepfather creates an unsafe, abusive, or highly toxic environment for the minor, the mother can retain custody if it serves the child\'s ultimate welfare.</p></div></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">🛠️ Practical Suggestions for Citizens</h3><p>If you are facing a separation and want to ensure your children are protected, keep these actionable legal steps in mind:</p><div style="margin-top: 15px;"><p><strong>Step 1: Draft a "Parenting Plan" (Out-of-Court Settlement)</strong><br>The best way to save children from psychological trauma is to avoid a toxic courtroom battle. Parents can draft a mutual Parenting Plan or Custody Agreement detailing exactly where the child will live, how school holidays or Eid vacations will be split, and the schedule for weekly phone calls. This plan can be submitted to the Guardian Court to be formally stamped as a consent decree, making it legally binding.</p><p style="margin-top: 15px;"><strong>Step 2: Utilize the "Visitation Rights" Process</strong><br>If one parent has full custody and refuses to let the other see the children, the aggrieved parent does not have to wait years for the main trial to end. File an application for Visitation Rights / Temporary Custody under Section 12 of the Guardians and Wards Act. The court will quickly issue an interim order allowing the non-custodial parent to meet the children (usually on weekends or twice a month) inside the court\'s specialized Visitation Room or at a neutral public place.</p><p style="margin-top: 15px;"><strong>Step 3: Understand the "No Father\'s Poverty Excuse" Rule</strong><br>If a mother has physical custody but is financially poor or unemployed, a father cannot use her financial status as a weapon to snatch the kids away. The Supreme Court of Pakistan has firmly established that poverty is not a ground to deny a mother custody. Instead, the court will force the father to pay monthly child maintenance to the mother so she can comfortably raise them.</p></div></section><section style="background-color: #f9f9f9; padding: 20px; border-radius: 10px; border-left: 5px solid #002147;"><h3 style="color: #002147; margin-top: 0;">💡 Pro-Tips for General Public Awareness</h3><p style="margin: 5px 0;"><strong>The Child\'s Choice Matters:</strong> Once a child reaches a mature age (usually around 7 to 10 years old), the judge will often call them into the private chamber for an informal, gentle chat to ask them directly which parent they prefer to live with.</p><p style="margin: 5px 0;"><strong>Jurisdiction (Where to file):</strong> A custody or guardianship case must strictly be filed in the family/guardian court of the city where the child currently resides. If a father moves a child to another city purely to harass the mother, it can be treated as illegal concealment.</p><p style="margin: 5px 0;"><strong>Grandparents\' Rights:</strong> If both parents are deemed unfit, unstable, or are deceased, the maternal grandmother (Nani) followed by the paternal grandmother (Dadi) is legally prioritized for custody before other relatives.</p></section></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid Helpline:</strong> 1043 | <strong>Ministry of Human Rights:</strong> 1099 | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Inheritance", ur: "بچوں کی تحویل (حضانت)", desc: '<article class="citizen-inheritance-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Citizen\'s Guide to Inheritance Law ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Asset Distribution, Women\'s Safeguards & Succession Procedures | 2026 Edition</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">📋 The Core Legal Rights</h3><div style="margin-bottom: 15px;"><h4 style="color: #002147; margin-bottom: 5px;">1. Distinction Between Asset Types</h4><p style="margin: 5px 0;">The procedure to claim inherited property depends entirely on whether the asset is movable or immovable:</p><p style="margin: 5px 0;">&bull; <strong>Movable Assets:</strong> This includes cash in bank accounts, prize bonds, company stocks, vehicles, and insurance payouts.<br>&bull; <strong>Immovable Assets:</strong> This covers permanent structures such as houses, agricultural land, commercial plots, and apartments.</p></div><div style="margin-bottom: 15px;"><h4 style="color: #002147; margin-bottom: 5px;">2. Strict Protection for Female Heirs</h4><p style="margin: 5px 0;"><strong>A Criminal Offense to Deny Shares:</strong> Under Section 498-A of the Pakistan Penal Code (PPC), tricking, forcing, or coercing a woman into giving up her legal inheritance (often under the pretext of "renouncing her share in favor of her brothers") is a severe crime punishable by up to 10 years in prison or a heavy fine.</p><p style="margin: 5px 0;"><strong>The "Nominee" Myth:</strong> A common misconception is that if a deceased person names a specific person as a "nominee" on a bank account or insurance policy, that nominee becomes the sole owner. The Supreme Court of Pakistan has firmly ruled that a nominee is merely a trustee. They are legally obligated to collect the funds and distribute them strictly among all legal heirs according to their lawful shares.</p></div><div><h4 style="color: #002147; margin-bottom: 5px;">3. The One-Third Limitation on Wills (Wasiyat)</h4><p style="margin: 5px 0;">Unlike Western laws where a person can leave their entire estate to anyone, a Muslim in Pakistan can only make a will (Wasiyat) for a maximum of one-third (1/3) of their total property.</p><p style="margin: 5px 0;">Furthermore, this will cannot be made in favor of an existing legal heir unless all the other legal heirs explicitly consent to it after the person\'s death. The remaining two-thirds must go to the legal heirs by default.</p></div></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">🛠️ Practical Suggestions for Citizens</h3><div style="margin-top: 15px;"><p><strong>Step 1: Secure the Basic Identity Documents</strong><br>Before applying for a property transfer, the family must compile these essential foundational documents:<br>&bull; <strong>Official Death Certificate:</strong> Obtained from the local Union Council or Municipality.<br>&bull; <strong>CNIC Cancellation:</strong> Visit NADRA to formally cancel the deceased person\'s CNIC and obtain a Cancellation Certificate.<br>&bull; <strong>Family Registration Certificate (FRC):</strong> Request an FRC "by Birth" from NADRA. This document is crucial because it digitally maps out the deceased person’s parents, spouse, and children, acting as the primary proof of who the legal heirs are.</p><p style="margin-top: 15px;"><strong>Step 2: Skip the Court for Undisputed Assets (The NADRA Route)</strong><br>Under the latest Succession laws, citizens no longer need to spend years in Civil Courts for undisputed assets.<br>&bull; <strong>How it works:</strong> One of the legal heirs (carrying an authorization letter from the rest) can visit a NADRA Succession Facilitation Unit.<br>&bull; <strong>Biometric Requirement:</strong> All legal heirs must provide their biometric verification. This can be done at any NADRA center in Pakistan. If an heir lives abroad, they can complete their biometrics at designated Pakistan Foreign Missions or via NADRA\'s online portal.<br>&bull; <strong>The 14-Day Notice:</strong> NADRA will publish a public notice in newspapers. If no objections are raised within 14 days, NADRA will issue a Succession Certificate (for bank accounts/movable assets) or a Letter of Administration (for immovable property).<br>&bull; <strong>Cost:</strong> Approximately Rs. 20,000 for assets worth over Rs. 100,000.</p><p style="margin-top: 15px;"><strong>Step 3: When to Go Directly to Civil Court</strong><br>Under the Letters of Administration and Succession Certificates (Amendment) Act 2025, you do not need a rejection letter from NADRA to go to court; both hold equal jurisdiction. You should file a petition directly in the Civil Court if:<br>&bull; There is an active dispute among the family members regarding property shares.<br>&bull; An heir is completely untraceable, completely uncooperative, or cannot provide biometrics.<br>&bull; The property requires a formal Suit for Declaration under the Specific Relief Act 1877 to correct ownership records. The judge will record evidence, evaluate the FRC, and issue a binding judicial decree.</p></div></section><section style="background-color: #f9f9f9; padding: 20px; border-radius: 10px; border-left: 5px solid #002147;"><h3 style="color: #002147; margin-top: 0;">💡 Pro-Tips for General Public Awareness</h3><p style="margin: 5px 0;"><strong>No Time Limit:</strong> There is no expiry date or statute of limitations for legal heirs to claim their ancestral inheritance or apply for a succession certificate.</p><p style="margin: 5px 0;"><strong>File Regionally:</strong> Applications must be filed in the specific city or district where the deceased person normally resided or where the specific assets/properties are physically located.</p><p style="margin: 5px 0;"><strong>Avoid Oral Agreements:</strong> While oral gifts (Hiba) are technically valid under Islamic law if possession was handed over, they frequently lead to bitter court disputes. Always convert family property distributions into written, registered Gift Deeds at the local land registry office (Patwarkhana or Sub-Registrar) to ensure permanent legal safety.</p></section></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid Helpline:</strong> 1043 | <strong>Ministry of Human Rights:</strong> 1099 | <strong>Qanoon 24/7</strong></footer></article>' }
                    ]

                        { en: "Stay Orders", ur: "سٹے آرڈرز (حکم امتناہی)", desc: '<article class="citizen-stay-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Citizen\'s Guide to Stay Orders ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Emergency Protection & Legal Pause Procedures | 2026 Edition</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">📋 The 3 Things You Must Prove to the Judge</h3><p>To get a stay order, your lawyer must convince the judge of three things (the "Triple Test"):</p><ul style="list-style: none; padding-left: 0;"><li style="margin-bottom: 10px;"><strong>1. A Serious Case:</strong> You aren\'t just wasting the court\'s time. You have a solid, arguable reason why you are right.</li><li style="margin-bottom: 10px;"><strong>2. Irreparable Loss:</strong> If the judge doesn\'t stop the action now, the damage will be so bad that money can\'t fix it later (e.g., your ancestral home is demolished).</li><li style="margin-bottom: 10px;"><strong>3. Balance of Convenience:</strong> You would suffer much more if the stay is denied than the other person would suffer if the stay is granted.</li></ul></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">🛠️ Practical Steps for the Public</h3><div style="margin-top: 15px;"><p><strong>Step 1: The "Urgency Slip"</strong><br>A stay order is part of a bigger lawsuit. To get a fast hearing, your lawyer must attach an "Urgency Slip" to your application. This tells the court, "We need a judge to see this today because the bulldozers are coming tomorrow."</p><p style="margin-top: 15px;"><strong>Step 2: "Status Quo" – The Safest First Step</strong><br>If the judge is hesitant to give a full stay, ask for a "Status Quo" order. This simply means: "Everyone stop exactly where you are. Don\'t sell, don\'t build, and don\'t move." It’s a neutral way to freeze the situation.</p><p style="margin-top: 15px;"><strong>Step 3: The 15-Day Rule (Ex-Parte Stay)</strong><br>In an emergency, a judge might give you a stay without even hearing the other side first. This is called an Ex-Parte stay. Be careful: This usually lasts only 15 days. You must ensure the other party is "served" (formally notified) immediately so the judge can extend it.</p><p style="margin-top: 15px;"><strong>Step 4: Getting the Police Involved</strong><br>A court order is just a piece of paper unless people follow it. Once you get the order, take a certified copy to your local Police Station (SHO). Ask them to enter it into their daily diary (Roznamcha). This makes the police responsible for stopping any work on that property.</p></div></section><section style="background-color: #f9f9f9; padding: 20px; border-radius: 10px; border-left: 5px solid #002147;"><h3 style="color: #002147; margin-top: 0;">💡 Pro-Tips for Citizens</h3><p style="margin: 5px 0;"><strong>Don\'t Hide the Truth:</strong> If you lie to get a stay order and the other side proves it later, the judge will not only cancel the stay but may fine you heavily for "approaching the court with unclean hands."</p><p style="margin: 5px 0;"><strong>It’s Not Permanent:</strong> A stay order is temporary. Always check the "Order Sheet" after your court date. If the judge doesn\'t explicitly say "Stay to continue," it might have expired.</p><p style="margin: 5px 0;"><strong>Government Projects:</strong> Getting a stay against a government project (like a new road) is much harder and often requires a 6-month time limit for a final decision.</p></section></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid Helpline:</strong> 1043 | <strong>Police Emergency:</strong> 15 | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Illegal Dispossession", ur: "غیر قانونی قبضہ (قبضہ گروپ)", desc: '<article class="illegal-dispossession-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Protection Against Land Grabbing ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Illegal Dispossession Act & Property Recovery | 2026 Edition</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">📋 The Core Legal Rights</h3><p style="margin: 5px 0;"><strong>Immediate Protection:</strong> Under the IDA 2005, you don\'t have to wait for years in a civil court to prove ownership. If you were in lawful possession and were forcibly removed, the law\'s primary goal is to put you back in your home immediately.</p><p style="margin: 5px 0;"><strong>Criminal Penalties:</strong> Land grabbers (the "Qabza Group") can face up to 10 years in prison and heavy fines for illegal dispossession.</p><p style="margin: 5px 0;"><strong>Prevention of Further Harm:</strong> The court has the power to "attach" the property, meaning it stops the illegal occupant from selling or changing it while the case is ongoing.</p></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">🛠️ Practical Suggestions for Citizens</h3><div style="margin-top: 15px;"><p><strong>Step 1: The First 24 Hours (Police Report)</strong><br>Immediately call 15 and file an application at the local police station. Even if the police say "it\'s a civil matter," ensure your application is received and stamped. This creates a timestamped record of the event.</p><p style="margin-top: 15px;"><strong>Step 2: File a Complaint in the Sessions Court</strong><br>Unlike most property cases that start in Civil Court, an Illegal Dispossession Complaint is filed directly in the Court of the Sessions Judge. This is a faster track. Your lawyer should request "interim possession" so you can move back in while the trial continues.</p><p style="margin-top: 15px;"><strong>Step 3: The Police Inquiry (Report)</strong><br>Once you file the complaint, the Judge will usually ask the SHO (Police) or a Revenue Officer (Patwari) to visit the site and submit a report within 15 days. Ensure you are present during this visit with your documents to prove you were living there.</p><p style="margin-top: 15px;"><strong>Step 4: Evidence of Possession</strong><br>To win, you must prove you were physically there. Collect utility bills (Electricity/Gas) in your name, recent photos, or neighbor testimonials.</p></div></section><section style="background-color: #f0f4f8; padding: 20px; border-radius: 10px; margin-bottom: 25px;"><h3 style="color: #002147; margin-top: 0;">❓ Frequently Asked Questions (FAQ)</h3><p style="margin: 10px 0;"><strong>Q: Can a tenant file an Illegal Dispossession case against a landlord?</strong><br>A: Yes. If a landlord forcibly throws out a tenant without a court-ordered eviction, it is considered illegal dispossession. The law protects the occupant, not just the owner.</p><p style="margin: 10px 0;"><strong>Q: Does this law apply to family property disputes?</strong><br>A: Generally, no. Superior courts have ruled that the IDA 2005 is meant for "Qabza Groups" and land mafias. Disputes between brothers, co-sharers, or family members over inherited land should usually be settled in Civil Court.</p><p style="margin: 10px 0;"><strong>Q: What if the land grabber sells the property to someone else?</strong><br>A: Under the principle of <i>Nemo dat quod non habet</i> (no one can give what they don\'t have), the buyer gets no legal title if the seller was an illegal occupant. The court can still restore possession to you.</p></section></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid Helpline:</strong> 1043 | <strong>Police Emergency:</strong> 15 | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Land Records (Fard/Mutation)", ur: "اراضی ریکارڈ (فرد اور انتقال)", desc: '<article class="land-record-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Guide to Land Records (Fard & Mutation) ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Ownership Verification, Property Transfers & Legal Safeguards | 2026 Edition</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">📋 The Core Legal Rights</h3><p style="margin: 5px 0;"><strong>The Fard (Record of Rights):</strong> This is your official proof of ownership. It details the exact area of land you hold. You need a specific type of Fard for different tasks: Fard-e-Malkiat (for your record), Fard-e-Baye (to sell), or Fard-e-Zamanat (for court bail).</p><p style="margin: 5px 0;"><strong>The Mutation (Intiqal):</strong> This is the actual update of the government’s name-ledger. Merely having a Registry (Sale Deed) is not enough. If the Mutation is not finalized, the land still legally belongs to the previous owner in the revenue records.</p><p style="margin: 5px 0;"><strong>The Right to Verify:</strong> Every citizen has the legal right to verify any land record at the Arazi Record Center (ARC) or via official provincial land apps (like PLRA in Punjab) by paying a small fee.</p></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">🛠️ Practical Suggestions for Citizens</h3><div style="margin-top: 15px;"><p><strong>Step 1: Digital Verification Before Payment</strong><br>Before handing over any money, use the official Land Record Authority app or website. Match the Khasra (Plot) and Khewat (Account) numbers. Ensure there is no "encumbrance" (bank mortgage) or "stay order" mentioned in the remarks column.</p><p style="margin-top: 15px;"><strong>Step 2: Demand Biometric Verification</strong><br>To avoid "Paper-Grabbing," ensure that the transfer happens through the ARC. Under the digital system, both the buyer and seller must provide biometrics (thumbprints) in person. Never rely on an oral promise or just a signed paper.</p><p style="margin-top: 15px;"><strong>Step 3: The "Shajra" Check</strong><br>Always ask the Patwari or ARC official to show you the Shajra (the revenue map). This ensures the piece of land you see on the ground is the same piece of land described in the documents.</p></div></section><section style="background-color: #f0f4f8; padding: 20px; border-radius: 10px; margin-bottom: 25px;"><h3 style="color: #002147; margin-top: 0;">❓ Frequently Asked Questions (FAQ)</h3><p style="margin: 10px 0;"><strong>Q: Is a "Registry" on Stamp Paper the same as ownership?</strong><br>A: No. A Registry is a contract between two people, but Mutation is the state’s recognition of that contract. Without Mutation, you cannot get a Fard in your name, which means you cannot legally sell the property later.</p><p style="margin: 10px 0;"><strong>Q: Can I get a Fard for property in a private housing society?</strong><br>A: If the society is "notified" and its records are with the Revenue Department, yes. However, many private societies keep their own internal records (Allotment Letters). In that case, you must verify the record from the society\'s own office, not the government ARC.</p><p style="margin: 10px 0;"><strong>Q: What should I do if my Fard shows a "Stay Order" I didn\'t know about?</strong><br>A: You must immediately get a certified copy of the court order mentioned in the Fard. You cannot sell or transfer land until that stay is "Vacated" (removed) by the court.</p></section></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>PLRA Helpline:</strong> 0800-27274 | <strong>Land Records Portal:</strong> digitalpakistan.pk | <strong>Qanoon 24/7</strong></footer></article>' }
                    ]

                    en: "3. Succession & Inheritance", ur: "۳۔ وراثت اور جانشینی",
