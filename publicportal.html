                        { en: "Succession Certificate", ur: "سکسیشن سرٹیفکیٹ", desc: '<article class="succession-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Guide to Succession Certificates (NADRA) ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Inheritance Recovery, Bank Assets & Legal Heirship | 2026 Edition</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">📋 The Core Legal Rights</h3><p style="margin: 5px 0;"><strong>Administrative Speed:</strong> Under the Letters of Administration and Succession Certificates Act 2021, you can now get a certificate from NADRA in about 15–30 days, rather than 2–3 years in court.</p><p style="margin: 5px 0;"><strong>Movable vs. Immovable:</strong><br>&bull; <strong>Succession Certificate:</strong> For movable assets (Cash, Bank Accounts, Stocks, Prize Bonds).<br>&bull; <strong>Letter of Administration:</strong> For immovable property (Houses, Plots, Agricultural Land).</p><p style="margin: 5px 0;"><strong>Automatic Distribution:</strong> The certificate doesn\'t just name the heirs; it explicitly lists the Shariah shares (e.g., 1/8th for a widow, 2/3rd for children) so that banks can distribute the money correctly.</p></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">🛠️ Practical Suggestions for Citizens</h3><div style="margin-top: 15px;"><p><strong>Step 1: Get the "Deceased CNIC Cancellation" First</strong><br>Before applying for a succession certificate, you must cancel the deceased person’s CNIC at NADRA by providing their original death certificate. You will receive a Cancellation Certificate, which is a mandatory document.</p><p style="margin-top: 15px;"><strong>Step 2: One Applicant, All Heirs</strong><br>Only one legal heir needs to be the "Applicant." However, all other heirs must provide their consent. NADRA provides a standard "Authorization Letter" which all heirs must sign to authorize the applicant.</p><p style="margin-top: 15px;"><strong>Step 3: The Biometric Requirement</strong><br>This is the most critical step. Every single legal heir listed in the Family Registration Certificate (FRC) must visit a NADRA office (anywhere in the world) for biometric thumbprints. If one person is missing or refuses, the case goes to court.</p><p style="margin-top: 15px;"><strong>Step 4: The 14-Day Notice</strong><br>After you apply, NADRA will publish a notice in a national newspaper. This is to see if anyone else claims to be an heir. If no one objects within 14 days, your certificate is printed.</p></div></section><section style="background-color: #f0f4f8; padding: 20px; border-radius: 10px; margin-bottom: 25px;"><h3 style="color: #002147; margin-top: 0;">❓ Frequently Asked Questions (FAQ)</h3><p style="margin: 10px 0;"><strong>Q: What is the fee for a Succession Certificate?</strong><br>A: If the assets are worth more than Rs. 100,000, the fee is Rs. 20,000 (Rs. 22,000 in Sindh). If the assets are worth less than Rs. 100,000, the fee is Rs. 10,000.</p><p style="margin: 10px 0;"><strong>Q: What if one heir lives abroad?</strong><br>A: They don\'t need to fly to Pakistan. They can visit the nearest Pakistani Embassy/Consulate abroad to provide their biometrics or use the NADRA "Pak-ID" mobile app if available for their region.</p><p style="margin: 10px 0;"><strong>Q: When does the case have to go to Court?</strong><br>A: NADRA will issue a "Decline Certificate" and send you to Civil Court ONLY if: There is a dispute between heirs; An heir is a minor (under 18) without a legal guardian; The biometric verification of any heir fails repeatedly.</p></section></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>NADRA Helpline:</strong> 1777 | <strong>Succession Portal:</strong> succession.nadra.gov.pk | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Inheritance Distribution", ur: "وراثت کی تقسیم", desc: '<article class="inheritance-master-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2);"><header style="background-color: #002147; color: white; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; text-transform: uppercase; letter-spacing: 2px;">Public Guide to Inheritance (Wirasat) ⚖️</h2><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Asset Distribution, Shariah Rights & NADRA Procedures | 2026 Edition</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">📋 The Core Legal Rights</h3><p style="margin: 5px 0;"><strong>Mandatory Shariah Shares:</strong> Unlike many other countries, you cannot "disinherit" a legal heir. For Muslims, the Quran defines fixed shares for parents, spouses, and children.</p><p style="margin: 5px 0;"><strong>The 1/3rd "Will" Limit:</strong> A person can only make a Will (Wasiyat) for up to 1/3rd of their estate, and it must be for someone other than their legal heirs (unless all other heirs agree after the death).</p><p style="margin: 5px 0;"><strong>Protection of Female Heirs:</strong> Under Section 498A PPC, preventing a woman from receiving her inheritance (through force, fraud, or emotional pressure) is a crime punishable by up to 10 years in prison.</p><p style="margin: 5px 0;"><strong>Court-Free Succession:</strong> For undisputed cases, the Succession Certificates Act 2021 empowers NADRA to issue certificates for both cash (movable) and property (immovable) within 15–30 days.</p></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">🛠️ Practical Suggestions for Citizens</h3><div style="margin-top: 15px;"><p><strong>Step 1: Start with the "Cancellation Certificate"</strong><br>You cannot apply for inheritance until you cancel the deceased\'s CNIC. Visit NADRA with the union council death certificate to get the Cancellation Certificate and an updated Family Registration Certificate (FRC).</p><p style="margin-top: 15px;"><strong>Step 2: Verify the "Family Tree"</strong><br>Check the FRC carefully. If a name is missing or misspelled, fix it at NADRA before applying for succession. One missing name can stop the entire process.</p><p style="margin-top: 15px;"><strong>Step 3: The Biometric Rule</strong><br>Every heir mentioned in the FRC must provide a biometric thumbprint. If an heir is abroad, they can use the NADRA Pak-ID App or visit a Pakistani Consulate to provide digital verification.</p><p style="margin-top: 15px;"><strong>Step 4: Don\'t Forget the "Mutation" (Intiqal)</strong><br>Getting a NADRA "Letter of Administration" is only half the work. You must take that letter to the Arazi Record Center (ARC) or the local Patwari to perform a "Wirasat Mutation." This officially puts the heirs\' names on the property\'s Fard.</p></div></section><section style="background-color: #f0f4f8; padding: 20px; border-radius: 10px; margin-bottom: 25px;"><h3 style="color: #002147; margin-top: 0;">❓ Frequently Asked Questions (FAQ)</h3><p style="margin: 10px 0;"><strong>Q: What is the cost?</strong><br>A: Rs. 20,000 for assets over Rs. 100,000; Rs. 10,000 for assets below that.</p><p style="margin: 10px 0;"><strong>Q: What if we can\'t agree on how to divide a house?</strong><br>A: If heirs cannot agree, NADRA cannot help. You must file a Partition Suit in Civil Court. The court may order the house to be sold and the cash divided according to Shariah shares.</p><p style="margin: 10px 0;"><strong>Q: Can we distribute the property differently than the Shariah shares?</strong><br>A: Officially, the law records the Shariah shares first. After that, heirs can choose to gift (Hiba) their portion to another family member through a "Relinquishment Deed."</p></section></div><footer style="background-color: #002147; color: white; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>NADRA Helpline:</strong> 1777 | <strong>Legal Inquiries:</strong> 1043 | <strong>Qanoon 24/7</strong></footer></article>' }

                        { en: "Women’s Rights", ur: "خواتین کے حقوق", desc: '<article class="womens-rights-2026-guide" style="font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); background-color: #ffffff;"><header style="background-color: #002147; color: #ffffff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 1.5rem;">Women’s Rights in Pakistan: Your Guide</h1><p style="margin: 15px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.2rem;">Important legal updates for every citizen to know, use, and share.</p></header><div style="padding: 35px; line-height: 1.8; color: #333;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 8px; margin-top: 0;">1. Safety from Violence & Assault (State Responsibility)</h3><p>Violence against women is no longer a private family matter; it is a crime prosecuted by the State.</p><ul style="list-style-type: square; padding-left: 20px;"><li><strong>Domestic Violence Act 2026:</strong> This new act criminalizes <strong>Economic Abuse</strong> (denying financial support/property) and <strong>Emotional Abuse</strong> (insults/ridicule).</li><li><strong>Marital Intimidation:</strong> Threatening a spouse with "Second Marriage" or "Baseless Divorce" to control her is now a specific criminal offense.</li><li><strong>Residence Order:</strong> A judge can order that you stay in your house while the abuser is legally evicted, even if he owns the property.</li><li><strong>Anti-Rape Law:</strong> Special courts must decide rape cases within 4 months. The unscientific <strong>Two-Finger Test (TFT)</strong> is strictly illegal and unconstitutional. Any medical officer performing it faces criminal charges.</li></ul></section><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 8px;">2. Digital Safety (Protection from Online Crimes)</h3><p>The PECA 2016 (and 2026 updates) provides a digital shield through the FIA Cybercrime Wing.</p><ul style="list-style-type: square; padding-left: 20px;"><li><strong>Sextortion (Section 21):</strong> Sharing private media or using it for blackmail is a major crime.</li><li><strong>Cyberstalking (Section 24):</strong> Monitoring or repeatedly contacting a woman online against her will carries heavy jail time.</li><li><strong>Practical Remedy:</strong> If you are being harassed, <strong>do not delete evidence</strong>. Take screenshots and report to <strong>9911</strong> or <strong>complaint.fia.gov.pk</strong>. The FIA now uses AI-tracking to identify criminals even if they use fake IDs.</li></ul></section><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 8px;">3. Workplace & Education Rights</h3><p>The 2022 Amendment expanded protection to virtually every woman in Pakistan.</p><ul style="list-style-type: square; padding-left: 20px;"><li><strong>Universal Coverage:</strong> The law now covers Students, Domestic Workers, Freelancers, and Gig Workers.</li><li><strong>Hostile Environment:</strong> Harassment isn\'t just physical; it includes <strong>Gender Discrimination</strong> (treating you poorly because you are a woman).</li><li><strong>Immediate Action:</strong> Every office must have an Inquiry Committee. If they fail to help, you can bypass them and go directly to the <strong>Provincial Ombudsperson (Mohtasib)</strong>.</li></ul></section><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 8px;">4. Inheritance (Wirasat) & Property Rights</h3><p>Depriving a woman of her share is a Criminal Offense under the Pakistan Penal Code.</p><ul style="list-style-type: square; padding-left: 20px;"><li><strong>Section 498A PPC:</strong> Preventing a woman from receiving her share through fraud or coercion is punishable by up to 10 years in prison and a Rs. 1 million fine.</li><li><strong>Fast-Track Inheritance:</strong> For undisputed cases, <strong>NADRA</strong> now issues Succession Certificates for both cash and property within 15–30 days, skipping the civil courts entirely.</li></ul></section><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 8px;">5. Marriage, Divorce & Custody</h3><ul style="list-style-type: square; padding-left: 20px;"><li><strong>The Nikahnama Power:</strong> This is a legal contract. Ensure <strong>Column 18 (Delegated Right of Divorce)</strong> is not crossed out. This allows you to exit an abusive marriage without a long "Khula" battle.</li><li><strong>Child Custody:</strong> The Supreme Court (2026) has ruled that <strong>poverty is not a reason to deny a mother custody</strong>. A child stays with the mother as long as it serves the "Welfare of the Minor."</li></ul></section><section style="background-color: #f8f9fa; border-radius: 10px; padding: 25px; border-left: 5px solid #D4AF37;"><h3 style="color: #002147; margin-top: 0;">🚀 Immediate Remedies & Action Plan</h3><table style="width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white;"><thead style="background-color: #002147; color: white;"><tr><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">If you face...</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">Use this Remedy</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">Contact / App</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd;">Physical Danger</td><td style="padding: 12px; border: 1px solid #ddd;">Residence/Protection Order</td><td style="padding: 12px; border: 1px solid #ddd;">15 or 1099</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd;">Online Blackmail</td><td style="padding: 12px; border: 1px solid #ddd;">Content Takedown & Arrest</td><td style="padding: 12px; border: 1px solid #ddd;">9911 (FIA)</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd;">Inheritance Theft</td><td style="padding: 12px; border: 1px solid #ddd;">Criminal FIR (Section 498A)</td><td style="padding: 12px; border: 1px solid #ddd;">Wirasat Ombudsman</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd;">Workplace Abuse</td><td style="padding: 12px; border: 1px solid #ddd;">Damages/Termination</td><td style="padding: 12px; border: 1px solid #ddd;">Mohtasib (Provincial)</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd;">Child Protection</td><td style="padding: 12px; border: 1px solid #ddd;">Recovery Order</td><td style="padding: 12px; border: 1px solid #ddd;">1121</td></tr></tbody></table></section></div><footer style="background-color: #002147; color: #ffffff; padding: 20px; text-align: center; font-size: 0.9rem;"><strong>Legal Aid Helpline: 1099</strong> | <strong>Cybercrime Helpline: 9911</strong> | <strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Domestic Violence", ur: "گھریلو تشدد کی روک تھام", desc: '<article class="domestic-violence-legal-guide-2026" style="font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); background-color: #ffffff;"><header style="background-color: #002147; color: #ffffff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 1.5rem;">Domestic Violence Protection: Public Legal Guide</h1><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Your Rights, Remedies, and Practical Safety Steps | 2026 Edition</p></header><div style="padding: 30px; line-height: 1.8; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">1. What Counts as Domestic Violence?</h3><p>The law has expanded significantly. It is not just about physical "hitting" anymore. You can seek legal help if you experience:</p><ul style="padding-left: 20px;"><li><strong>Physical Abuse:</strong> Any act that causes bodily pain or harm.</li><li><strong>Emotional & Psychological Abuse:</strong> Continuous insults, ridicule, threats of divorce, or threats of a second marriage to control or humiliate you.</li><li><strong>Economic Abuse:</strong> Denying you financial support (kharcha), taking away your salary, or hiding property/inheritance documents from you.</li><li><strong>Stalking & Harassment:</strong> Monitoring your phone, following you, or obsessive jealousy that invades your privacy.</li></ul></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">2. Immediate Legal Remedies (The "Orders")</h3><p>You do not have to wait for a final divorce or a criminal trial to get protection. You can ask a Family Court for these <strong>Immediate Orders</strong>:</p><ul style="padding-left: 20px;"><li><strong>Protection Order:</strong> The court can legally ban the abuser from contacting you, stalking you, or coming near your workplace/school.</li><li><strong>Residence Order:</strong> You have the right to stay in your house. The court can order that you cannot be evicted, and in some cases, the abuser can be ordered to leave the house instead.</li><li><strong>Monetary Order:</strong> The court can order the abuser to pay for your medical bills, lost wages, and immediate maintenance (food/shelter) while the case is ongoing.</li></ul></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">3. Practical Steps: What Should You Do?</h3><p><strong>Step 1: Document the Evidence</strong><br>If it is safe to do so, keep a record. Medical Reports (MLC) from government hospitals are the strongest evidence. Save digital trails (voice notes, texts, emails) and identify witnesses.</p><p><strong>Step 2: Use the National Helplines</strong><br>Ministry of Human Rights: <strong>1099</strong> | Punjab Women’s Helpline: <strong>1043</strong> | Police Emergency: <strong>15</strong> | Cybercrime (FIA): <strong>9911</strong>.</p><p><strong>Step 3: Filing the Complaint</strong><br>You can file an FIR at a police station or approach a Family Court directly for a Protection Order. Women Protection Officers at government centers can assist you for free.</p></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">4. Myths vs. Facts</h3><table style="width: 100%; border-collapse: collapse; margin-top: 10px;"><thead style="background-color: #f2f2f2;"><tr><th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Myth</th><th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Fact</th></tr></thead><tbody><tr><td style="border: 1px solid #ddd; padding: 10px;">"I have to leave my house to report abuse."</td><td style="border: 1px solid #ddd; padding: 10px;"><strong>False.</strong> You can ask for a Residence Order to stay in your home while the abuser is barred.</td></tr><tr><td style="border: 1px solid #ddd; padding: 10px;">"Mental torture isn\'t a crime."</td><td style="border: 1px solid #ddd; padding: 10px;"><strong>False.</strong> The 2026 Act specifically criminalizes emotional and psychological harm.</td></tr><tr><td style="border: 1px solid #ddd; padding: 10px;">"I need marks on my body to prove violence."</td><td style="border: 1px solid #ddd; padding: 10px;"><strong>False.</strong> Testimony regarding emotional or economic abuse is now legally recognized.</td></tr></tbody></table></section><div style="background-color: #f0f4f8; padding: 20px; border-radius: 10px; border-left: 5px solid #002147; margin-bottom: 25px;"><strong>💡 Pro-Tip for Safety:</strong> Use the "Women Safety App." Its Panic Button notifies police of your live GPS location immediately. Remember: The law is a tool for your dignity.</div><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">❓ Frequently Asked Questions (FAQs)</h3><p><strong>Q1: Can I report verbal abuse?</strong> Yes. Under the 2026 Act, constant belittling and marital intimidation are recognized crimes.</p><p><strong>Q2: Will I lose custody if I have no income?</strong> No. A 2026 Supreme Court ruling clarified that poverty is never a ground to deny a mother custody.</p><p><strong>Q3: Can I have a private trial?</strong> Yes. You can request "In-Camera Proceedings" so the trial is held in private to protect your privacy.</p></section><section style="background-color: #002147; color: white; padding: 20px; border-radius: 10px;"><h3 style="color: #D4AF37; margin-top: 0;">🛡️ Practical Safety Checklist</h3><p style="margin: 5px 0;">Keep a "Safe Bag" with your CNIC, Nikahnama, and emergency cash. Keep emergency digits on speed dial. Do not delete the "Evidence Trail" (digital screenshots/recordings).</p><p style="font-size: 0.85rem; margin-top: 15px; border-top: 1px solid #D4AF37; padding-top: 10px;">Note for Public: These laws apply to all—including students and domestic staff. Dignity is a constitutional right for every citizen of Pakistan.</p></section></div><footer style="background-color: #002147; color: #ffffff; padding: 15px; text-align: center; font-size: 0.9rem; border-top: 5px solid #D4AF37;"><strong>Legal Aid: 1099</strong> | <strong>Police: 15</strong> | <strong>Cybercrime: 9911</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Tax Law & FBR Compliance", ur: "ٹیکس قوانین اور ایف بی آر", desc: '<article class="legal-tax-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 12px; overflow: hidden; max-width: 900px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.15);"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; letter-spacing: 1px; text-transform: uppercase;">Tax Law: A Citizen\'s Guide 💰</h2><p style="margin: 5px 0 0; color: #D4AF37; font-weight: bold;">Practical Steps for Filer Status & Wealth Statements</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">1. Filer vs. Non-Filer: The Financial Impact</h3><p>Under the Income Tax Ordinance 2001, being on the Active Taxpayers List (ATL) is a legal necessity for modern financial life in Pakistan. It significantly reduces the withholding tax on your daily transactions.</p><table style="width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.95rem;"><thead><tr style="background-color: #f0f4f8; border-bottom: 2px solid #002147;"><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">Transaction Type</th><th style="padding: 12px; border: 1px solid #ddd; text-align: center;">Filer Tax</th><th style="padding: 12px; border: 1px solid #ddd; text-align: center;">Non-Filer Tax</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd;"><strong>Bank Withdrawals</strong></td><td style="padding: 12px; border: 1px solid #ddd; text-align: center;">0%</td><td style="padding: 12px; border: 1px solid #ddd; text-align: center;">Higher Rates</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd;"><strong>Property Purchase</strong></td><td style="padding: 12px; border: 1px solid #ddd; text-align: center;">Lower Rate</td><td style="padding: 12px; border: 1px solid #ddd; text-align: center;">Double/Triple</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd;"><strong>Vehicle Registration</strong></td><td style="padding: 12px; border: 1px solid #ddd; text-align: center;">Standard</td><td style="padding: 12px; border: 1px solid #ddd; text-align: center;">Penalty Rates</td></tr></tbody></table></section><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">2. Practical Compliance Checklist</h3><p>Tax compliance is not just for businesses; it is for every citizen earning above the taxable limit (currently PKR 600,000 per year for salaried individuals).</p><ul style="padding-left: 20px;"><li><strong>IRIS Portal Registration:</strong> You can register for an NTN (National Tax Number) online using your CNIC via the FBR IRIS portal.</li><li><strong>Wealth Statement:</strong> When filing returns, you MUST file a Wealth Statement. This reconciles your income with your assets. If your expenses exceed your declared income, FBR can issue a notice.</li><li><strong>Tax Credits:</strong> Save your bills! You can get tax credits (rebates) on charitable donations, insurance premiums, and investment in shares/voluntary pension funds.</li></ul></section><section style="background-color: #f9f9f9; padding: 20px; border-radius: 8px; border-left: 5px solid #d32f2f;"><h3 style="color: #d32f2f; margin-top: 0;">Rights Against FBR Harassment</h3><p><strong>Q: Can an FBR officer freeze my bank account?</strong><br>Not without a prior notice and a final assessment order. Under <strong>Section 140</strong>, they must give you an opportunity to be heard.</p><p><strong>Q: Where do I go if I am treated unfairly?</strong><br>You can file an appeal with the <strong>Commissioner (Appeals)</strong> or approach the <strong>Federal Tax Ombudsman (FTO)</strong> for cases of maladministration or harassment.</p></section><div style="margin-top: 25px; background-color: #fff3cd; padding: 15px; border: 1px dashed #856404; font-size: 0.95rem;"><strong>Filer Tip:</strong> Always collect "Tax Deduction Certificates" from your bank, cellular company, and employer. These amounts are adjustable against your final tax liability, meaning you might owe less than you think!</div></div><footer style="background-color: #002147; color: white; padding: 15px; text-align: center; font-size: 0.85rem;"><strong>FBR Helpline:</strong> 051-111-772-772 | <strong>Tax Ombudsman:</strong> 1144 | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Consumer Rights & Protection", ur: "صارفین کے حقوق اور تحفظ", desc: '<article class="legal-consumer-guide" style="font-family: Segoe UI, Arial, sans-serif; border: 2px solid #002147; border-radius: 12px; overflow: hidden; max-width: 900px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.15);"><header style="background-color: #002147; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #D4AF37;"><h2 style="margin: 0; letter-spacing: 1px; text-transform: uppercase;">Consumer Protection: Your Rights 🛒</h2><p style="margin: 5px 0 0; color: #D4AF37; font-weight: bold;">Practical Guide to Filing Complaints & Seeking Damages</p></header><div style="padding: 30px; line-height: 1.7; color: #333;"><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">1. Know Your Rights as a Citizen</h3><p>Under the Provincial Consumer Protection Acts (e.g., PCPA 2005), every citizen has the right to be protected against defective products and faulty services. This covers everything from electronics and cars to medical services and tailors.</p><table style="width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.95rem;"><thead><tr style="background-color: #f0f4f8; border-bottom: 2px solid #002147;"><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">Right</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">Legal Obligation of Seller</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd;"><strong>Receipt</strong></td><td style="padding: 12px; border: 1px solid #ddd;">Must provide a bill for every purchase.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd;"><strong>Return/Refund</strong></td><td style="padding: 12px; border: 1px solid #ddd;">Must repair/replace defective goods or refund money.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd;"><strong>Disclosure</strong></td><td style="padding: 12px; border: 1px solid #ddd;">Must display prices and expiry dates clearly.</td></tr></tbody></table></section><section style="margin-bottom: 30px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; display: inline-block;">2. The 15-Day Complaint Process</h3><p>Filing a case in the Consumer Court is <strong>free</strong> and does not necessarily require a lawyer. Follow this strict timeline:</p><ul style="padding-left: 20px;"><li><strong>Step 1: Legal Notice.</strong> Within 15 days of the issue, send a written "Legal Notice" via registered post to the seller. State the problem and give them 15 days to fix it.</li><li><strong>Step 2: File Claim.</strong> If they don\'t respond, file a claim in the District Consumer Court within 30 days. You can seek compensation for the product cost PLUS mental agony.</li><li><strong>Step 3: Evidence.</strong> Keep your original receipt, photos of the defect, and the "Registry Receipt" of the legal notice.</li></ul></section><section style="background-color: #f9f9f9; padding: 20px; border-radius: 8px; border-left: 5px solid #d32f2f;"><h3 style="color: #d32f2f; margin-top: 0;">Practical Suggestions</h3><p><strong>Q: Can I sue for a service (like a bad haircut or rude behavior)?</strong><br>Yes. Consumer law applies to "Services" as well as "Products." If a professional (Doctor, Lawyer, Engineer) or a service provider (Internet, Laundry) fails to meet standards, you can move the court.</p><p><strong>Q: What if the shop says "No Return/No Exchange"?</strong><br>This phrase is <strong>legally void</strong>. If the product is defective or doesn\'t match the description, the law overrides any shop policy. They MUST replace or refund.</p></section><div style="margin-top: 25px; background-color: #fff3cd; padding: 15px; border: 1px dashed #856404; font-size: 0.95rem;"><strong>Pro-Tip:</strong> Always record a "unboxing" video for online purchases. This serves as undeniable proof in court if the item is damaged or missing.</div></div><footer style="background-color: #002147; color: white; padding: 15px; text-align: center; font-size: 0.85rem;"><strong>Consumer Helpline:</strong> 0800-08808 | <strong>Punjab Consumer Protection Council (PCPC)</strong> | <strong>Qanoon 24/7</strong></footer></article>' },
                        { en: "Traffic Laws", ur: "ٹریفک قوانین اور جرمانہ", desc: '<article class="pakistan-traffic-portal-2026" style="font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; border: 2px solid #002147; border-radius: 15px; max-width: 900px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); background-color: #ffffff;"><header style="background-color: #002147; color: #ffffff; padding: 30px; text-align: center; border-bottom: 5px solid #D4AF37;"><h1 style="margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 1.5rem;">Pakistan Road & Traffic Laws: Public Guide</h1><p style="margin: 10px 0 0; color: #D4AF37; font-weight: bold; font-size: 1.1rem;">Practical Guidelines on Digital Licenses, Safe City Enforcement, & Driver Rights</p></header><div style="padding: 30px; line-height: 1.8; color: #333;"><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px; margin-top: 0;">1. The Digital Shield: Licensing & Document Verification</h3><p>Pakistan\'s transport infrastructure has largely transitioned to digital systems, meaning citizens no longer need to panic over a forgotten physical wallet.</p><ul style="padding-left: 20px;"><li><strong>Legality of E-Licenses:</strong> If you are driving anywhere in Punjab, Sindh, or the Capital Territory, your E-License (accessible via official provincial apps like DLIMS or the Raasta App) is 100% legally valid. A traffic warden cannot fine you for "not carrying a license" if you present a verified digital version on your smartphone.</li><li><strong>The "Age Rule":</strong> Under the law, you must be at least 18 years old to obtain a non-commercial license (Motorcycle/Car) and 21 years old for commercial vehicles (LTV/HTV).</li><li><strong>The Death of the "Open Letter":</strong> If you purchase a used car or motorcycle, you can no longer legally drive it indefinitely using an "Open Transfer Letter." Buyers must complete the digital Biometric Transfer immediately. If you fail to do so, the seller can legally request to block the registration, leaving you with an unauthorized vehicle.</li></ul></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">2. AI Surveillance & The E-Challan System</h3><p>The days of only getting caught if a warden pulls you over are gone. AI-integrated networks track major metropolitans continuously.</p><ul style="padding-left: 20px;"><li><strong>What Triggers an Automatic Fine:</strong> High-definition Automatic Number Plate Recognition (ANPR) cameras automatically issue electronic tickets for skipping red lights, overlapping or stopping on the white Zebra Crossing / Stop Line at a red signal, riding a motorcycle without a safety helmet (mandatory for both the rider and the pillion passenger), or violating one-way lanes and texting while driving.</li><li><strong>Proactive Status Checking:</strong> E-challans are sent via SMS to the mobile number registered against the vehicle\'s Excise profile. Because delivery systems can fail, citizens should check their status monthly on the Official PSCA E-Challan Portal or local traffic apps using their vehicle number and CNIC.</li><li><strong>Blacklisted Vehicles:</strong> Leaving e-challans unpaid for a prolonged period will trigger an automatic systemic "blacklist" status. This prevents you from paying your annual vehicle tokens or legally transferring ownership when trying to sell it.</li></ul></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">3. Understanding Your Rights During a Traffic Stop</h3><p>Knowing the exact boundaries of the law protects you from exploitation and ensures smooth daily commuting.</p><ul style="padding-left: 20px;"><li><strong>The Strict No-Cash Protocol:</strong> Under standard modern traffic regulations, no ticketing officer is legally authorized to collect fine cash on the spot. All penalties must be resolved digitally using the unique PSID number printed on your ticket via mobile wallets (EasyPaisa/JazzCash), ePay platforms, or ATMs.</li><li><strong>The Ticket as a Temporary Permit:</strong> If a warden temporarily confiscates a physical document (like an old registration book or physical license card) due to a specific violation, the physical or electronic ticket they hand you serves as your legal Temporary Driving Permit for a standard window (usually 10 days) while you clear the fine.</li><li><strong>Identification Demands:</strong> While you are legally obligated to prove your identity and ownership by presenting your documents (physical or digital), you have the right to note the officer’s name or visible belt badge number. Misconduct, wrongful ticketing, or bribery demands should be reported immediately to the centralized traffic helpline at 1915 or the police emergency line 15.</li></ul></section><section style="margin-bottom: 25px;"><h3 style="color: #002147; border-bottom: 2px solid #D4AF37; padding-bottom: 5px;">4. Safety Essentials: Road Rules Often Forgotten</h3><ul style="padding-left: 20px;"><li><strong>The 2-Second Rule (Highways & Motorways):</strong> The NHMP heavily enforces distance spacing. Always maintain a minimum 2-second gap from the vehicle ahead; tailgating cameras automatically register violations.</li><li><strong>Lane Discipline:</strong> On high-speed corridors, the extreme right lane is reserved strictly for overtaking. Cruising in the right lane continuously while blocking faster traffic is a fineable offense.</li><li><strong>High Beams:</strong> Using high-beam headlights within city limits during clear nights is illegal, as it temporarily blinds oncoming traffic. Keep your headlights adjusted to "low beam" unless navigating unlit, rural terrain.</li></ul></section><section style="margin-bottom: 25px; background-color: #f8f9fa; border-radius: 10px; padding: 25px; border-left: 5px solid #D4AF37;"><h3 style="color: #002147; margin-top: 0;">🚀 Citizen Quick-Action Checklist</h3><table style="width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white;"><thead style="background-color: #002147; color: white;"><tr><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">If you need to...</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">Best Practical Approach</th><th style="padding: 12px; border: 1px solid #ddd; text-align: left;">Official Platform / App</th></tr></thead><tbody><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">Check for Hidden Fines</td><td style="padding: 12px; border: 1px solid #ddd;">Enter vehicle registration & CNIC</td><td style="padding: 12px; border: 1px solid #ddd;">PSCA E-Challan Portal / Raasta App</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">Verify a Used Car Purchase</td><td style="padding: 12px; border: 1px solid #ddd;">Avoid "Open Letters"; request live biometric data</td><td style="padding: 12px; border: 1px solid #ddd;">Provincial Excise & Taxation Dept.</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">Show Your Driving Authorization</td><td style="padding: 12px; border: 1px solid #ddd;">Present a legally compliant barcode/e-license</td><td style="padding: 12px; border: 1px solid #ddd;">DLIMS Portal</td></tr><tr><td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">Report Roadside Corruption</td><td style="padding: 12px; border: 1px solid #ddd;">Note the warden\'s badge number & call dispatch</td><td style="padding: 12px; border: 1px solid #ddd;">1915 or 15</td></tr></tbody></table></section></div><footer style="background-color: #002147; color: #ffffff; padding: 15px; text-align: center; font-size: 0.9rem; border-top: 5px solid #D4AF37;"><strong>Traffic Helpline: 1915</strong> | <strong>Motorway Assistance: 130</strong> | <strong>Emergency: 15</strong> | <strong>Qanoon 24/7</strong></footer></article>' }
                    ]
                }
            ]
        };

        /* ═══════════════════════════════════════════════════

                steps: [

                    { numeral: "II", label: "موضوع چنیں", body: "زمرہ کھولیں اور اپنی صورتحال سے متعلق مخصوص قانونی مسئلہ یا حق منتخب کریں۔" },

        // Your data object
        const guideData = {

            desc_ur: '<article>...</article>' // Urdu HTML string

        function updateGuideLanguage(lang) {
            const container = document.getElementById("guide-container");

            if (lang === 'ur') {
                container.innerHTML = guideData.desc_ur;

        // Example usage: Trigger this when a user clicks a "Switch to Urdu" button
        // updateGuideLanguage('ur');

            // Hide the h2 title — welcome renders its own heading

            document.getElementById('content-desc').innerHTML = `
        <span class="welcome-eyebrow anim-1">${d.eyebrow}</span>

        </div>

        /* ═══════════════════════════════════════════════════
           SIDEBAR
        ═══════════════════════════════════════════════════ */
        function initSidebar() {
            const sections = [
                { key: 'Fundemental', navId: 'fundemental-nav' },
                { key: 'criminal', navId: 'criminal-nav' },
                { key: 'civil', navId: 'civil-nav' }
            ];

            sections.forEach(({ key, navId }) => {
                const nav = document.getElementById(navId);
                if (!nav) return;
                nav.innerHTML = '';

                legalData[key].forEach((item, index) => {
                    const group = document.createElement('li');
                    group.className = 'category-group';
                    const label = currentLang === 'en' ? item.en : (item.ur || item.en);
                    let subItems = '';

                    if (item.subs && item.subs.length) {
                        item.subs.forEach((sub, subIndex) => {
                            const subLabel = currentLang === 'en' ? sub.en : (sub.ur || sub.en);
                            subItems += `<li class="sub-item" onclick="showSubContent('${key}',${index},${subIndex})">${subLabel}</li>`;
                        });
                    } else {
                        const viewLabel = currentLang === 'en' ? 'View Details' : 'تفصیلات دیکھیں';
                        subItems = `<li class="sub-item" onclick="showContent('${key}',${index})">${viewLabel}</li>`;
                    }

                    group.innerHTML = `
                <div class="category-header" onclick="this.parentElement.classList.toggle('open')">
                    <span>${label}</span>
                    <span class="arrow">▶</span>
                </div>
                <ul class="sub-menu">${subItems}</ul>`;

                    nav.appendChild(group);
                });
            });
        }

        /* ═══════════════════════════════════════════════════
           CONTENT DISPLAY
        ═══════════════════════════════════════════════════ */
        function showContent(category, index) {
            const item = legalData[category][index];
            const titleEl = document.getElementById('content-title');
            titleEl.style.display = 'block';
            titleEl.innerText = currentLang === 'en' ? item.en : (item.ur || item.en);
            document.getElementById('content-desc').innerHTML = item.desc;
            document.getElementById('steps-container').innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showSubContent(category, index, subIndex) {
            const sub = legalData[category][index].subs[subIndex];
            const titleEl = document.getElementById('content-title');
            titleEl.style.display = 'block';
            titleEl.innerText = currentLang === 'en' ? sub.en : (sub.ur || sub.en);
            document.getElementById('content-desc').innerHTML = sub.desc;
            document.getElementById('steps-container').innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* ═══════════════════════════════════════════════════
           LANGUAGE TOGGLE
        ═══════════════════════════════════════════════════ */
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ur' : 'en';
            document.documentElement.dir = currentLang === 'ur' ? 'rtl' : 'ltr';
            document.querySelector('.lang-toggle').innerText =
                currentLang === 'ur' ? 'View in English' : 'اردو میں دیکھیں';
            initSidebar();
            renderWelcome();
        }

        /* ═══════════════════════════════════════════════════
           DIYAT CALCULATOR
        ═══════════════════════════════════════════════════ */
        function calc(percent) {
            const total = document.getElementById('diyatAmount').value;
            if (total) {
                document.getElementById('result').innerHTML =
                    'Estimated Payout: Rs. ' + (total * percent).toLocaleString();
            } else {

        }

        /* ═══════════════════════════════════════════════════
           INIT

            initSidebar();

    </script>
